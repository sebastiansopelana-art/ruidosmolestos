<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 425" aria-label="MEGAHERTZ AUTOMATIC RADIO SYSTEM" role="img">
<defs>
  <linearGradient id="chrome" x1=".15" y1="0" x2=".86" y2="1"><stop stop-color="#eaffff"/><stop offset=".16" stop-color="#83ffff"/><stop offset=".37" stop-color="#b9ffff"/><stop offset=".51" stop-color="#0dd7ff"/><stop offset=".69" stop-color="#087e9f"/><stop offset=".82" stop-color="#83ffff"/><stop offset="1" stop-color="#0dd7ff"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5ffff"/><stop offset=".26" stop-color="#83ffff"/><stop offset=".48" stop-color="#caffff"/><stop offset=".5" stop-color="#0dd7ff"/><stop offset=".84" stop-color="#096c87"/><stop offset="1" stop-color="#46f7ff"/></linearGradient>
  <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0dd7ff"/><stop offset=".48" stop-color="#83ffff"/><stop offset="1" stop-color="#09b8ff"/></linearGradient>
  <filter id="shadow" x="-25%" y="-40%" width="150%" height="190%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="bright" x="-70%" y="-90%" width="240%" height="280%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="mClip"><path d="M52 352V58H101L184 158L269 58H322V352H258V170L184 254L115 170V352Z"/></clipPath>
</defs>
<!-- Transparent canvas, no backing rectangle -->
<g transform="translate(0 0)">
  <path d="M52 352V58H101L184 158L269 58H322V352H258V170L184 254L115 170V352Z" stroke="#0dd7ff" stroke-width="11" fill="none" opacity=".58" filter="url(#shadow)"/>
  <path d="M52 352V58H101L184 158L269 58H322V352H258V170L184 254L115 170V352Z" fill="url(#chrome)" stroke="#0dd7ff" stroke-width="6" stroke-linejoin="miter"/>
  <path d="M62 70L183 223L311 70 M62 340V95 M310 96V340" stroke="#d2ffff" stroke-width="5" fill="none" opacity=".84"/>
  <path d="M119 165L184 244L252 166" stroke="#0dd7ff" stroke-width="7" fill="none"/>
</g>
<text x="380" y="111" fill="#83ffff" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="500" letter-spacing="7" textLength="1188" lengthAdjust="spacingAndGlyphs">AUTOMATIC RADIO SYSTEM</text>
<path d="M380 129H1588" stroke="#0dd7ff" stroke-width="2" opacity=".85"/>
<text x="379" y="307" textLength="1201" lengthAdjust="spacingAndGlyphs" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="202" font-weight="900" fill="#0dd7ff" stroke="#079cbd" stroke-width="10" opacity=".6" filter="url(#shadow)">EGAHERTZ</text>
<text x="379" y="307" textLength="1201" lengthAdjust="spacingAndGlyphs" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="202" font-weight="900" fill="url(#metal)" stroke="#0dd7ff" stroke-width="3" paint-order="stroke fill">EGAHERTZ</text>
<!-- Electric pulse travels from the M through the E, without animating entire logo -->
<path id="ray" d="M14 228H113L137 194L158 249L182 215H353L381 188L407 245L440 214H570L610 190L650 246L692 216H1580" stroke="#0dd7ff" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity=".46" filter="url(#shadow)"/>
<path d="M14 228H113L137 194L158 249L182 215H353L381 188L407 245L440 214H570L610 190L650 246L692 216H1580" stroke="url(#bolt)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
<path d="M14 228H113L137 194L158 249L182 215H353L381 188L407 245L440 214H570L610 190L650 246L692 216H1580" stroke="#e1ffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-dasharray="46 870" opacity="0" filter="url(#bright)">
  <animate attributeName="stroke-dashoffset" values="155;-810;-810" keyTimes="0;.62;1" dur="2.9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.5;.67;1" dur="2.9s" repeatCount="indefinite"/>
</path>
<path d="M14 228H113L137 194L158 249L182 215H353L381 188L407 245L440 214H570L610 190L650 246L692 216H1580" stroke="#86efff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="56 870" opacity="0">
  <animate attributeName="stroke-dashoffset" values="155;-810;-810" keyTimes="0;.62;1" dur="2.9s" begin=".22s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.5;.67;1" dur="2.9s" begin=".22s" repeatCount="indefinite"/>
</path>
<!-- The pulse reaches Z, drops, charges the signature, then holds it legibly. -->
<defs>
 <linearGradient id="signatureEnergy" x1="1" y1="0" x2="0" y2="0">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#a8fff3"/><stop offset="1" stop-color="#45cbd7"/>
 </linearGradient>
 <clipPath id="signatureCharge">
  <rect x="1594" y="346" width="0" height="69">
   <animate attributeName="x" values="1594;1594;888;888;1594" keyTimes="0;.25;.7;.98;1" dur="7s" repeatCount="indefinite"/>
   <animate attributeName="width" values="0;0;706;706;0" keyTimes="0;.25;.7;.98;1" dur="7s" repeatCount="indefinite"/>
  </rect>
 </clipPath>
</defs>
<path id="signatureWire" d="M1580 216L1618 244V348Q1618 365 1595 365H896" fill="none" stroke="#17677c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1580 216L1618 244V348Q1618 365 1595 365H896" fill="none" stroke="#89ffed" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="44 1500" filter="url(#bright)">
 <animate attributeName="stroke-dashoffset" values="0;-780;-780" keyTimes="0;.25;1" dur="7s" repeatCount="indefinite"/>
 <animate attributeName="opacity" values="0;1;1;.15;0" keyTimes="0;.02;.24;.7;1" dur="7s" repeatCount="indefinite"/>
</path>
<g aria-label="Powered by Sebastián Sopelana">
 <rect x="882" y="346" width="730" height="67" rx="8" fill="#061c2d" fill-opacity=".82" stroke="#2c8795" stroke-width="1"/>
 <path d="M898 404H1595" fill="none" stroke="#175b69" stroke-width="2"/>
 <!-- Dim legible resting state. -->
 <text x="919" y="391" fill="#82cbd3" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="1.1">POWERED BY</text>
 <text x="1145" y="392" fill="#a4dbe2" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="800" textLength="443" lengthAdjust="spacingAndGlyphs">SEBASTIÁN SOPELANA</text>
 <!-- Charged letters remain on after the moving energy reaches them. -->
 <g clip-path="url(#signatureCharge)">
  <path d="M897 405H1594" fill="none" stroke="#79ffed" stroke-width="3" filter="url(#bright)"/>
  <text x="919" y="391" fill="#f2ffff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" letter-spacing="1.1">POWERED BY</text>
  <text x="1145" y="392" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="900" textLength="443" lengthAdjust="spacingAndGlyphs">SEBASTIÁN SOPELANA</text>
 </g>
 <!-- The charging head moves left as the signature lights up. -->
 <g opacity="0" filter="url(#bright)">
  <ellipse cx="1594" cy="378" rx="8" ry="24" fill="#aafff1"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-706 0;-706 0;0 0" keyTimes="0;.25;.7;.98;1" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.29;.71;1" dur="7s" repeatCount="indefinite"/>
 </g>
 <path d="M891 410H1594" stroke="#bafff6" stroke-width="3" opacity="0" filter="url(#bright)">
  <animate attributeName="opacity" values="0;0;0;.8;.22;0" keyTimes="0;.69;.72;.75;.95;1" dur="7s" repeatCount="indefinite"/>
 </path>
</g>
<style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style>
</svg>