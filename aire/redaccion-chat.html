<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REDACCIÓN · Ruidos Molestos</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090e12;color:#eaf1f5}header{padding:16px 22px;border-bottom:1px solid #334652;display:flex;align-items:center;justify-content:space-between;gap:12px}header b{font-size:22px;letter-spacing:1px}header small{display:block;color:#95a9b6;margin-top:4px}button{cursor:pointer;background:#213541;border:1px solid #526e7e;border-radius:5px;color:#f1f6f8;padding:10px 14px;font-weight:700}.work{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(400px,1.15fr);height:calc(100dvh - 79px);min-height:470px}.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid #334652}.chathead,.dochead{padding:13px 17px;border-bottom:1px solid #334652;display:flex;justify-content:space-between;align-items:center;gap:10px}.chathead span,.dochead span{color:#9fb1bd;font-size:12px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.msg{white-space:pre-wrap;line-height:1.55;padding:13px 15px;border-radius:9px;max-width:94%;font-size:14px}.msg.user{background:#264b5b;align-self:flex-end}.msg.assistant{background:#1a2832;align-self:flex-start}.compose{padding:12px;border-top:1px solid #334652;display:flex;gap:9px;align-items:flex-end}.compose textarea{resize:vertical;min-height:58px;max-height:180px;flex:1;background:#101c24;border:1px solid #496171;border-radius:5px;color:#fff;padding:11px;font:15px Arial}.compose button{height:49px}.doc{display:flex;flex-direction:column;min-height:0}.dochead label{display:flex;align-items:center;gap:7px}.dochead input{width:65px;background:#17252f;color:#fff;border:1px solid #526e7e;padding:7px;font-size:15px}.dochead button{padding:8px 10px}.doc textarea{flex:1;resize:none;background:#e8e2d7;color:#1d1b19;border:0;padding:27px 34px;font:17px/1.7 Georgia,serif;min-height:0}.notice{padding:7px 17px;color:#94acba;font-size:11px;border-top:1px solid #334652}@media(max-width:850px){.work{display:flex;flex-direction:column;height:auto}.chat{height:65dvh;min-height:390px;border-right:0;border-bottom:1px solid #334652}.doc{height:75dvh;min-height:450px}.dochead{flex-wrap:wrap}header b{font-size:17px}}
</style></head><body><header><div><b>RUIDOS MOLESTOS · REDACCIÓN</b><small>ASISTENTE DE PRODUCCIÓN · LIBRETO DE TRABAJO</small></div><button id="back">← PRODUCCIÓN</button></header><main class="work"><section class="chat"><div class="chathead"><b>CONVERSACIÓN</b><span id="state">LISTO</span></div><div class="messages" id="messages"></div><form id="compose" class="compose"><textarea id="question" placeholder="Escribime lo que querés trabajar…" required></textarea><button id="send">ENVIAR</button></form></section><section class="doc"><div class="dochead"><label>PROGRAMA <input id="number" type="number" min="1" max="999" value="43"></label><span id="saveState">SIN CAMBIOS</span><button id="load">CARGAR</button><button id="insert">PASAR ÚLTIMA RESPUESTA AL LIBRETO</button><button id="save">GUARDAR</button></div><textarea id="script" spellcheck="false" placeholder="Libreto del programa…"></textarea><div class="notice">Los borradores y el historial se guardan en este navegador. La IA no modifica el libreto sin tu orden.</div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),K='rm_pass',D='rm_session_day',O='rm_after22_until';
function valid(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const x=Object.fromEntries(p.map(v=>[v.type,v.value]));return sessionStorage.getItem(K)==='ok'&&sessionStorage.getItem(D)===x.year+'-'+x.month+'-'+x.day&&(Number(x.hour)<22||Date.now()<Number(sessionStorage.getItem(O)||0))}
function guard(){if(!valid()){sessionStorage.removeItem(K);sessionStorage.removeItem(D);sessionStorage.removeItem(O);location.replace('/aire/');return false}return true}if(!guard())return;setInterval(guard,15000);addEventListener('focus',guard);document.addEventListener('visibilitychange',()=>{if(!document.hidden)guard()});
const num=$('number');let messages=[],last='',busy=false;const key=()=> 'rm_redaccion_chat_'+num.value,docKey=()=> 'rm_redaccion_text_'+num.value;
function add(role,content){const el=document.createElement('div');el.className='msg '+role;el.textContent=content;$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight}
function refresh(){messages=JSON.parse(localStorage.getItem(key())||'[]');$('messages').replaceChildren();if(!messages.length)add('assistant','Hola, Sope. Acá trabajamos Ruidos Molestos. Decime qué historia o parte del programa querés preparar.');else messages.forEach(m=>add(m.role,m.content));last=[...messages].reverse().find(m=>m.role==='assistant')?.content||'';$('script').value=localStorage.getItem(docKey())||'';$('saveState').textContent='PROGRAMA '+num.value}
async function load(){refresh();if($('script').value)return;try{const r=await fetch('/aire/programas/'+num.value+'.txt');if(r.ok){$('script').value=await r.text();$('saveState').textContent='CARGADO · SIN GUARDAR'}}catch(_){}}
num.addEventListener('change',()=>{num.value=String(Math.min(999,Math.max(1,Number(num.value)||43)));load()});$('load').onclick=load;
$('save').onclick=()=>{localStorage.setItem(docKey(),$('script').value);$('saveState').textContent='GUARDADO EN ESTE NAVEGADOR'};$('script').addEventListener('input',()=>{$('saveState').textContent='CAMBIOS SIN GUARDAR'});
$('insert').onclick=()=>{if(!last)return;const t=$('script');t.value+=(t.value?'\n\n':'')+last;$('saveState').textContent='CAMBIOS SIN GUARDAR';t.focus()};
$('back').onclick=()=>location.assign('/aire/');
$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('compose').requestSubmit()}});
$('compose').onsubmit=async e=>{e.preventDefault();if(busy||!guard())return;const q=$('question').value.trim();if(!q)return;busy=true;$('send').disabled=true;$('state').textContent='ESCRIBIENDO…';$('question').value='';messages.push({role:'user',content:q});add('user',q);localStorage.setItem(key(),JSON.stringify(messages.slice(-40)));try{const r=await fetch('/api/redaccion-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.slice(-18),program:Number(num.value),draft:$('script').value.slice(-14000)})});const data=await r.json();if(!r.ok)throw Error(data.error||'No se pudo conectar');last=data.reply||'Sin respuesta';messages.push({role:'assistant',content:last});add('assistant',last);localStorage.setItem(key(),JSON.stringify(messages.slice(-40)))}catch(err){add('assistant','No pude responder: '+err.message+'. Tu mensaje quedó guardado; podés reenviarlo.') }finally{busy=false;$('send').disabled=false;$('state').textContent='LISTO'}};load();
})();
</script></body></html>
