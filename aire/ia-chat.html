<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IA · Ruidos Molestos</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e12;color:#edf3f6;font:14px Arial}header{height:70px;padding:12px 20px;border-bottom:1px solid #344956;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px}header span{display:block;color:#8fa6b4;font-size:10px;letter-spacing:1.5px;margin-top:4px}button{background:#1b2c36;color:#fff;border:1px solid #526b79;border-radius:5px;padding:10px 14px;font-weight:800;cursor:pointer}main{height:calc(100dvh - 70px);display:flex;flex-direction:column;max-width:1050px;margin:auto}.bar{padding:10px 14px;border-bottom:1px solid #2e424e;display:flex;gap:10px;align-items:center}.bar input{width:70px;background:#13222b;color:#fff;border:1px solid #4b6675;padding:8px}.bar span{margin-left:auto;color:#91a8b6;font-size:11px}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}.msg{padding:13px 15px;border-radius:9px;line-height:1.55;white-space:pre-wrap;max-width:88%}.user{align-self:flex-end;background:#285064}.assistant{align-self:flex-start;background:#182832}.compose{padding:13px;border-top:1px solid #344956;display:flex;gap:9px;align-items:flex-end}.compose textarea{flex:1;min-height:64px;max-height:190px;resize:vertical;background:#101c24;color:#fff;border:1px solid #496171;border-radius:5px;padding:11px;font:15px Arial}.compose button{height:50px}@media(max-width:650px){header b{font-size:17px}.msg{max-width:96%}.bar{flex-wrap:wrap}}</style></head><body><header><div><b>RUIDOS MOLESTOS · INTELIGENCIA ARTIFICIAL</b><span>CONVERSACIÓN DE PRODUCCIÓN</span></div><button id="back">← PRODUCCIÓN</button></header><main><div class="bar"><label>PROGRAMA <input id="number" type="number" min="1" max="999" value="43"></label><button id="clear">NUEVA CONVERSACIÓN</button><span id="state">LISTO</span></div><div id="messages" class="messages"></div><form id="compose" class="compose"><textarea id="q" placeholder="Escribime lo que querés trabajar…" required></textarea><button id="send">ENVIAR</button></form></main><script>
(()=>{const $=x=>document.getElementById(x),K='rm_pass',D='rm_session_day',O='rm_after22_until';function valid(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),x=Object.fromEntries(p.map(v=>[v.type,v.value]));return sessionStorage.getItem(K)==='ok'&&sessionStorage.getItem(D)===x.year+'-'+x.month+'-'+x.day&&(Number(x.hour)<22||Date.now()<Number(sessionStorage.getItem(O)||0))}function guard(){if(valid())return true;sessionStorage.clear();location.replace('/aire/');return false}if(!guard())return;setInterval(guard,15000);let msgs=[],busy=false;const key=()=> 'rm_ai_chat_'+$('number').value;function add(r,t){const d=document.createElement('div');d.className='msg '+r;d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}function load(){msgs=JSON.parse(localStorage.getItem(key())||'[]');$('messages').replaceChildren();if(!msgs.length)add('assistant','Hola, Sope. Acá trabajamos la producción de Ruidos Molestos. ¿Qué hacemos?');else msgs.forEach(m=>add(m.role,m.content))}$('number').onchange=load;$('clear').onclick=()=>{localStorage.removeItem(key());load()};$('back').onclick=()=>location.assign('/aire/');$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('compose').requestSubmit()}};$('compose').onsubmit=async e=>{e.preventDefault();if(busy)return;const q=$('q').value.trim();if(!q)return;busy=true;$('send').disabled=true;$('state').textContent='ESCRIBIENDO…';$('q').value='';msgs.push({role:'user',content:q});add('user',q);localStorage.setItem(key(),JSON.stringify(msgs.slice(-40)));try{const r=await fetch('/api/redaccion-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({program:Number($('number').value),messages:msgs.slice(-18)})}),d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo conectar');msgs.push({role:'assistant',content:d.reply});add('assistant',d.reply);localStorage.setItem(key(),JSON.stringify(msgs.slice(-40)))}catch(x){add('assistant','No pude responder: '+x.message)}finally{busy=false;$('send').disabled=false;$('state').textContent='LISTO'}};load()})();
</script></body></html>
