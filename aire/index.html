<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRODUCCIÓN · Ruidos Molestos</title>
<style>
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:#0b0b0b;font-family:Arial,sans-serif}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:white}
.box{width:100%;max-width:420px;text-align:center}.box h1{font-family:Georgia,serif;font-size:42px;margin:0 0 12px}.box p{color:#aaa}
input{width:100%;font-size:32px;text-align:center;letter-spacing:10px;padding:16px;margin:18px 0;background:#171717;border:1px solid #777;color:white}
button{cursor:pointer;padding:15px 22px;background:#111;color:white;border:1px solid #777;font-weight:bold}
#login button{width:100%}#error{color:#ddd;min-height:24px}
#page{min-height:100vh;background:#101010;color:#171717;position:relative;isolation:isolate}#page:before,#page:after{content:'';position:fixed;top:0;bottom:0;width:max(0px,calc((100vw - 1240px)/2));background-size:cover;background-position:center;filter:grayscale(1) brightness(.65);z-index:-1;pointer-events:none}#page:before{left:0;background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Stevie_Ray_Vaughan_Live_1983.jpg?width=900')}#page:after{right:0;background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Stevie_Ray_Vaughan_Ritz_-_behind_the_back_-_making_a_face.jpg?width=900')}
.top{position:sticky;top:0;background:#111;color:white;padding:12px;display:flex;gap:8px;align-items:center;justify-content:center;z-index:2}
.top button{padding:10px 16px}.paper{max-width:1240px;margin:auto;padding:70px 7vw 120px;min-height:100vh;background:#eae5db;box-shadow:0 0 45px #000}
#text{font-family:Georgia,serif;font-size:32px;line-height:1.7}#text .line{white-space:pre-wrap}#text .voice-emphasis{font-weight:800}#text .program-title{font-size:1.65em;font-weight:800;line-height:1.15;margin:0 0 30px}#text .chapter-title{font-size:1.45em;font-weight:800;line-height:1.15;margin:55px 0 22px}#text .section-title{font-size:1.18em;font-weight:800;margin:35px 0 16px}#text .music-note{font-size:.92em;line-height:1.6;margin:12px 0 18px;padding-left:18px;border-left:3px solid #777}
textarea{width:100%;min-height:75vh;border:0;outline:0;background:transparent;resize:none;font-family:Georgia,serif;font-size:28px;line-height:1.7;color:#171717}
@media(max-width:600px){.paper{padding:45px 22px 100px}#text{font-size:25px}.box h1{font-size:34px}}

#hub{min-height:100vh;color:#edf2f5;background:radial-gradient(circle at 50% 0,#17242d 0,#090d10 48%,#050708 100%);padding:24px;display:flex;align-items:center;justify-content:center}
.hubwrap{width:min(920px,100%)}.hubbrand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.hubbrand img{width:58px;height:58px;border-radius:7px}.brandmark{display:flex!important;flex-direction:column;align-items:center;flex:0 0 auto}.brandmark small{display:block;font-size:9px;line-height:1.15;letter-spacing:.2px;color:#b8c2c8;margin-top:4px;white-space:nowrap;text-transform:none}.hubbrand>div:not(.brandmark){display:grid}.hubbrand b{font-size:27px;letter-spacing:1px}.hubbrand span{font-size:10px;letter-spacing:2px;color:#8fa3af;margin-top:4px}
.hubgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hubcard{height:390px;min-height:390px;text-align:left;padding:16px!important;border:1px solid #40515d!important;background:linear-gradient(145deg,#17232b,#0d1418)!important;border-radius:9px!important;display:grid;grid-template-rows:190px 62px 52px 1fr;align-items:start;box-shadow:inset 0 1px #ffffff0c,0 14px 30px #0005;overflow:hidden}.hubcard:hover{border-color:#79a9c8!important;transform:translateY(-1px)}.hubcard.studio{background:linear-gradient(145deg,#1b252b,#111619)!important}.hubiconwrap{position:relative;width:100%;height:190px}.hubcard img.hubicon{width:100%;height:190px;object-fit:cover;border-radius:8px;margin:0;border:1px solid #ffffff18;align-self:start}.hubiconwrap .creator{position:absolute;left:0;right:0;bottom:7px;margin:0!important;text-align:center;font-size:8px!important;line-height:1!important;letter-spacing:1.2px;color:#d8e1e6!important;text-shadow:0 1px 4px #000,0 1px 8px #000;font-weight:700}.hubcard strong{font-size:25px;line-height:1.08;letter-spacing:1px;margin:15px 0 0;display:flex;align-items:flex-start}.hubcard span{font-size:13px!important;line-height:1.35;color:#a9bac4!important;margin:6px 0 0!important;align-self:start}.hubcard small{font-weight:900;color:#9fd5f3;letter-spacing:.8px;align-self:end;margin:0}.instanceNote{margin-top:12px;padding:10px 12px;border:1px solid #263640;border-radius:5px;background:#0b1115;color:#82949f;font-size:10px;letter-spacing:.7px}.hubexit{margin-top:12px!important;padding:8px 14px!important;font-size:10px!important}
@media(max-width:650px){.hubgrid{grid-template-columns:1fr}.hubcard{height:390px;min-height:390px}.hubbrand b{font-size:21px}}
.after22{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 4px}.after22 button{padding:10px 14px;border-color:#6d7780;background:#171b1e}.after22 span{font-size:11px;color:#8f9aa1;letter-spacing:.6px}.after22.active button{border-color:#a78a48;color:#ffe2a0}.after22.active span{color:#d7bc7a}

/* PRODUCCIÓN — consola editorial: identidad propia, sin modificar Estudio ni Redacción. */
#hub{background:radial-gradient(ellipse at 12% 12%,#1b3440 0,transparent 42%),radial-gradient(ellipse at 92% 85%,#172a32 0,transparent 45%),repeating-linear-gradient(0deg,transparent 0 39px,#ffffff05 40px),#080d11;position:relative;overflow:hidden}
#hub:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 20%,#9ed3e509 48%,transparent 70%);opacity:.85}
#hub .hubwrap{width:min(1060px,100%);position:relative;padding:24px 0}
#hub .hubbrand{padding:0 0 22px;margin-bottom:28px;border-bottom:1px solid #7897a64d;gap:20px}
#hub .hubbrand img{width:70px;height:70px;box-shadow:0 0 0 1px #b1c5d24d,0 12px 25px #0009}
#hub .hubbrand b{font-family:Georgia,serif;font-size:clamp(26px,4vw,42px);letter-spacing:1.7px;color:#f0ede3}
#hub .hubbrand span{font-size:11px;letter-spacing:3px;color:#96c8d7}
#hub .hubgrid{gap:24px}
#hub .hubcard{height:460px;min-height:460px;grid-template-rows:255px 66px 64px 1fr;padding:18px!important;position:relative;border-radius:3px!important;border:1px solid #56717e!important;background:linear-gradient(155deg,#22343e,#0c151b 75%)!important;box-shadow:0 24px 55px #0009,inset 0 1px #ffffff16;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
#hub .hubcard.studio{background:linear-gradient(155deg,#28343b,#0d1419 75%)!important}
#hub .hubcard:before{content:"";position:absolute;inset:7px;border:1px solid #c9d6d519;pointer-events:none}
#hub .hubcard:after{content:"01 / ARCHIVO";position:absolute;top:28px;left:30px;padding:7px 10px;background:#09151bd9;color:#d7e8e9;font-size:10px;letter-spacing:2px;border:1px solid #d6e3e633;pointer-events:none}
#hub .hubcard.studio:after{content:"02 / CONTROL"}
#hub #openRmr:after{content:"03 / TECNOLOGÍA"}
#hub .hubcard:hover,#hub .hubcard:focus-visible{transform:translateY(-5px);border-color:#c2d8dd!important;box-shadow:0 28px 65px #000c,0 0 0 1px #9fc5d43d}
#hub .hubcard img.hubicon,#hub .hubiconwrap{height:255px}
#hub .hubcard img.hubicon{border-radius:2px;filter:saturate(.7) contrast(1.09);border:1px solid #b9cdd14a}
#hub .hubcard strong{font-family:Georgia,serif;font-size:clamp(26px,3vw,35px);letter-spacing:2px;color:#f2efe7;margin:15px 0 0}
#hub .hubcard span{color:#bbcad0!important;font-size:14px!important;line-height:1.5}
#hub .hubcard small{color:#b4dce6;letter-spacing:1.4px;font-size:11px;padding-bottom:5px}
#hub .hubiconwrap .creator{bottom:9px;color:#fff!important;background:#071015a8;padding:5px 3px}
#hub .instanceNote{margin-top:22px;padding:12px 16px;border-radius:2px;border-left:3px solid #8cb6c5;color:#b1c0c5;background:#0c171dcf;letter-spacing:1px}
#hub .hubexit{background:transparent;border-color:#546b75;color:#c0cdd0}
@media(max-width:650px){#hub{padding:18px}#hub .hubwrap{padding:12px 0}#hub .hubbrand{gap:13px;margin-bottom:20px}#hub .hubbrand img{width:56px;height:56px}#hub .hubbrand b{font-size:24px}#hub .hubbrand span{font-size:9px;letter-spacing:2px}#hub .hubgrid{gap:17px}#hub .hubcard{height:405px;min-height:405px;grid-template-rows:210px 58px 65px 1fr}#hub .hubcard img.hubicon,#hub .hubiconwrap{height:210px}#hub .hubcard strong{font-size:28px}}
@media(prefers-reduced-motion:reduce){#hub .hubcard{transition:none}}

</style>
</head>
<body>
<section id="login">
 <div class="box"><h1>PRODUCCIÓN</h1><p>Ingresá tu código</p>
 <input id="pass" type="password" inputmode="numeric" maxlength="4" autofocus>
 <button id="enter">ENTRAR</button><div id="error"></div></div>
</section>
<section id="hub" hidden>
 <div class="hubwrap">
  <div class="hubbrand"><div class="brandmark"><img src="/icon-192.png" alt=""><small>Creado por Sebastián Sopelano</small></div><div><b>RUIDOS MOLESTOS</b><span>PRODUCCIÓN · BETA 2</span></div></div>
  <div class="hubgrid">
   <button id="openRedaccion" class="hubcard"><img class="hubicon" src="/aire/icons/redaccion.svg" alt=""><strong>REDACCIÓN</strong><span>Libretos, historias y lectura al aire</span><small>ABRIR REDACCIÓN →</small></button>
   
   <button id="openStudio" class="hubcard studio"><div class="hubiconwrap"><img class="hubicon" src="/aire/icons/estudio.svg" alt=""><span class="creator">CREADO POR SEBASTIÁN SOPELANA</span></div><strong>ESTUDIO</strong><span>Reproductores, bloques, separadores y producción</span><small>ABRIR RUIDOS MOLESTOS ESTUDIO →</small></button>
   <button id="openRmr" class="hubcard studio"><div class="hubiconwrap"><img class="hubicon" src="/aire/icons/estudio.svg" alt=""><span class="creator">LABORATORIO DE SOFTWARE RADIAL</span></div><strong>RMR TECNOLOGY</strong><span>Studio 2.0 · Maqueta interactiva, publicidad y música 24 horas</span><small>PROBAR MAQUETA →</small></button>
  </div>
  <div class="instanceNote">MULTIINSTANCIA · Cada computadora o pestaña trabaja de forma independiente.</div>
  <div class="after22"><button id="after22Btn" type="button">SESIÓN SIN CIERRE AUTOMÁTICO</button><span id="after22State">Cierre automático: 22:00</span></div>
  <button id="hubExit" class="hubexit">SALIR</button>
 </div>
</section>
<script>
(function(){
 const login=document.getElementById('login'),hub=document.getElementById('hub'),pass=document.getElementById('pass'),error=document.getElementById('error');
 const KEY='rm_pass';
 function show(){login.hidden=true;hub.hidden=false}
 function enter(){if(pass.value==='0253'){sessionStorage.setItem(KEY,'ok');show()}else{error.textContent='Código incorrecto';pass.value='';pass.focus()}}
 document.getElementById('enter').onclick=enter;
 pass.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
 if(sessionStorage.getItem(KEY)==='ok')show();
 document.getElementById('openRedaccion').onclick=()=>location.assign('/aire/redaccion.html');
 document.getElementById('openRmr').onclick=()=>location.assign('/aire/rmr-tecnology.html');
 document.getElementById('openStudio').onclick=()=>location.assign('/aire/studio-music.html?instance='+Date.now());
 document.getElementById('hubExit').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};
 const btn=document.getElementById('after22Btn'),state=document.getElementById('after22State');
 if(btn)btn.onclick=()=>{state.textContent='SESIÓN ABIERTA HASTA QUE SALGAS'};
 if(state)state.textContent=sessionStorage.getItem(KEY)==='ok'?'SESIÓN ABIERTA HASTA QUE SALGAS':'INGRESÁ CON CONTRASEÑA';
})();
</script>
</body></html>
