(function(){
 const login=document.getElementById('login'),page=document.getElementById('page'),pass=document.getElementById('pass'),error=document.getElementById('error'),text=document.getElementById('text'),editor=document.getElementById('editor'),editBtn=document.getElementById('editBtn'),saveBtn=document.getElementById('saveBtn');
 let program43Text='';const PROGRAM43_KEY='rm_lectura_programa_43';
 const DEFAULT_PROGRAM="RUIDOS MOLESTOS\nPATRICIO REY Y SUS REDONDITOS DE RICOTA\nFM DEL LAGO 102.5 · 19 A 21 HS\nPRESENTA: SEBASTIÁN SOPELANA\nINVESTIGACIÓN, REDACCIÓN Y PRODUCCIÓN: SEBASTIÁN SOPELANA\n\nPRESENTACIÓN GENERAL\n\nBUENAS NOCHES. //\n\nHAY HISTORIAS DEL ROCK ARGENTINO QUE PUEDEN CONTARSE CON DISCOS, FECHAS Y ESCENARIOS. /\nY HAY OTRAS QUE, SI UNO LAS CUENTA SOLAMENTE ASÍ, PIERDEN LO MÁS IMPORTANTE. //\n\nPORQUE ALGUNAS BANDAS NO FUERON SOLAMENTE UN GRUPO DE MÚSICOS. /\nFUERON UNA MANERA DE ENCONTRARSE. /\nDE HABLAR ENTRE PERSONAS QUE NO SE CONOCÍAN. /\nDE RECONOCERSE EN UNA CANCIÓN SIN NECESIDAD DE EXPLICAR DEMASIADO. //\n\nESTA NOCHE NO VAMOS A ARMAR UN ALTAR. /\nTAMPOCO VAMOS A REPETIR UNA LEYENDA COMO SI TODO HUBIERA SIDO PERFECTO. //\n\nVAMOS A BUSCAR A LAS PERSONAS. /\nA LOS QUE ESTABAN ANTES DE LAS MULTITUDES. /\nA LOS QUE TRABAJARON PARA QUE LA MÚSICA EXISTIERA. /\nY A LOS QUE TUVIERON QUE APRENDER A VIVIR CUANDO AQUELLA HISTORIA CAMBIÓ PARA SIEMPRE. //\n\nTE HABLA SEBASTIÁN SOPELANA. /\nESTO ES RUIDOS MOLESTOS. /\nUN INSOPORTABLE PROGRAMA DE ROCK. /\nPOR FM DEL LAGO 102.5. //\n\nHOY, PATRICIO REY Y SUS REDONDITOS DE RICOTA. //\n\nCAPÍTULO 1\nANTES DE QUE EXISTIERAN LOS REDONDOS\n\nLA PLATA. / SEGUNDA MITAD DE LOS AÑOS SETENTA. //\n\nIMAGINATE ENTRAR A UN TEATRO CHICO SIN SABER EXACTAMENTE QUÉ VAS A VER. /\nHAY MÚSICOS. / HAY GENTE QUE HACE TEATRO. / HAY PERSONAJES QUE APARECEN Y DESAPARECEN. /\nALGUIEN PUEDE RECITAR UN TEXTO. / ALGUIEN PUEDE BAILAR. /\nY, EN MEDIO DE TODO ESO, SUENA UNA GUITARRA. //\n\nNO SE PARECE AL RECITAL QUE CONOCEMOS HOY. /\nNO HAY UNA BANDA QUE ENTRA, TOCA DOCE CANCIONES Y SE VA. /\nHAY UNA COMUNIDAD QUE ESTÁ PROBANDO HASTA DÓNDE PUEDE LLEGAR. //\n\nES LA ARGENTINA DE LA DICTADURA. /\nY ESO IMPORTA. / IMPORTA MUCHO. //\nPORQUE REUNIRSE, INVENTAR, HACER RUIDO Y NO PEDIR PERMISO NO ERAN GESTOS INOCENTES. /\nLA REPRESIÓN NO ERA UNA METÁFORA. / ESTABA EN LAS CALLES. //\n\nPARTE DE AQUEL MUNDO VENÍA DE LA COFRADÍA DE LA FLOR SOLAR, UNA EXPERIENCIA ARTÍSTICA Y COMUNITARIA PLATENSE. /\nAHÍ SE HABÍAN CRUZADO PERSONAS QUE NO SE CONFORMABAN CON DIVIDIR EL ARTE EN CASILLEROS. //\n\nCARLOS ALBERTO SOLARI, EL INDIO, HABÍA NACIDO EN PARANÁ EN 1949 Y CRECIDO EN LA PLATA. /\nSU CAMINO NO HABÍA SIDO EL DE UNA ESTRELLA FORMADA POR UNA COMPAÑÍA DISCOGRÁFICA. /\nHABÍA PASADO POR EXPERIENCIAS ARTÍSTICAS, TRABAJOS Y VIAJES. /\nENTRE ESOS VIAJES ESTUVO VALERIA DEL MAR, DONDE COMPARTIÓ UN TALLER DE ESTAMPADO CON GUILLERMO BEILINSON. //\n\nGUILLERMO TENÍA UN HERMANO. / EDUARDO BEILINSON. /\nEL MUNDO LO CONOCERÍA COMO **SKAY**. //\nY EN ESA RED DE AMISTADES APARECÍA TAMBIÉN CARMEN CASTRO. /\n**LA NEGRA POLI**. //\n\nES IMPORTANTE DETENERSE EN POLI. /\nPORQUE CUANDO SE HABLA DE UNA BANDA SUELE HABLARSE DEL QUE CANTA Y DEL QUE TOCA LA GUITARRA. /\nPERO HAY PROYECTOS QUE NO EXISTIRÍAN SIN ALGUIEN QUE LOS ORGANICE, LOS DEFIENDA Y LOS HAGA POSIBLES. //\n\nPOLI FUE UNA PIEZA CENTRAL DE ESA HISTORIA. /\nNO UN ADORNO AL COSTADO DEL ESCENARIO. /\nUNA PERSONA QUE PARTICIPÓ EN LAS DECISIONES, EN LA PRODUCCIÓN Y EN LA CONSTRUCCIÓN DE UNA INDEPENDENCIA QUE DESPUÉS SERÍA CASI UNA RELIGIÓN PARA LOS SEGUIDORES. //\n\nTAMBIÉN ESTABA RICARDO COHEN, **ROCAMBOLE**. /\nEL ARTISTA QUE MÁS TARDE DARÍA FORMA VISUAL A UN UNIVERSO ENTERO. /\nY ESTABA ENRIQUE SYMNS, PERIODISTA Y ESCRITOR, CUYA PRESENCIA AYUDÓ A DARLE A LOS PRIMEROS ESPECTÁCULOS UN TONO PROVOCADOR. //\n\nLOS PRIMEROS ENCUENTROS NO ERAN ORDENADOS. /\nLOS LLAMADOS LOZANAZOS, EN EL TEATRO LOZANO DE LA PLATA, MEZCLABAN ROCK, PERFORMANCE Y TEATRO. /\nLA IMPROVISACIÓN NO ERA UN ACCIDENTE. / ERA PARTE DEL PLAN. //\n\nY EL NOMBRE... /\nPATRICIO REY. //\n\nACÁ APARECE UNA DE LAS MEJORES IDEAS DE AQUELLA EXPERIENCIA. /\nNO HABÍA UN PATRICIO REY SENTADO EN UNA OFICINA DANDO ÓRDENES. /\nERA UNA FIGURA COLECTIVA, UNA PRESENCIA INVENTADA, UNA MANERA DE DECIR QUE LA AUTORÍA NO NECESITABA TENER SIEMPRE UNA CARA. //\n\nY LOS REDONDITOS DE RICOTA TERMINARON SIENDO EL NOMBRE DE AQUELLA TRIBU QUE TODAVÍA NO SABÍA QUÉ IBA A SER. //\n\nEL 6 DE ENERO DE 1978 TOCARON EN EL POLACO BAR DE SALTA. /\nEL INDIO RECORDARÍA AQUELLA PRESENTACIÓN COMO LA PRIMERA ANTE UN PÚBLICO QUE NO ERA SOLAMENTE EL DE SUS AMIGOS. /\nY TAMBIÉN COMO UNA EXPERIENCIA DESASTROSA. //\n\nESO ME GUSTA. /\nPORQUE CUANDO MIRAMOS UNA BANDA DESDE EL FINAL, NOS PARECE QUE TODO ESTABA ESCRITO. /\nPERO AQUELLA NOCHE NO HABÍA NINGUNA GARANTÍA DE NADA. /\nHABÍA MÁS ENTUSIASMO QUE ORGANIZACIÓN. /\nY UNA DISTANCIA ENORME ENTRE LO QUE IMAGINABAN Y LO QUE REALMENTE PODÍAN HACER. //\n\nDESPUÉS LLEGARON LAS DISPERSIONES. /\nALGUNOS SE FUERON A LA COSTA. / OTROS CAMBIARON DE VIDA. /\nLA REPRESIÓN Y LA PRECARIEDAD HACÍAN DIFÍCIL SOSTENER CUALQUIER PROYECTO. //\n\nPERO LA HISTORIA NO SE TERMINÓ. //\n\nA COMIENZOS DE LOS OCHENTA VOLVIERON A ENCONTRARSE. /\nY ESTA VEZ EMPEZÓ A TOMAR FORMA UNA BANDA MÁS RECONOCIBLE. //\n\nEN 1981 GRABARON MATERIAL EN LOS ESTUDIOS RCA. /\nENTRE ESAS GRABACIONES ESTABA SUPERLÓGICO. /\nLA COMPAÑÍA NO APOSTÓ POR ELLOS. //\n\nIMAGINATE ESA ESCENA. /\nUNA BANDA QUE TODAVÍA NO TIENE UN DISCO OFICIAL. /\nQUE INTENTA MOSTRAR LO QUE HACE. /\nY QUE RECIBE UNA RESPUESTA QUE, EN LA PRÁCTICA, SIGNIFICA QUE DEBE SEGUIR SOLA. //\n\nPARA MUCHOS GRUPOS, ESO HABRÍA SIDO EL FINAL DEL CAMINO. /\nPARA LOS REDONDOS, TERMINÓ SIENDO UNA CONFIRMACIÓN DE SU MANERA DE TRABAJAR. //\n\nLA RADIO AYUDÓ A QUE AQUELLAS GRABACIONES CIRCULARAN. /\nLOS CASSETTES CAMBIABAN DE MANOS. /\nLOS QUE LOS ESCUCHABAN NO SIEMPRE SABÍAN CÓMO ERA LA CARA DEL CANTANTE. /\nPERO RECORDABAN ESA VOZ. /\nY LA GUITARRA DE SKAY. //\n\nLOS ESPECTÁCULOS EMPEZARON A DEJAR ATRÁS PARTE DEL VARIETÉ. /\nLAS CANCIONES GANABAN ESPACIO. /\nY LA TRIBU SE CONVERTÍA, DE A POCO, EN UNA BANDA DE ROCK. //\n\nEN 1985 APARECIÓ **GULP!**. /\nNO FUE EL PRIMER INTENTO DE HACER MÚSICA. /\nFUE EL PRIMER DISCO QUE PUDO MOSTRARLE AL RESTO DEL PAÍS QUÉ ESTABAN HACIENDO. //\n\nAHÍ ESTABAN LA BESTIA POP, ÑAM FRI FRULI FALI FRU Y UN SONIDO QUE NO SE PARECÍA AL DE LAS BANDAS DE MODA. /\nNO TODO ERA PERFECTO. /\nPERO TODO TENÍA CARÁCTER. //\n\nY ALGO MÁS: EL DISCO SE HIZO SIN ENTREGAR EL CONTROL ARTÍSTICO A UNA GRAN EMPRESA. /\nESE DETALLE NO ERA UNA ANÉCDOTA ADMINISTRATIVA. /\nERA EL PRINCIPIO DE UNA RELACIÓN DISTINTA CON LA INDUSTRIA Y CON EL PÚBLICO. //\n\nSELECCIÓN MUSICAL — CAPÍTULO 1\n\nPRIMER TEMA: SUPERLÓGICO.\nLO ELEGIMOS PORQUE PERMITE ESCUCHAR A LA BANDA ANTES DE QUE TUVIERA UN DISCO EN LAS VIDRIERAS. / ES EL SONIDO DE UNA IDENTIDAD QUE YA EXISTÍA CUANDO TODAVÍA FALTABA EL RECONOCIMIENTO. //\n\nSEGUNDO TEMA: MARIPOSA PONTIAC / ROCK DEL PAÍS.\nLO ELEGIMOS PORQUE PERTENECE A ESA PRIMERA ÉPOCA EN QUE LOS REDONDOS ESTABAN PROBANDO SU LENGUAJE. / ESCUCHAMOS UNA BANDA QUE SE VA VOLVIENDO CADA VEZ MÁS RECONOCIBLE. //\n\nTERCER TEMA: ÑAM FRI FRULI FALI FRU.\nACÁ ENTRA EL HUMOR, EL DESCONTROL Y LA ENERGÍA DE LOS PRIMEROS RECITALES. / LO ELEGIMOS PORQUE NO TODO EN AQUEL MUNDO ERA OSCURIDAD Y MISTERIO. / TAMBIÉN HABÍA FIESTA. //\n\nCUARTO TEMA: LA BESTIA POP.\nCERRAMOS CON UNA DE LAS CANCIONES QUE AYUDARON A CONVERTIR EL SECRETO EN FENÓMENO. / LA ELEGIMOS PORQUE CONDENSA ESA MEZCLA DE IRONÍA, RITMO Y PERSONALIDAD QUE YA NO PODÍA CONFUNDIRSE CON NINGUNA OTRA BANDA. //\n\nCAPÍTULO 2\nEL DISCO QUE CAMBIÓ EL COLOR DE LA HISTORIA\n\nHAY UN MOMENTO EN LA VIDA DE ALGUNAS BANDAS EN QUE EL SEGUNDO DISCO IMPORTA MÁS QUE EL PRIMERO. //\n\nEL PRIMERO DEMUESTRA QUE EXISTEN. /\nEL SEGUNDO DEMUESTRA QUE TIENEN ALGO PARA DECIR. //\n\nEN 1986 LOS REDONDOS PUBLICARON **OKTUBRE**. /\nY LA ARGENTINA EN LA QUE APARECIÓ ESE DISCO ESTABA INTENTANDO RECONSTRUIRSE. //\n\nLA DICTADURA HABÍA TERMINADO EN 1983. /\nPERO EL PAÍS NO HABÍA BORRADO EL MIEDO, LA VIOLENCIA NI LAS HERIDAS DE UN DÍA PARA OTRO. /\nHABÍA UNA DEMOCRACIA NUEVA, MUCHAS PREGUNTAS Y UNA JUVENTUD QUE QUERÍA ENCONTRAR SU PROPIO LENGUAJE. //\n\nEL DISCO TENÍA UN SONIDO MÁS DURO. /\nY UNA IMAGEN IMPOSIBLE DE OLVIDAR. //\n\nROCAMBOLE CREÓ UNA PORTADA ROJA, NEGRA, DE FIGURAS HUMANAS EN MOVIMIENTO. /\nUNA IMAGEN QUE PARECÍA ESTAR HECHA PARA CONVERTIRSE EN BANDERA. //\n\nPERO LO INTERESANTE ES QUE NO SE TRATABA DE UNA CAMPAÑA PUBLICITARIA DISEÑADA PARA VENDER UN PRODUCTO. /\nERA UNA OBRA VISUAL QUE CONVERSABA CON LA MÚSICA. /\nLA TAPA Y LAS CANCIONES PARECÍAN HABLAR EL MISMO IDIOMA. //\n\nEN EL ESTUDIO, LA BANDA YA TENÍA MÁS EXPERIENCIA. /\nEL DINERO QUE HABÍAN CONSEGUIDO CON GULP! Y LOS RECITALES AYUDÓ A FINANCIAR LA NUEVA GRABACIÓN. /\nELEGIR QUÉ HACER CON ESE DINERO ERA UNA DECISIÓN ARTÍSTICA. /\nEN VEZ DE ENTREGAR EL PROYECTO, REINVERTÍAN EN ÉL. //\n\nESTABAN SKAY, EL INDIO, TITO FARGO, EL PIOJO ÁBALOS, SEMILLA BUCCIARELLI Y WILLY CROOK. /\nCADA UNO APORTABA ALGO QUE NO PODÍA REEMPLAZARSE SIMPLEMENTE CON OTRO INSTRUMENTISTA. //\n\nLA GUITARRA DE SKAY TENÍA UNA FORMA MUY PARTICULAR DE MOVERSE. /\nNO ERA SOLAMENTE UNA CUESTIÓN DE VELOCIDAD. /\nSUS FRASES PODÍAN SONAR ÁRABES, BLUSERAS, HIPNÓTICAS. /\nY LA VOZ DEL INDIO NO SE LIMITABA A CONTAR UNA HISTORIA. /\nA VECES PARECÍA ESCONDERLA. //\n\nESCUCHÁ PRESO EN MI CIUDAD. /\nNO NECESITA UNA EXPLICACIÓN ÚNICA PARA RESULTAR INQUIETANTE. /\nES UNA CANCIÓN QUE PUEDE CAMBIAR DE SIGNIFICADO SEGÚN QUIÉN LA ESCUCHE Y EN QUÉ MOMENTO DE SU VIDA LO HAGA. //\n\nY DESPUÉS ESTÁ JIJIJI. //\n\nHOY ES IMPOSIBLE ESCUCHARLA SIN PENSAR EN UNA MULTITUD SALTANDO. /\nPERO EN 1986 NADIE PODÍA SABER QUE ESA CANCIÓN TERMINARÍA CONVIRTIÉNDOSE EN UNO DE LOS RITUALES MÁS CONOCIDOS DEL ROCK ARGENTINO. //\n\nME INTERESA ESA DIFERENCIA. /\nUNA COSA ES LA CANCIÓN QUE UNOS MÚSICOS GRABAN EN UN ESTUDIO. /\nOTRA, MUY DISTINTA, ES LO QUE HACE EL PÚBLICO CON ELLA DURANTE LOS AÑOS SIGUIENTES. //\n\nEL PÚBLICO NO SOLAMENTE ESCUCHÓ A LOS REDONDOS. /\nEMPEZÓ A COMPLETARLOS. /\nHIZO BANDERAS. / VIAJÓ PARA VERLOS. / INTERCAMBIÓ CASSETTES. /\nCONVIRTIÓ FRASES DE LAS CANCIONES EN UNA FORMA DE HABLAR. //\n\nY AHÍ APARECIÓ UN PROBLEMA QUE IBA A CRECER CON EL TIEMPO. /\n¿CÓMO SE SOSTIENE UNA RELACIÓN TAN INTENSA CON MILES DE PERSONAS SIN QUE ESA RELACIÓN SE CONVIERTA EN UNA MAQUINARIA IMPOSIBLE DE CONTROLAR? //\n\nEN 1988 LLEGÓ **UN BAIÓN PARA EL OJO IDIOTA**. /\nLA FORMACIÓN HABÍA CAMBIADO. /\nSKAY QUEDABA COMO GUITARRISTA PRINCIPAL, CON SEMILLA BUCCIARELLI EN BAJO, SERGIO DAWI EN SAXO Y WALTER SIDOTTI EN BATERÍA. //\n\nESA FORMACIÓN APORTÓ UNA CONTUNDENCIA DISTINTA. /\nEL SONIDO ERA MÁS DIRECTO. /\nY LAS CANCIONES PARECÍAN HECHAS PARA VIAJAR DEL ESCENARIO A LA CALLE. //\n\nVENCEDORES VENCIDOS. /\nNOTICIAS DE AYER. /\nVAMOS LAS BANDAS. //\n\nLOS TÍTULOS EMPEZABAN A VIVIR EN LAS PAREDES, EN LAS CAMPERAS, EN LAS CONVERSACIONES. //\n\nPERO HABÍA UNA PARADOJA. /\nCUANTO MÁS GRANDES ERAN LOS REDONDOS, MÁS DIFÍCIL SE VOLVÍA MANTENER AQUELLA INTIMIDAD DE LOS PRIMEROS AÑOS. //\n\nEL GRUPO HABÍA NACIDO ENTRE AMIGOS, ACTORES Y MÚSICOS. /\nAHORA TENÍA QUE ORGANIZAR RECITALES PARA MULTITUDES. /\nY CADA DECISIÓN TENÍA CONSECUENCIAS QUE YA NO DEPENDÍAN SOLAMENTE DE LA MÚSICA. //\n\nEN 1989 APARECIÓ **¡BANG! ¡BANG! ESTÁS LIQUIDADO**. /\nOTRA TAPA INCONFUNDIBLE. /\nOTRA SERIE DE CANCIONES QUE SE QUEDARÍAN A VIVIR EN LA MEMORIA DEL PÚBLICO. //\n\nLA BANDA YA NO ERA UN SECRETO. /\nPERO SEGUÍA RECHAZANDO BUENA PARTE DE LOS MECANISMOS HABITUALES DE LA FAMA. //\n\nNO NECESITABA APARECER TODOS LOS DÍAS EN TELEVISIÓN PARA LLENAR UN LUGAR. /\nNO NECESITABA UNA FIGURA PÚBLICA QUE EXPLICARA CADA CANCIÓN. /\nY ESA AUSENCIA, LEJOS DE DISMINUIR EL INTERÉS, LO MULTIPLICABA. //\n\nSELECCIÓN MUSICAL — CAPÍTULO 2\n\nPRIMER TEMA: PRESO EN MI CIUDAD.\nLA ELEGIMOS PORQUE NOS DEJA ENTRAR EN EL CLIMA DE OKTUBRE SIN CONVERTIRLO EN UNA CONSIGNA SIMPLE. / HAY TENSIÓN, CIUDAD Y UNA SENSACIÓN DE ENCIERRO QUE LA MÚSICA HACE FÍSICA. //\n\nSEGUNDO TEMA: JIJIJI.\nLA ELEGIMOS PORQUE SU HISTORIA NO TERMINÓ EN EL ESTUDIO. / EL PÚBLICO LA TRANSFORMÓ EN UN RITUAL COLECTIVO Y ESO EXPLICA UNA PARTE ENORME DEL FENÓMENO RICOTERO. //\n\nTERCER TEMA: VENCEDORES VENCIDOS.\nESTA CANCIÓN NOS LLEVA A LA FORMACIÓN MÁS CONTUNDENTE DE FINALES DE LOS OCHENTA. / LA ELEGIMOS PORQUE MUESTRA CÓMO LA BANDA HABÍA APRENDIDO A SONAR MÁS DIRECTA SIN PERDER SU LENGUAJE. //\n\nCUARTO TEMA: UN PACMAN EN EL SAVOY.\nLA ELEGIMOS PARA ESCUCHAR EL COSTADO MÁS FILOSO DE ¡BANG! ¡BANG! ESTÁS LIQUIDADO. / EL TÍTULO, LA GUITARRA Y LA VOZ NOS DEVUELVEN A UNA BANDA QUE YA ERA ENORME PERO TODAVÍA SONABA PELIGROSA. //\n\nCAPÍTULO 3\nCUANDO LA MULTITUD SE VOLVIÓ MÁS GRANDE QUE EL ESCENARIO\n\nEN 1991 LOS REDONDOS PUBLICARON **LA MOSCA Y LA SOPA**. //\n\nPERO PARA ENTENDER AQUEL AÑO NO ALCANZA CON HABLAR DEL DISCO. /\nHAY QUE HABLAR DE UN PIBE DE DIECISIETE AÑOS. //\n\nSE LLAMABA **WALTER BULACIO**. /\nEL 19 DE ABRIL DE 1991 FUE DETENIDO EN UNA RAZIA POLICIAL EN LAS INMEDIACIONES DE OBRAS SANITARIAS, DONDE TOCABAN LOS REDONDOS. /\nFUE GOLPEADO. / MURIÓ EL 26 DE ABRIL. //\n\nNO FUE UN ACCIDENTE DE UN RECITAL. /\nFUE UN CASO DE VIOLENCIA INSTITUCIONAL. //\n\nY ME PARECE IMPORTANTE DECIRLO ASÍ. /\nPORQUE A VECES LAS HISTORIAS DEL ROCK CONVIERTEN UNA TRAGEDIA EN UNA LEYENDA. /\nPERO WALTER ERA UNA PERSONA. /\nTENÍA UNA EDAD, UNA FAMILIA Y UNA VIDA QUE DEBERÍA HABER CONTINUADO. //\n\nSU MUERTE CAMBIÓ PARA SIEMPRE LA RELACIÓN ENTRE LA BANDA, SU PÚBLICO Y LA POLICÍA. /\nY SU NOMBRE SE CONVIRTIÓ EN UNA REFERENCIA DE LA LUCHA CONTRA LA VIOLENCIA INSTITUCIONAL. //\n\nMIENTRAS TANTO, LA MOSCA Y LA SOPA TRAÍA ALGUNAS DE LAS CANCIONES MÁS RECORDADAS DEL GRUPO. /\nUN POCO DE AMOR FRANCÉS. /\nMI PERRO DINAMITA. /\nEL PIBE DE LOS ASTILLEROS. /\nQueso ruso. //\n\nNO TODAS HABLABAN DE LO MISMO. /\nNO TENÍAN UNA SOLA EMOCIÓN. /\nY ESO TAMBIÉN EXPLICA POR QUÉ EL REPERTORIO DE LOS REDONDOS SIGUIÓ CRECIENDO EN LUGAR DE REPETIR UNA FÓRMULA. //\n\nEN 1993 APARECIÓ EL DOBLE **LOBO SUELTO / CORDERO ATADO**. /\nUN PROYECTO AMBICIOSO, DOS DISCOS Y UNA BANDA QUE PARECÍA DISPUESTA A SEGUIR EXPANDIÉNDOSE. //\n\nEL PROBLEMA ERA QUE EL PÚBLICO TAMBIÉN SE EXPANDÍA. /\nCADA RECITAL CONVOCABA GENTE DE DISTINTAS CIUDADES. /\nSE VIAJABA SIN ENTRADA. /\nSE DORMÍA EN TERMINALES. /\nSE ORGANIZABAN GRUPOS PARA CRUZAR EL PAÍS. //\n\nESO ERA PARTE DE UNA COMUNIDAD MUSICAL EXTRAORDINARIA. /\nPERO TAMBIÉN IMPLICABA RIESGOS, CONFLICTOS Y UNA RESPONSABILIDAD CADA VEZ MAYOR. //\n\nLA BANDA HABÍA SOSTENIDO SU INDEPENDENCIA. /\nAHORA ESA INDEPENDENCIA TENÍA QUE HACERSE CARGO DE ESCENARIOS GIGANTESCOS. //\n\nEN 1996 PUBLICARON **LUZBELITO**. /\nY UNA VEZ MÁS ROCAMBOLE AYUDÓ A CONSTRUIR UN MUNDO VISUAL QUE NO ERA SIMPLEMENTE UNA PORTADA. //\n\nLA MÚSICA SE VOLVÍA MÁS OSCURA POR MOMENTOS. /\nEL INDIO HABÍA CONSTRUIDO UN LENGUAJE DE PERSONAJES, SOMBRAS Y SITUACIONES QUE NO SE ENTREGABAN A UNA INTERPRETACIÓN ÚNICA. //\n\nJUGUETES PERDIDOS TERMINÓ CONVIRTIÉNDOSE EN UNA CANCIÓN DE DESPEDIDAS Y RECUERDOS PARA MUCHÍSIMA GENTE. /\nPERO CONVIENE NO REDUCIRLA A UNA SOLA DEDICATORIA QUE NO ESTÁ DOCUMENTADA COMO SU ORIGEN EXCLUSIVO. /\nLAS CANCIONES A VECES ENCUENTRAN NUEVOS SENTIDOS EN LA VIDA DE QUIENES LAS ESCUCHAN. //\n\nEN 1998 LLEGÓ **ÚLTIMO BONDI A FINISTERRE**. /\nY EN 2000, **MOMO SAMPLER**. //\n\nHABÍA CAMBIOS DE SONIDO, PROGRAMACIONES, NUEVAS TEXTURAS. /\nEL GRUPO QUE HABÍA EMPEZADO ENTRE ESPECTÁCULOS DE VARIETÉ AHORA EXPERIMENTABA CON HERRAMIENTAS DE ESTUDIO QUE HUBIERAN PARECIDO INIMAGINABLES EN LOS PRIMEROS AÑOS. //\n\nPERO LOS RECITALES SEGUÍAN SIENDO EL CENTRO DE LA RELACIÓN CON EL PÚBLICO. /\nEN 2000 TOCARON EN RIVER. /\nEL MISMO GRUPO QUE HABÍA PASADO POR TEATROS CHICOS ESTABA AHORA EN UNO DE LOS ESTADIOS MÁS IMPORTANTES DEL PAÍS. //\n\nES UNA IMAGEN PODEROSA. /\nPERO NO ES UNA IMAGEN SIMPLE. //\n\nPORQUE EL ÉXITO NO BORRA LAS DIFERENCIAS PERSONALES. /\nA VECES LAS AGRANDA. /\nY ENTRE EL INDIO, SKAY Y POLI EMPEZABAN A PESAR DECISIONES SOBRE EL FUTURO, LA ORGANIZACIÓN Y EL CONTROL DEL MATERIAL. //\n\nEL 4 DE AGOSTO DE 2001 TOCARON EN EL ESTADIO CHATEAU CARRERAS DE CÓRDOBA. /\nSERÍA EL ÚLTIMO RECITAL DE LOS REDONDOS. //\n\nPERO NADIE PUEDE VOLVER A ESA NOCHE Y HACER DE CUENTA QUE TODOS SABÍAN QUE ESTABAN VIENDO EL FINAL. /\nLA HISTORIA ES MÁS TRISTE JUSTAMENTE POR ESO. /\nPORQUE MUCHAS DESPEDIDAS NO SE ANUNCIAN. //\n\nDESPUÉS LLEGÓ LA INTERRUPCIÓN. /\nY NO HUBO UN REGRESO DE LA BANDA. //\n\nNO ME INTERESA ELEGIR UN CULPABLE PARA HACER MÁS CÓMODO EL RELATO. /\nHUBO VERSIONES DIFERENTES SOBRE LAS CAUSAS DE LA RUPTURA. /\nLO QUE SABEMOS ES QUE LA RELACIÓN QUE HABÍA HECHO POSIBLE AQUELLA MÚSICA YA NO PODÍA SOSTENER EL MISMO PROYECTO. //\n\nSELECCIÓN MUSICAL — CAPÍTULO 3\n\nPRIMER TEMA: EL PIBE DE LOS ASTILLEROS.\nLA ELEGIMOS PORQUE LA MOSCA Y LA SOPA MOSTRÓ UNA BANDA CAPAZ DE CONSTRUIR PERSONAJES QUE PARECÍAN SALIR DE UNA NOVELA. / ACÁ LA GUITARRA Y LA LETRA HACEN QUE ESA HISTORIA RESPIRE. //\n\nSEGUNDO TEMA: UN ÁNGEL PARA TU SOLEDAD.\nLA ELEGIMOS PORQUE NOS PERMITE ESCUCHAR LA MADUREZ DEL GRUPO EN LA ÉPOCA DEL DISCO DOBLE. / TAMBIÉN FUE LA CANCIÓN CON LA QUE TERMINÓ SU ÚLTIMO RECITAL EN CÓRDOBA. //\n\nTERCER TEMA: JUGUETES PERDIDOS.\nLA ELEGIMOS POR LO QUE PRODUCE EN QUIENES LA ESCUCHAN. / NO PORQUE HAYA UNA ÚNICA EXPLICACIÓN DE SU LETRA. / SE CONVIRTIÓ EN UN LUGAR DE ENCUENTRO PARA LA MEMORIA DE MUCHAS PERSONAS. //\n\nCUARTO TEMA: LAS INCREÍBLES ANDANZAS DEL CAPITÁN BUSCAPINA.\nLA ELEGIMOS PORQUE REPRESENTA LA ÚLTIMA ETAPA DE EXPERIMENTACIÓN SONORA. / ANTES DEL SILENCIO, LOS REDONDOS TODAVÍA ESTABAN BUSCANDO OTRAS FORMAS DE HACER MÚSICA. //\n\nCAPÍTULO 4\nDOS CAMINOS DESPUÉS DEL ÚLTIMO RECITAL\n\nHAY UNA IMAGEN QUE QUIERO PROPONERTE. //\n\nUN GUITARRISTA QUE LLEVA DÉCADAS TOCANDO AL LADO DE UN CANTANTE. /\nDE PRONTO TIENE QUE ACERCARSE AL MICRÓFONO. /\nYA NO ESTÁ LA VOZ QUE TODOS CONOCEN. /\nY LA CANCIÓN QUE VA A CANTAR ES SUYA. //\n\nES **SKAY BEILINSON**. //\n\nDESPUÉS DE LOS REDONDOS, SKAY NO DEJÓ LA MÚSICA. /\nEN 2002 PUBLICÓ **A TRAVÉS DEL MAR DE LOS SARGAZOS**. /\nEL TÍTULO YA PARECE HABLAR DE UN VIAJE. /\nUN MAR DIFÍCIL DE ATRAVESAR. /\nUN CAMINO EN EL QUE NO ESTÁN LAS REFERENCIAS DE ANTES. //\n\nPOLI SEGUÍA A SU LADO, AHORA EN LA PRODUCCIÓN DE ESTA NUEVA ETAPA. /\nY ESO TAMBIÉN DICE ALGO. /\nSE HABÍA TERMINADO UNA BANDA. /\nPERO NO TODAS LAS RELACIONES NI TODAS LAS MANERAS DE TRABAJAR HABÍAN DESAPARECIDO. //\n\nEN UNA ENTREVISTA DE 2002, SKAY APARECÍA ENSAYANDO CON SU NUEVO GRUPO, CON LETRAS FRENTE A ÉL PARA AFRONTAR EL PAPEL DE CANTANTE. /\nNO ES UN DETALLE MENOR. /\nDESPUÉS DE TANTOS AÑOS SIENDO UNA DE LAS GUITARRAS MÁS RECONOCIBLES DEL ROCK ARGENTINO, TENÍA QUE APRENDER OTRA FORMA DE ESTAR EN ESCENA. //\n\nY SIN EMBARGO, CUANDO EMPEZABA A TOCAR, LA IDENTIDAD ESTABA AHÍ. /\nESA GUITARRA NO NECESITABA PRESENTACIÓN. //\n\nODA A LA SIN NOMBRE MOSTRÓ QUE PODÍA CONSTRUIR UNA CANCIÓN PROPIA SIN DISFRAZAR SU PASADO. /\nDESPUÉS LLEGARON TALISMÁN EN 2004, LA MARCA DE CAÍN EN 2007 Y NUEVOS DISCOS EN LOS AÑOS SIGUIENTES. //\n\nSKAY SIGUIÓ HACIENDO GIRAS. /\nSIGUIÓ TRABAJANDO CON MÚSICOS. /\nY SU PROYECTO TOMÓ FORMA DE BANDA, CON LOS FAKIRES COMO IDENTIDAD POSTERIOR. //\n\nNO SE TRATABA DE RECONSTRUIR LOS REDONDOS CON OTRO CANTANTE. /\nERA OTRA COSA. /\nLA CONTINUACIÓN DE UNA BÚSQUEDA MUSICAL PERSONAL. //\n\nMIENTRAS TANTO, EL INDIO TOMÓ OTRO CAMINO. //\n\nDURANTE UN TIEMPO, SU VOZ QUEDÓ FUERA DE LOS ESCENARIOS. /\nPERO EN 2004 APARECIÓ **EL TESORO DE LOS INOCENTES**, SU PRIMER DISCO SOLISTA. /\nY CON ÉL, **LOS FUNDAMENTALISTAS DEL AIRE ACONDICIONADO**. //\n\nEL SONIDO NO ERA UNA COPIA DE LOS PRIMEROS REDONDOS. /\nHABÍA PROGRAMACIONES, GUITARRAS, NUEVOS ARREGLOS Y UNA FORMA DE PRODUCCIÓN QUE CONTINUABA ALGUNAS BÚSQUEDAS DE LOS ÚLTIMOS DISCOS. //\n\nPABELLÓN SÉPTIMO SE CONVIRTIÓ EN UNA DE LAS CANCIONES MÁS IMPACTANTES DE ESA ETAPA. /\nLA HISTORIA QUE EVOCA REMITE AL INCENDIO Y LA REPRESIÓN EN EL PABELLÓN SÉPTIMO DE LA CÁRCEL DE DEVOTO EN 1978. /\nY NOS RECUERDA QUE EL INDIO SEGUÍA INTERESADO EN LAS VIDAS QUE QUEDAN DEL OTRO LADO DE LOS RELATOS OFICIALES. //\n\nEN 2007 PUBLICÓ **PORCO REX**. /\nDESPUÉS VENDRÍAN EL PERFUME DE LA TEMPESTAD, PAJARITOS, BRAVOS MUCHACHITOS Y EL RUISEÑOR, EL AMOR Y LA MUERTE. //\n\nPERO SU RELACIÓN CON EL PÚBLICO HABÍA TOMADO UNA DIMENSIÓN QUE POCOS ARTISTAS ARGENTINOS CONOCIERON. /\nCADA PRESENTACIÓN MOVÍA MULTITUDES. /\nVIAJES, BANDERAS, CARAVANAS Y UNA EXPECTATIVA ENORME. //\n\nESA MAGNITUD TAMBIÉN TUVO SU CARA MÁS DOLOROSA. /\nEN EL RECITAL DE OLAVARRÍA DE 2017 MURIERON DOS ASISTENTES. /\nNO CORRESPONDE PASAR POR ESA NOCHE COMO SI HUBIERA SIDO SOLAMENTE UNA DEMOSTRACIÓN DE CONVOCATORIA. /\nCUANDO SE REÚNE TANTA GENTE, LA SEGURIDAD ES PARTE INSEPARABLE DE LA HISTORIA. //\n\nEL INDIO HABÍA HECHO PÚBLICO SU DIAGNÓSTICO DE PARKINSON. /\nCON EL TIEMPO SE ALEJÓ DE LAS PRESENTACIONES PRESENCIALES, AUNQUE SIGUIÓ PARTICIPANDO EN PROYECTOS MUSICALES. //\n\nY EL 5 DE JUNIO DE 2026, A LOS 77 AÑOS, **MURIÓ CARLOS ALBERTO SOLARI**. //\n\nNO VOY A DECIRTE QUE ESA NOTICIA CERRÓ LA HISTORIA DE LOS REDONDOS. /\nLA BANDA YA HABÍA DEJADO DE TOCAR JUNTA VEINTICINCO AÑOS ANTES. /\nPERO LA MUERTE DEL INDIO CAMBIÓ LA MANERA EN QUE MUCHOS ESCUCHAMOS ESAS CANCIONES. //\n\nPORQUE AHORA SABEMOS QUE ESA VOZ NO VA A VOLVER A CANTAR EN UN ESCENARIO. /\nY AL MISMO TIEMPO, CADA VEZ QUE SUENA UN DISCO, LA VOZ SIGUE AHÍ. //\n\nSKAY Y EL INDIO TOMARON CAMINOS DIFERENTES. /\nNO HACE FALTA INVENTAR UNA RECONCILIACIÓN PARA RESPETAR LO QUE HICIERON JUNTOS. /\nTAMPOCO HACE FALTA ELEGIR ENTRE UNO Y OTRO. //\n\nSI SACÁS LA GUITARRA DE SKAY DE AQUELLAS CANCIONES, CAMBIAN PARA SIEMPRE. /\nSI SACÁS LA VOZ DEL INDIO, TAMBIÉN. /\nSI BORRÁS EL TRABAJO DE POLI, EL ARTE DE ROCAMBOLE Y LOS APORTES DE TODOS LOS MÚSICOS QUE PASARON POR LA BANDA, YA NO ESTÁS CONTANDO LA MISMA HISTORIA. //\n\nY ESO, PARA MÍ, ES LO MÁS EXTRAORDINARIO. /\nQUE ALGO TAN GRANDE HAYA NACIDO DE PERSONAS TAN DIFERENTES. /\nY QUE DESPUÉS DE SEPARARSE HAYAN PODIDO SEGUIR CREANDO, CADA UNA A SU MANERA. //\n\nSELECCIÓN MUSICAL — CAPÍTULO 4\n\nPRIMER TEMA: ODA A LA SIN NOMBRE — SKAY BEILINSON.\nLA ELEGIMOS PORQUE ABRE EL CAMINO SOLISTA DE SKAY Y DEJA ESCUCHAR QUÉ SUCEDIÓ CUANDO ESA GUITARRA TUVO QUE CONSTRUIR UNA NUEVA CASA PARA SUS CANCIONES. //\n\nSEGUNDO TEMA: FLORES SECAS — SKAY BEILINSON.\nLA ELEGIMOS PORQUE TALISMÁN CONFIRMÓ QUE EL PRIMER DISCO NO HABÍA SIDO UNA DESPEDIDA DISFRAZADA. / SKAY TENÍA UN PROYECTO PROPIO Y QUERÍA SEGUIR TOCANDO. //\n\nTERCER TEMA: PABELLÓN SÉPTIMO — INDIO SOLARI Y LOS FUNDAMENTALISTAS DEL AIRE ACONDICIONADO.\nLA ELEGIMOS PORQUE MUESTRA A UN INDIO QUE NO HABÍA PERDIDO EL INTERÉS POR CONTAR HISTORIAS INCÓMODAS. / UNA CANCIÓN QUE PIDE ESCUCHAR CON ATENCIÓN, NO SOLAMENTE COREAR. //\n\nCUARTO TEMA: PEDÍA SIEMPRE TEMAS EN LA RADIO... — INDIO SOLARI Y LOS FUNDAMENTALISTAS DEL AIRE ACONDICIONADO.\nLA ELEGIMOS PARA CERRAR CON LA VOZ DEL INDIO EN SU ETAPA SOLISTA Y, ADEMÁS, CON UNA REFERENCIA A LA RADIO. / ESE LUGAR DONDE UNA CANCIÓN PUEDE ENCONTRAR A ALGUIEN QUE NO SABÍA QUE LA ESTABA ESPERANDO. //\n\nCIERRE GENERAL\n\nESTA NOCHE RECORRIMOS UNA HISTORIA QUE EMPEZÓ EN ESCENARIOS CHICOS, CRECIÓ HASTA LOS ESTADIOS Y DESPUÉS SE DIVIDIÓ EN CAMINOS DIFERENTES. //\n\nHUBO MÚSICA, AMISTADES, DECISIONES EXTRAÑAS, TRABAJO, CONFLICTOS Y PÉRDIDAS. /\nY HUBO ALGO QUE NINGUNO DE LOS PROTAGONISTAS PODÍA FABRICAR POR SU CUENTA: /\nLO QUE CADA PERSONA HIZO CON ESAS CANCIONES. //\n\nQUIZÁS POR ESO UNA BANDA NO TERMINA EXACTAMENTE EL DÍA DE SU ÚLTIMO RECITAL. /\nTERMINA UNA FORMA DE TRABAJAR JUNTOS. /\nPERO LAS CANCIONES SIGUEN HACIENDO SU PROPIO CAMINO. //\n\nSOY SEBASTIÁN SOPELANA. /\nESTO FUE RUIDOS MOLESTOS. /\nUN INSOPORTABLE PROGRAMA DE ROCK. /\nPOR FM DEL LAGO 102.5. //\n\n**LA HISTORIA LLEGÓ A SU FIN, EL ROCK POR SUERTE, NO.** //\n\nANEXO DE PRODUCCIÓN — 16 TEMAS\n1. LOS REDONDOS — SUPERLÓGICO\n2. LOS REDONDOS — MARIPOSA PONTIAC / ROCK DEL PAÍS\n3. LOS REDONDOS — ÑAM FRI FRULI FALI FRU\n4. LOS REDONDOS — LA BESTIA POP\n5. LOS REDONDOS — PRESO EN MI CIUDAD\n6. LOS REDONDOS — JIJIJI\n7. LOS REDONDOS — VENCEDORES VENCIDOS\n8. LOS REDONDOS — UN PACMAN EN EL SAVOY\n9. LOS REDONDOS — EL PIBE DE LOS ASTILLEROS\n10. LOS REDONDOS — UN ÁNGEL PARA TU SOLEDAD\n11. LOS REDONDOS — JUGUETES PERDIDOS\n12. LOS REDONDOS — LAS INCREÍBLES ANDANZAS DEL CAPITÁN BUSCAPINA\n13. SKAY BEILINSON — ODA A LA SIN NOMBRE\n14. SKAY BEILINSON — FLORES SECAS\n15. INDIO SOLARI — PABELLÓN SÉPTIMO\n16. INDIO SOLARI — PEDÍA SIEMPRE TEMAS EN LA RADIO..."; let size=32;
 function show(){login.hidden=true;page.hidden=true;document.getElementById('hub').hidden=false}
 function render(){const raw=localStorage.getItem(PROGRAM43_KEY)||program43Text||DEFAULT_PROGRAM; text.innerHTML=''; const key=/^(CHICAGO NO SE RINDE\.|Y EL BLUES SE ENCHUFÓ\.|VOLVIÓ\.|ENTRÓ CON TODA SU VOZ\.|MIGHTY JOE YOUNG\.|APRENDIÓ A TOCAR EL BAJO\.|SEGUÍA TENIENDO FILO\.|LA HISTORIA LLEGÓ A SU FIN)/i; raw.split('\\n').forEach(function(line){const d=document.createElement('div');d.textContent=line||' ';d.className='line';if(/^PROGRAMA \\d+/i.test(line))d.className+=' program-title';else if(/^CAPÍTULO \\d+/i.test(line))d.className+=' chapter-title';else if(/^(PRESENTACIÓN|CIERRE|MÚSICA|LA MÚSICA DEL CAPÍTULO)/i.test(line))d.className+=' section-title';else if(/^POR QUÉ:/i.test(line))d.className+=' music-note';if(key.test(line.trim()))d.className+=' voice-emphasis';text.appendChild(d)})}
 const RM_SESSION_KEY='rm_pass', RM_DAY_KEY='rm_session_day', RM_OVERRIDE_KEY='rm_after22_until';
 function rmLocalParts(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return {day:x.year+'-'+x.month+'-'+x.day,hour:Number(x.hour)}}
 function rmAuthorized(){const now=rmLocalParts();const until=Number(sessionStorage.getItem(RM_OVERRIDE_KEY)||0);return sessionStorage.getItem(RM_SESSION_KEY)==='ok'&&sessionStorage.getItem(RM_DAY_KEY)===now.day&&(now.hour<22||Date.now()<until)}
 function rmExpire(){if(sessionStorage.getItem(RM_SESSION_KEY)!=='ok')return;if(rmAuthorized())return;sessionStorage.removeItem(RM_SESSION_KEY);sessionStorage.removeItem(RM_DAY_KEY);sessionStorage.removeItem(RM_OVERRIDE_KEY);location.replace('/aire/')}
 setInterval(rmExpire,15000);document.addEventListener('visibilitychange',rmExpire);window.addEventListener('focus',rmExpire);
 function rmUpdateAfter22(){const wrap=document.querySelector('.after22'),state=document.getElementById('after22State');if(!wrap||!state)return;const active=Date.now()<Number(sessionStorage.getItem(RM_OVERRIDE_KEY)||0);wrap.classList.toggle('active',active);state.textContent=active?'AUTORIZADO HASTA LAS 00:00':'Cierre automático: 22:00'}
 document.getElementById('after22Btn').onclick=function(){const now=rmLocalParts();const end=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Argentina/Buenos_Aires'}));end.setHours(23,59,59,999);const ms=end.getTime()-new Date(new Date().toLocaleString('en-US',{timeZone:'America/Argentina/Buenos_Aires'})).getTime();sessionStorage.setItem(RM_OVERRIDE_KEY,String(Date.now()+Math.max(60000,ms)));rmUpdateAfter22()};
 rmUpdateAfter22();
 function enter(){if(pass.value==='0253'){sessionStorage.setItem('rm_pass','ok');sessionStorage.setItem(RM_DAY_KEY,rmLocalParts().day);show()}else{error.textContent='Código incorrecto';pass.value='';pass.focus()}}
 document.getElementById('enter').onclick=enter;
 pass.addEventListener('keydown',function(e){if(e.key==='Enter')enter()});
 if(rmAuthorized())show();else{sessionStorage.removeItem(RM_SESSION_KEY);sessionStorage.removeItem(RM_DAY_KEY)}
 document.getElementById('openRedaccion').onclick=async function(){document.getElementById('hub').hidden=true;page.hidden=false;text.textContent='Cargando redacción del Programa 43…';try{const response=await fetch('/aire/programas/43.txt',{cache:'no-store'});if(!response.ok)throw Error('No se encontró el libreto');program43Text=await response.text();render()}catch(e){text.textContent='No se pudo cargar el Programa 43: '+e.message}};
 document.getElementById('openStudio').onclick=function(){location.assign('/aire/studio-music.html?instance='+Date.now())};
 document.getElementById('hubExit').onclick=function(){sessionStorage.removeItem('rm_pass');location.reload()};
 editBtn.onclick=function(){editor.value=localStorage.getItem(PROGRAM43_KEY)||program43Text||DEFAULT_PROGRAM;text.hidden=true;editor.hidden=false;editBtn.hidden=true;saveBtn.hidden=false;editor.focus()};
 saveBtn.onclick=function(){localStorage.setItem(PROGRAM43_KEY,editor.value);editor.hidden=true;text.hidden=false;saveBtn.hidden=true;editBtn.hidden=false;render()};
 document.getElementById('plus').onclick=function(){size=Math.min(48,size+2);text.style.fontSize=size+'px'};
 document.getElementById('minus').onclick=function(){size=Math.max(18,size-2);text.style.fontSize=size+'px'};
 document.getElementById('exitBtn').onclick=function(){sessionStorage.removeItem('rm_pass');location.reload()};
