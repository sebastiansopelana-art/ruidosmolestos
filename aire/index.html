<script>
(function(){
 const login=document.getElementById('login'),page=document.getElementById('page'),pass=document.getElementById('pass'),error=document.getElementById('error'),text=document.getElementById('text'),editor=document.getElementById('editor'),editBtn=document.getElementById('editBtn'),saveBtn=document.getElementById('saveBtn');
 const DEFAULT_PROGRAM="RUIDOS MOLESTOS\nPROGRAMA 41 — CHICAGO NO SE RINDE\nFM DEL LAGO 102.5 · 19 A 21 HS\nPRESENTA: SEBASTIÁN SOPELANA\nREDACTADO Y PRODUCIDO POR SEBASTIÁN SOPELANA\n\nPRESENTACIÓN GENERAL\nBUENAS NOCHES. //\nHAY CIUDADES QUE UNO RECONOCE POR SUS EDIFICIOS. /\nOTRAS, POR SUS CALLES. /\nALGUNAS, POR SU HISTORIA. //\nPERO HAY CIUDADES QUE TAMBIÉN SE PUEDEN RECONOCER CON LOS OJOS CERRADOS. //\nALCANZA CON ESCUCHARLAS. //\nCON ESCUCHAR UN INSTRUMENTO. /\nUNA MANERA DE MARCAR EL RITMO. /\nUNA VOZ QUE PARECE VENIR DE UN LUGAR MUCHO MÁS LEJANO QUE EL ESCENARIO DONDE ESTÁ CANTANDO. //\nY ENTONCES, SIN QUE NADIE NOS DIGA DÓNDE ESTAMOS, SABEMOS QUE ESA MÚSICA PERTENECE A UN LUGAR. //\nESTA NOCHE VAMOS A QUEDARNOS EN UNO DE ESOS LUGARES. //\nNO PARA RECORRER SUS CALLES COMO TURISTAS. /\nNI PARA REPETIR LA HISTORIA QUE YA CONOCEMOS. //\nVAMOS A ESCUCHAR LO QUE OCURRIÓ CUANDO CUATRO PERSONAS MUY DIFERENTES ENCONTRARON UNA MANERA DE HACERSE OÍR. //\nCUATRO VIDAS QUE SE CRUZARON CON UNA MISMA MÚSICA. /\nPERO QUE NO SE PARECIERON EN CASI NADA. //\nESTO ES RUIDOS MOLESTOS. //\nUN INSOPORTABLE PROGRAMA DE ROCK. //\nTE HABLA SEBASTIÁN SOPELANA. //\nY ESTA NOCHE, EN FM DEL LAGO 102.5, VAMOS A CONTAR UNA HISTORIA QUE TIENE CUATRO VOCES. //\nKOKO TAYLOR. /\nMIGHTY JOE YOUNG. /\nCAREY BELL. /\nY SON SEALS. //\nEL PROGRAMA DE HOY SE LLAMA... //\nCHICAGO NO SE RINDE. //\nVAMOS A EMPEZAR. //\n\nCAPÍTULO 1\nKOKO TAYLOR — LA MUJER QUE NO PIDIÓ PERMISO\nHAY UNA IMAGEN QUE ME GUSTA MUCHO PARA EMPEZAR ESTA HISTORIA. //\nUNA CASA DE CAMPO EN TENNESSEE. /\nUNOS CHICOS QUE HAN TERMINADO, POR FIN, CON LAS TAREAS DEL DÍA. /\nY UNA PEQUEÑA BANDA QUE SE REÚNE DETRÁS DE LA CASA. //\nNO TIENEN INSTRUMENTOS COMO LOS QUE VEMOS EN LOS ESCENARIOS. //\nUNA GUITARRA ESTÁ HECHA CON ALAMBRES. /\nOTRO INSTRUMENTO SE FABRICÓ CON UNA MAZORCA DE MAÍZ. //\nY HAY UNA CHICA QUE CANTA. //\nSE LLAMA CORA WALTON. //\nPERO MUCHOS AÑOS DESPUÉS EL MUNDO LA CONOCERÁ COMO KOKO TAYLOR. //\nLOS CHICOS TOCAN A ESCONDIDAS PORQUE EN SU CASA HAY UNA DIFERENCIA MUY IMPORTANTE ENTRE LA MÚSICA QUE SE PUEDE CANTAR Y LA QUE NO. //\nEL GOSPEL PERTENECE A LA IGLESIA. /\nEL BLUES PERTENECE A OTRO MUNDO. //\nUN MUNDO DE BARES, DE BAILES, DE NOCHES LARGAS Y DE HISTORIAS QUE MUCHOS PADRES PREFIEREN MANTENER LEJOS DE SUS HIJOS. //\nPERO LOS CHICOS QUIEREN TOCAR BLUES. //\nY LO HACEN. //\nA VECES, CUANDO HABLAMOS DE LA HISTORIA DE LA MÚSICA, NOS QUEDAMOS CON LAS GRANDES GRABACIONES. //\nCON LOS DISCOS QUE VENDIERON MILES DE COPIAS. /\nCON LOS PREMIOS. /\nCON LAS FOTOGRAFÍAS DE LOS ARTISTAS FAMOSOS. //\nPERO EN EL CASO DE KOKO TAYLOR, YO PREFIERO EMPEZAR POR AQUELLA GUITARRA HECHA CON ALAMBRE. //\nPORQUE AHÍ HABÍA UNA NENA QUE TODAVÍA NO SABÍA QUE IBA A SER CANTANTE. //\nSIMPLEMENTE SABÍA QUE LE GUSTABA CANTAR. //\nCORA HABÍA NACIDO EN 1928, CERCA DE MEMPHIS. //\nSU FAMILIA TRABAJABA EN EL CAMPO. //\nNO ERA UNA VIDA CÓMODA. //\nEN EL SUR DE ESTADOS UNIDOS, MUCHAS FAMILIAS AFROAMERICANAS CULTIVABAN TIERRAS QUE NO LES PERTENECÍAN. //\nTRABAJABAN DURANTE MESES Y DESPUÉS TENÍAN QUE ENTREGAR UNA PARTE IMPORTANTE DE LO PRODUCIDO. //\nEL SISTEMA LOS MANTENÍA ATADOS A UNA POBREZA DE LA QUE RESULTABA MUY DIFÍCIL SALIR. //\nY LOS HIJOS APRENDÍAN A TRABAJAR MUCHO ANTES DE TENER EDAD PARA ENTENDER POR QUÉ LA VIDA ERA TAN DIFÍCIL. //\nKOKO CRECIÓ EN ESE AMBIENTE. //\nPERO ADEMÁS TUVO QUE ENFRENTAR UNA PÉRDIDA ENORME. //\nQUEDÓ HUÉRFANA SIENDO MUY JOVEN. //\nY ESO CAMBIÓ SU INFANCIA PARA SIEMPRE. //\nNO QUIERO QUE IMAGINES QUE AQUELLA TRISTEZA LA CONVIRTIÓ AUTOMÁTICAMENTE EN UNA GRAN CANTANTE. //\nLA VIDA NO FUNCIONA ASÍ. //\nHAY PERSONAS QUE SUFREN MUCHO Y NUNCA TIENEN LA OPORTUNIDAD DE HACER LO QUE LES GUSTA. //\nLO PARTICULAR DE KOKO FUE QUE, A PESAR DE LAS DIFICULTADES, NO DEJÓ DE ACERCARSE A LA MÚSICA. //\nESCUCHABA LA RADIO. //\nY LA RADIO ERA UNA VENTANA EXTRAORDINARIA. //\nPORQUE PERMITÍA QUE UNA CHICA DE CAMPO ESCUCHARA VOCES QUE ESTABAN MUCHO MÁS ALLÁ DE SU VIDA COTIDIANA. //\nMEMPHIS MINNIE. /\nBESSIE SMITH. //\nMUJERES QUE CANTABAN SIN DISCULPARSE POR LO QUE TENÍAN QUE DECIR. //\nY EN AQUELLOS DISCOS KOKO DESCUBRIÓ ALGO FUNDAMENTAL. //\nQUE UNA MUJER PODÍA CONTAR SUS PROPIAS HISTORIAS. //\nQUE PODÍA CANTAR SOBRE EL AMOR, LOS CELOS, EL ABANDONO Y EL DESEO. //\nY QUE PODÍA HACERLO CON UNA FUERZA CAPAZ DE IMPONERSE SOBRE UNA BANDA ENTERA. //\nMUCHOS AÑOS DESPUÉS, ESA SERÍA UNA DE SUS GRANDES VIRTUDES. //\nPERO TODAVÍA FALTABA MUCHO. //\nEN 1952, KOKO Y SU MARIDO, ROBERT TAYLOR, DECIDIERON IRSE A CHICAGO. //\nERA PARTE DE UN MOVIMIENTO ENORME DE PERSONAS AFROAMERICANAS QUE ABANDONABAN EL SUR BUSCANDO TRABAJO Y MEJORES CONDICIONES DE VIDA EN LAS CIUDADES INDUSTRIALES DEL NORTE. //\nCHICAGO PROMETÍA OPORTUNIDADES. //\nPERO NO LAS REGALABA. //\nROBERT CONSIGUIÓ TRABAJO EN LA INDUSTRIA DE LA CARNE. //\nKOKO LIMPIABA CASAS. //\nY DURANTE LA SEMANA LLEVABAN LA VIDA DE DOS PERSONAS QUE TRATABAN DE GANARSE EL SUSTENTO. //\nPERO LOS FINES DE SEMANA HACÍAN ALGO QUE LES GUSTABA MUCHO. //\nSALÍAN A ESCUCHAR BLUES. //\nY ACÁ APARECE UNA DE LAS CASUALIDADES MÁS LINDAS DE ESTA HISTORIA. //\nLOS MÚSICOS QUE KOKO HABÍA ESCUCHADO POR RADIO ESTABAN TOCANDO EN LOS CLUBES DE CHICAGO. //\nNO ERAN FIGURAS INALCANZABLES. //\nSE PODÍA ENTRAR A UN LOCAL Y ESCUCHAR A MUDDY WATERS. /\nA HOWLIN' WOLF. /\nA BUDDY GUY. //\nY KOKO NO SE CONFORMABA CON ESCUCHAR. //\nCUANDO TENÍA OPORTUNIDAD, CANTABA. //\nROBERT LA ALENTABA. //\nSABÍA QUE SU MUJER TENÍA UNA VOZ EXTRAORDINARIA. //\nY POCO A POCO, LOS MÚSICOS DE LA CIUDAD EMPEZARON A PRESTARLE ATENCIÓN. //\nNO ERA UNA VOZ DELICADA. //\nNO ERA UNA CANTANTE QUE NECESITARA QUE LA BANDA BAJARA EL VOLUMEN PARA PODER ESCUCHARLA. //\nERA UNA VOZ ÁSPERA, PODEROSA, CON UNA PERSONALIDAD QUE NO SE CONFUNDÍA CON NINGUNA OTRA. //\nEN 1962, WILLIE DIXON LA ESCUCHÓ. //\nY ENTENDIÓ QUE AHÍ HABÍA ALGO ESPECIAL. //\nDIXON ERA UNO DE LOS GRANDES ARQUITECTOS DEL BLUES DE CHICAGO. //\nCOMPONÍA CANCIONES. /\nTOCABA EL CONTRABAJO. /\nPRODUCÍA GRABACIONES. //\nY TENÍA UNA CAPACIDAD EXTRAORDINARIA PARA DESCUBRIR QUÉ CANCIÓN PODÍA FUNCIONAR CON DETERMINADO ARTISTA. //\nLA LLEVÓ A CHESS RECORDS. //\nY UNOS AÑOS DESPUÉS LLEGÓ LA GRABACIÓN QUE LE CAMBIÓ LA VIDA. //\nWANG DANG DOODLE. //\nLA CANCIÓN HABÍA SIDO COMPUESTA POR DIXON Y YA HABÍA SIDO GRABADA POR HOWLIN' WOLF. //\nPERO KOKO HIZO ALGO DIFERENTE CON ELLA. //\nLA CONVIRTIÓ EN UNA FIESTA. //\nUNA FIESTA RUIDOSA, DESORDENADA, LLENA DE PERSONAJES Y CON UNA CANTANTE QUE PARECÍA ESTAR CONVOCANDO A TODO EL BARRIO. //\nY LA GENTE RESPONDIÓ. //\nEL DISCO SE CONVIRTIÓ EN UN ÉXITO. //\nDE PRONTO, LA MUJER QUE LIMPIABA CASAS ESTABA CANTANDO PARA PÚBLICOS CADA VEZ MÁS GRANDES. //\nPERO EL ÉXITO NO SIGNIFICÓ QUE TODO FUERA SENCILLO. //\nKOKO ERA UNA MUJER NEGRA EN UN NEGOCIO MUSICAL DOMINADO POR HOMBRES. //\nY EN MUCHAS OPORTUNIDADES TENÍA QUE DEMOSTRAR QUE PODÍA HACER EL MISMO TRABAJO QUE ELLOS. //\nVIAJAR. /\nSOSTENER UNA BANDA. /\nSUBIRSE A UN ESCENARIO DESPUÉS DE HORAS DE RUTA. /\nCANTAR CUANDO ESTABA CANSADA. //\nY VOLVER A EMPEZAR AL DÍA SIGUIENTE. //\nROBERT ESTABA A SU LADO. //\nNO SOLAMENTE COMO MARIDO. //\nTAMBIÉN COMO REPRESENTANTE Y COMPAÑERO DE TRABAJO. //\nHABÍAN LLEGADO JUNTOS A CHICAGO. //\nY AHORA RECORRÍAN JUNTOS EL CAMINO QUE LOS LLEVABA A LOS ESCENARIOS. //\nEN LOS AÑOS SETENTA, CUANDO CHESS YA NO TENÍA EL MISMO LUGAR EN EL NEGOCIO, KOKO ENCONTRÓ UNA NUEVA CASA DISCOGRÁFICA. //\nALLIGATOR RECORDS. //\nEN 1975 PUBLICÓ I GOT WHAT IT TAKES. //\nY EL TÍTULO PARECÍA UNA DECLARACIÓN PERSONAL. //\nTENGO LO QUE HACE FALTA. //\nNO NECESITABA QUE ALGUIEN LE EXPLICARA CÓMO DEBÍA CANTAR BLUES. //\nYA HABÍA PASADO AÑOS HACIÉNDOLO. //\nEN 1985 RECIBIÓ UN GRAMMY POR EL DISCO BLUES EXPLOSION. //\nY SIGUIÓ VIAJANDO. //\nPERO EN 1988, UN ACCIDENTE AUTOMOVILÍSTICO INTERRUMPIÓ BRUSCAMENTE SU CARRERA. //\nSUFRIÓ HERIDAS IMPORTANTES. //\nTUVO QUE ALEJARSE DEL ESCENARIO DURANTE MESES. //\nY PARA UNA PERSONA QUE HABÍA CONSTRUIDO SU VIDA ALREDEDOR DE LA MÚSICA, AQUELLA INACTIVIDAD FUE MUY DIFÍCIL. //\nSE RECUPERÓ. //\nVOLVIÓ A CANTAR. //\nY CUANDO PARECÍA QUE LA VIDA EMPEZABA A RECUPERAR SU RITMO, LLEGÓ UNA PÉRDIDA TODAVÍA MÁS PROFUNDA. //\nMURIÓ ROBERT. //\nEL HOMBRE QUE HABÍA ESTADO CON ELLA DESDE LOS AÑOS EN QUE NO TENÍAN NADA. //\nEL COMPAÑERO DE AQUEL VIAJE A CHICAGO. //\nEL QUE LA HABÍA ANIMADO A SUBIRSE A LOS ESCENARIOS. //\nY HAY ALGO MUY PARTICULAR EN ESA CLASE DE PÉRDIDA. //\nPORQUE NO SE PIERDE SOLAMENTE A UNA PERSONA. //\nTAMBIÉN SE PIERDE A ALGUIEN QUE RECUERDA TODA NUESTRA HISTORIA. //\nALGUIEN QUE ESTUVO PRESENTE ANTES DE LOS PREMIOS. //\nANTES DE LOS DISCOS. //\nANTES DE QUE LOS DEMÁS APRENDIERAN NUESTRO NOMBRE. //\nKOKO SIGUIÓ CANTANDO. //\nEN 1994 ABRIÓ SU PROPIO CLUB DE BLUES EN CHICAGO. //\nLA MUJER QUE HABÍA ENTRADO A LOS CLUBES COMO ESPECTADORA AHORA TENÍA UNO CON SU NOMBRE. //\nY EN 2007, CASI A LOS 80 AÑOS, PUBLICÓ OLD SCHOOL. //\nNO ERA UNA ARTISTA QUE ESTABA VIVIENDO SOLAMENTE DE SUS RECUERDOS. //\nTODAVÍA TENÍA UNA VOZ. //\nTODAVÍA TENÍA UNA BANDA. //\nTODAVÍA TENÍA GANAS DE CANTAR. //\nKOKO MURIÓ EL 3 DE JUNIO DE 2009. //\nY AUNQUE EL MUNDO LA CONOCIÓ COMO LA REINA DEL BLUES, YO PREFIERO TERMINAR ESTA HISTORIA CON AQUELLA CHICA QUE TOCABA A ESCONDIDAS DETRÁS DE UNA CASA. //\nPORQUE AHÍ YA HABÍA ALGO QUE NADIE HABÍA PODIDO QUITARLE. //\nLAS GANAS DE CANTAR. //\nSELECCIÓN MUSICAL — KOKO TAYLOR\nPRIMER TEMA: WANG DANG DOODLE.\nVAMOS A ESCUCHAR LA CANCIÓN QUE CAMBIÓ SU CARRERA. / LA QUE WILLIE DIXON HABÍA COMPUESTO Y QUE KOKO TRANSFORMÓ EN UNA FIESTA. // LA ELEGIMOS PORQUE NOS PERMITE ESCUCHAR EL MOMENTO EN QUE UNA CANTANTE QUE VENÍA DE LOS CLUBES DE CHICAGO CONSIGUIÓ LLEGAR A UN PÚBLICO MUCHO MÁS GRANDE. //\nSEGUNDO TEMA: I GOT WHAT IT TAKES.\nAHORA NOS VAMOS A 1975. / KOKO COMENZABA UNA NUEVA ETAPA EN ALLIGATOR RECORDS. // LA ELEGIMOS PORQUE REPRESENTA SU INDEPENDENCIA MUSICAL. / YA NO NECESITABA DEMOSTRAR QUE PODÍA CANTAR BLUES. / LO HABÍA DEMOSTRADO DURANTE AÑOS. //\nTERCER TEMA: I'M A WOMAN.\nESTA CANCIÓN ES UNA AFIRMACIÓN DE PERSONALIDAD. / EN UN GÉNERO DONDE MUCHAS VECES LAS MUJERES TENÍAN QUE PELEAR POR UN LUGAR, KOKO TOMABA EL MICRÓFONO Y SE HACÍA ESCUCHAR. // LA ELEGIMOS PORQUE RESUME ESA FUERZA QUE LA ACOMPAÑÓ DURANTE TODA SU CARRERA. //\nCUARTO TEMA: COME TO MAMA.\nY PARA CERRAR, UNA GRABACIÓN DE SU ÚLTIMA ETAPA. / KOKO YA HABÍA ATRAVESADO EL ACCIDENTE, LA MUERTE DE ROBERT Y DÉCADAS DE GIRAS. // PERO SEGUÍA CANTANDO. / Y ESTA CANCIÓN NOS PERMITE ESCUCHARLA SIN NECESIDAD DE MIRAR LOS PREMIOS QUE HABÍA GANADO. //\n\nCAPÍTULO 2\nMIGHTY JOE YOUNG — EL HOMBRE QUE SE QUEDÓ SIN GUITARRA\nHAY UNA COSA QUE ME RESULTA DIFÍCIL DE IMAGINAR. //\nUN GUITARRISTA QUE LLEVA CASI TODA SU VIDA TOCANDO. /\nQUE CONOCE EL INSTRUMENTO TAN BIEN COMO SUS PROPIAS MANOS. /\nQUE NO NECESITA MIRAR EL MÁSTIL PARA SABER DÓNDE ESTÁ UNA NOTA. //\nY QUE UN DÍA DESCUBRE QUE SUS DEDOS YA NO RESPONDEN. //\nLA GUITARRA SIGUE AHÍ. //\nLAS CUERDAS SON LAS MISMAS. //\nEL AMPLIFICADOR ENCIENDE. //\nPERO LAS MANOS YA NO HACEN LO QUE HACÍAN ANTES. //\nESTA ES UNA PARTE DE LA HISTORIA DE MIGHTY JOE YOUNG. //\nPERO ANTES DE LLEGAR A ESE MOMENTO, QUIERO CONTARTE QUIÉN ERA EL HOMBRE QUE HABÍA DETRÁS DE LA GUITARRA. //\nJOE HABÍA NACIDO EN 1927, EN SHREVEPORT, LUISIANA. //\nCRECIÓ EN MILWAUKEE. //\nY ANTES DE CONSOLIDARSE COMO MÚSICO, PASÓ POR UNA ACTIVIDAD QUE NO PARECE TENER MUCHO QUE VER CON EL BLUES. //\nEL BOXEO. //\nFUE BOXEADOR AFICIONADO. //\nY SU ASPECTO FÍSICO AYUDÓ A QUE TERMINARA RECIBIENDO UN APODO MUY PARTICULAR. //\nMIGHTY JOE YOUNG. //\nEL NOMBRE COINCIDÍA CON EL DE UNA PELÍCULA DE 1949 SOBRE UN GORILA GIGANTESCO. //\nPERO DETRÁS DE AQUEL APODO HABÍA UN GUITARRISTA MUCHO MÁS SUTIL DE LO QUE SU ASPECTO PODÍA HACER PENSAR. //\nPORQUE JOE TENÍA UNA CUALIDAD QUE NO TODOS LOS MÚSICOS DESARROLLAN. //\nSABÍA ACOMPAÑAR. //\nY ESO PARECE SENCILLO HASTA QUE UNO ESCUCHA A ALGUIEN QUE NO SABE HACERLO. //\nHAY GUITARRISTAS QUE TOCAN TODO EL TIEMPO. //\nQUE NO DEJAN UN SOLO ESPACIO VACÍO. //\nQUE PARECEN ESTAR PELEANDO CON EL CANTANTE PARA VER QUIÉN SE ESCUCHA MÁS. //\nMIGHTY JOE ERA DIFERENTE. //\nSABÍA QUE UNA BUENA FRASE DE GUITARRA PODÍA DURAR SOLAMENTE DOS SEGUNDOS. //\nY QUE DESPUÉS HABÍA QUE DEJAR QUE LA CANCIÓN RESPIRARA. //\nEN CHICAGO, ESA CAPACIDAD LE ABRIÓ MUCHAS PUERTAS. //\nTOCÓ CON JIMMY ROGERS. //\nCON BILLY BOY ARNOLD. //\nCON OTIS RUSH. //\nY SE MOVIÓ EN UNA ESCENA DONDE EL BLUES ESTABA CAMBIANDO. //\nPORQUE CHICAGO NO ERA SOLAMENTE UNA CIUDAD DE BLUES TRADICIONAL. //\nTAMBIÉN ERA UNA CIUDAD DE SOUL. //\nDE MÚSICA BAILABLE. //\nDE ARREGLOS CON VIENTOS. //\nDE CANTANTES QUE ESTABAN BUSCANDO NUEVAS MANERAS DE CONTAR HISTORIAS DE AMOR Y DESENGAÑO. //\nY JOE ESCUCHABA TODO ESO. //\nNO QUERÍA QUEDARSE ENCERRADO EN UNA SOLA FÓRMULA. //\nLE GUSTABA EL BLUES. //\nPERO TAMBIÉN LE GUSTABA EL SOUL. //\nY CUANDO EMPEZÓ A GRABAR BAJO SU PROPIO NOMBRE, ESA MEZCLA SE CONVIRTIÓ EN SU IDENTIDAD. //\nEN 1971 PUBLICÓ BLUES WITH A TOUCH OF SOUL. //\nBLUES CON UN TOQUE DE SOUL. //\nEL TÍTULO NO PODÍA SER MÁS PRECISO. //\nERA LA MÚSICA DE UN HOMBRE QUE HABÍA APRENDIDO EL OFICIO ACOMPAÑANDO A LOS GRANDES BLUESMEN, PERO QUE TAMBIÉN ENTENDÍA LO QUE ESTABA PASANDO EN LOS CLUBES DE SU CIUDAD. //\nEN EL DISCO PARTICIPARON MÚSICOS COMO JIMMY DAWKINS Y JOHNNY BIG MOOSE WALKER. //\nY ESO NOS DICE ALGO IMPORTANTE. //\nJOE ERA RESPETADO POR SUS COMPAÑEROS. //\nNO ERA SOLAMENTE UN GUITARRISTA QUE CONSEGUÍA TRABAJO PORQUE ESTABA DISPONIBLE. //\nERA ALGUIEN CON QUIEN OTROS MÚSICOS QUERÍAN TOCAR. //\nPERO HAY OTRA PARTE DE SU CARRERA QUE ME GUSTA ESPECIALMENTE. //\nTIENE QUE VER CON UN CLUB LLAMADO WISE FOOLS PUB. //\nDURANTE AÑOS, JOE FUE UNO DE LOS MÚSICOS HABITUALES DEL LUGAR. //\nY DURANTE DOCE AÑOS CONSECUTIVOS TOCÓ ALLÍ EN LA NOCHE DE AÑO NUEVO. //\nDOCE AÑOS. //\nPENSÁ LO QUE SIGNIFICA ESO. //\nNOSOTROS SOLEMOS MEDIR EL ÉXITO DE UN MÚSICO POR LA CANTIDAD DE DISCOS QUE VENDE. //\nPOR LOS ESTADIOS QUE LLENA. //\nPOR LOS PREMIOS QUE RECIBE. //\nPERO HAY OTRA CLASE DE ÉXITO. //\nEL DE UN MÚSICO QUE SE CONVIERTE EN PARTE DE LA VIDA DE UNA COMUNIDAD. //\nEL HOMBRE AL QUE LA GENTE QUIERE ESCUCHAR CUANDO TERMINA EL AÑO. //\nCUANDO BRINDA. //\nCUANDO SE REÚNE CON SUS AMIGOS. //\nCUANDO QUIERE PASAR UNA BUENA NOCHE. //\nMIGHTY JOE ERA ESE MÚSICO. //\nY EN AQUEL CLUB SU BANDA ENCONTRÓ UN LUGAR DONDE PODÍA DESARROLLAR SU SONIDO SIN ESTAR PENDIENTE DE LAS MODAS. //\nTOCABA BLUES. //\nTOCABA SOUL. //\nY HACÍA QUE LA GENTE SE QUEDARA. //\nEN 1981, SU MÚSICA TAMBIÉN LLEGÓ AL CINE. //\nPARTICIPÓ EN LA BANDA SONORA DE THIEF, UNA PELÍCULA DIRIGIDA POR MICHAEL MANN. //\nERA UNA HISTORIA CRIMINAL AMBIENTADA EN CHICAGO. //\nY LA MÚSICA DE JOE FORMABA PARTE DE AQUEL MUNDO NOCTURNO. //\nUNA VEZ MÁS, NO NECESITABA CONVERTIRSE EN UNA ESTRELLA PARA DEJAR SU MARCA. //\nSU GUITARRA PODÍA APARECER EN UN CLUB. //\nEN UN DISCO. //\nO EN UNA PELÍCULA. //\nPERO EN 1986, CUANDO ESTABA TRABAJANDO EN NUEVAS GRABACIONES, LLEGÓ EL PROBLEMA QUE CAMBIARÍA SU VIDA. //\nTUVO QUE SOMETERSE A UNA OPERACIÓN EN EL CUELLO. //\nY DESPUÉS DE AQUELLA INTERVENCIÓN SUFRIÓ ALTERACIONES EN LA SENSIBILIDAD Y EL MOVIMIENTO DE LAS MANOS. //\nPARA UN GUITARRISTA, ESO ERA DEVASTADOR. //\nJOE NO HABÍA PERDIDO EL INTERÉS POR LA MÚSICA. //\nNO HABÍA DECIDIDO DEJAR DE TOCAR. //\nSIMPLEMENTE, SU CUERPO YA NO RESPONDÍA COMO ANTES. //\nY AHÍ APARECE UNA DE LAS PARTES MÁS TRISTES DE ESTA HISTORIA. //\nPORQUE HAY PERSONAS QUE SE RETIRAN DE UNA ACTIVIDAD CUANDO SIENTEN QUE YA CUMPLIERON SU CICLO. //\nPERO JOE NO QUERÍA RETIRARSE. //\nQUERÍA VOLVER. //\nQUERÍA RECUPERAR SU GUITARRA. //\nMIENTRAS TANTO, SIGUIÓ TRABAJANDO CON LA MÚSICA DE OTRAS MANERAS. //\nCANTABA. //\nPARTICIPABA EN GRABACIONES. //\nY TRATABA DE COMPLETAR EL DISCO QUE HABÍA COMENZADO. //\nEL PROYECTO TARDÓ AÑOS EN TERMINARSE. //\nPERO FINALMENTE, EN 1997, APARECIÓ MIGHTY MAN. //\nEL TÍTULO VOLVÍA A JUGAR CON AQUEL APODO DE JUVENTUD. //\nPERO AHORA TENÍA OTRO SIGNIFICADO. //\nPORQUE EL HOMBRE QUE HABÍA SIDO BOXEADOR Y QUE HABÍA PASADO DÉCADAS CON UNA GUITARRA ENTRE LAS MANOS, HABÍA TENIDO QUE ENFRENTAR UNA PELEA MUCHO MÁS DIFÍCIL. //\nLA DE SEGUIR SIENDO MÚSICO SIN PODER TOCAR COMO ANTES. //\nEN AQUEL DISCO APARECIERON MÚSICOS QUE LO ACOMPAÑARON Y AYUDARON A COMPLETAR EL TRABAJO. //\nY ESO TAMBIÉN DICE ALGO SOBRE SU VIDA. //\nPORQUE DESPUÉS DE TANTOS AÑOS ACOMPAÑANDO A OTROS, AHORA ERAN OTROS LOS QUE LO ACOMPAÑABAN A ÉL. //\nJOE TODAVÍA TENÍA UNA ESPERANZA. //\nVOLVER A RECUPERAR LA SENSIBILIDAD EN LOS DEDOS. //\nEN 1998 SE SOMETIÓ A OTRA OPERACIÓN. //\nPERO SU SALUD SE COMPLICÓ. //\nY EL 25 DE MARZO DE 1999 MURIÓ. //\nTENÍA 71 AÑOS. //\nHAY ALGO QUE ME QUEDA DANDO VUELTAS CUANDO PIENSO EN SU HISTORIA. //\nDURANTE GRAN PARTE DE SU VIDA, MIGHTY JOE HABÍA SIDO EL HOMBRE QUE ESTABA AL LADO DE OTRO MÚSICO. //\nEL GUITARRISTA QUE SOSTENÍA LA CANCIÓN. //\nEL QUE ENTRABA EN EL MOMENTO JUSTO. //\nEL QUE SABÍA CUÁNDO CALLARSE. //\nY CUANDO PERDIÓ LA POSIBILIDAD DE TOCAR, DESCUBRIÓ CUÁNTO SIGNIFICABA PARA ÉL AQUEL INSTRUMENTO. //\nNO ERA UN OBJETO. //\nERA SU MANERA DE ESTAR EN EL MUNDO. //\nY AUNQUE SU NOMBRE NO SEA TAN CONOCIDO COMO EL DE OTROS GUITARRISTAS DE CHICAGO, HAY MUCHÍSIMA MÚSICA QUE SUENA COMO SUENA PORQUE ÉL ESTUVO AHÍ. //\nSELECCIÓN MUSICAL — MIGHTY JOE YOUNG\nPRIMER TEMA: WHY BABY?\nVAMOS A ESCUCHAR UNA DE LAS CANCIONES QUE NOS PERMITEN RECONOCER SU MANERA DE CANTAR Y TOCAR. / LA ELEGIMOS PORQUE NOS ACERCA AL MÚSICO QUE EMPEZABA A BUSCAR SU PROPIO LUGAR DESPUÉS DE AÑOS DE ACOMPAÑAR A OTROS. //\nSEGUNDO TEMA: SOMEBODY LOAN ME A DIME.\nESTA COMPOSICIÓN DE FENTON ROBINSON FORMÓ PARTE DEL REPERTORIO QUE JOE GRABÓ PARA DELMARK. / LA ELEGIMOS PORQUE PERMITE ESCUCHARLO DESARROLLAR UN BLUES EXTENSO, CON ESPACIO PARA LA GUITARRA Y PARA LA EXPRESIÓN DE TODA LA BANDA. //\nTERCER TEMA: EVERY MAN NEEDS A WOMAN.\nACÁ APARECE EL MIGHTY JOE MÁS CERCANO AL SOUL. / UNA CANCIÓN QUE NOS AYUDA A ENTENDER POR QUÉ SU MÚSICA NO SE LIMITABA A REPETIR EL BLUES TRADICIONAL DE CHICAGO. // JOE QUERÍA QUE SUS CANCIONES TUVIERAN OTRO COLOR. //\nCUARTO TEMA: TURNING POINT.\nY PARA TERMINAR, UNA GRABACIÓN DE MIGHTY MAN. / LA ELEGIMOS PORQUE PERTENECE A ESE DISCO QUE TARDÓ TANTOS AÑOS EN COMPLETAR. // ES LA OPORTUNIDAD DE ESCUCHAR A UN HOMBRE QUE, AUNQUE HABÍA PERDIDO GRAN PARTE DE SU CAPACIDAD PARA TOCAR LA GUITARRA, TODAVÍA TENÍA MÚSICA PARA COMPARTIR. //\n\nCAPÍTULO 3\nCAREY BELL — EL SAXOFÓN QUE NUNCA LLEGÓ\nEN LA VIDA DE ALGUNOS MÚSICOS HAY UN INSTRUMENTO QUE LO CAMBIA TODO. //\nPERO EN LA DE CAREY BELL, EL INSTRUMENTO QUE QUERÍA NO FUE EL QUE TERMINÓ TOCANDO. //\nCAREY HABÍA NACIDO EN 1936, EN MACON, MISSISSIPPI. //\nY CUANDO ERA CHICO LE GUSTABA EL SAXOFÓN. //\nNO LA ARMÓNICA. //\nEL SAXOFÓN. //\nLE GUSTABA ESE SONIDO GRANDE, REDONDO, CAPAZ DE DESTACARSE SOBRE UNA BANDA. //\nPERO EN SU CASA NO HABÍA DINERO PARA COMPRAR UNO. //\nENTONCES TERMINÓ CON UNA ARMÓNICA. //\nUN INSTRUMENTO PEQUEÑO. //\nBARATO. //\nQUE PODÍA GUARDARSE EN EL BOLSILLO. //\nY QUE, EN MANOS DE LA PERSONA INDICADA, PODÍA PRODUCIR UNA CANTIDAD EXTRAORDINARIA DE SONIDOS. //\nCAREY EMPEZÓ A ESCUCHAR A LOS GRANDES ARMONICISTAS. //\nA LITTLE WALTER. //\nA BIG WALTER HORTON. //\nY TRATABA DE DESCUBRIR CÓMO HACÍAN PARA SACAR AQUELLAS NOTAS. //\nPERO HABÍA UN PROBLEMA. //\nESCUCHAR UN DISCO NO ES LO MISMO QUE TENER AL MÚSICO DELANTE. //\nUNO PUEDE REPETIR UNA GRABACIÓN CIEN VECES Y SEGUIR SIN ENTENDER CÓMO SE CONSIGUE DETERMINADO SONIDO. //\nCAREY QUERÍA APRENDER. //\nY EN 1956 TUVO LA OPORTUNIDAD DE IR A CHICAGO CON EL PIANISTA LOVIE LEE. //\nERA MUY JOVEN. //\nPERO YA HABÍA TOCADO EN CONJUNTOS LOCALES. //\nYA SABÍA LO QUE SIGNIFICABA SUBIRSE A UN ESCENARIO. //\nY AHORA ESTABA EN LA CIUDAD DONDE VIVÍAN SUS ÍDOLOS. //\nUNA DE SUS PRIMERAS VISITAS FUE A UN CLUB LLAMADO ZANZIBAR. //\nALLÍ TOCABA LITTLE WALTER. //\nPENSÁ EN ESA SITUACIÓN. //\nUN MUCHACHO QUE HA PASADO AÑOS ESCUCHANDO A UN MÚSICO EN DISCOS. //\nQUE HA TRATADO DE COPIAR SUS FRASES. //\nQUE SE HA PREGUNTADO CÓMO CONSIGUE ESE SONIDO. //\nY QUE DE PRONTO ESTÁ DELANTE DE ÉL. //\nLITTLE WALTER ERA UNA FIGURA FUNDAMENTAL. //\nHABÍA TRANSFORMADO LA ARMÓNICA ELÉCTRICA. //\nHABÍA APRENDIDO A UTILIZAR EL MICRÓFONO Y EL AMPLIFICADOR PARA CONSEGUIR UN SONIDO MÁS PODEROSO. //\nY HABÍA DEMOSTRADO QUE UNA ARMÓNICA PODÍA TENER LA MISMA FUERZA QUE UNA GUITARRA. //\nCAREY LO ESCUCHÓ. //\nLO CONOCIÓ. //\nY APRENDIÓ DE ÉL. //\nPERO TODAVÍA TENÍA OTRO ENCUENTRO POR DELANTE. //\nBIG WALTER HORTON. //\nBIG WALTER TENÍA UNA MANERA MUY PARTICULAR DE TOCAR. //\nSU SONIDO ERA PROFUNDO. //\nPODÍA SOSTENER UNA NOTA Y HACER QUE PARECIERA MUCHO MÁS GRANDE DE LO QUE ERA. //\nNO NECESITABA LLENAR TODOS LOS ESPACIOS. //\nA VECES LE ALCANZABA CON UNA FRASE PARA CAMBIAR EL CLIMA DE UNA CANCIÓN. //\nCAREY QUEDÓ FASCINADO. //\nEMPEZÓ A SEGUIRLO. //\nA ESCUCHARLO. //\nY CON EL TIEMPO SE CONVIRTIERON EN AMIGOS. //\nPERO APRENDER A TOCAR BIEN NO GARANTIZABA CONSEGUIR TRABAJO. //\nEN CHICAGO, LA ESCENA MUSICAL ESTABA CAMBIANDO. //\nLOS GUITARRISTAS ELÉCTRICOS TENÍAN CADA VEZ MÁS PROTAGONISMO. //\nY NO SIEMPRE HABÍA LUGAR PARA OTRO ARMONICISTA. //\nCAREY TENÍA QUE GANARSE LA VIDA. //\nENTONCES TOMÓ UNA DECISIÓN PRÁCTICA. //\nAPRENDIÓ A TOCAR EL BAJO. //\nHOUND DOG TAYLOR LO AYUDÓ A DESARROLLAR ESE INSTRUMENTO. //\nY CAREY EMPEZÓ A CONSEGUIR TRABAJO COMO BAJISTA. //\nINCLUSO TOCÓ EL BAJO EN LA BANDA DE BIG WALTER HORTON. //\nES UNA SITUACIÓN CURIOSA. //\nEL JOVEN QUE HABÍA LLEGADO A CHICAGO PARA APRENDER ARMÓNICA DE UNO DE SUS GRANDES MAESTROS TERMINABA ACOMPAÑÁNDOLO CON OTRO INSTRUMENTO. //\nPERO NO ERA UNA DERROTA. //\nERA UNA MANERA DE SEGUIR DENTRO DE LA MÚSICA. //\nY ADEMÁS LE PERMITÍA APRENDER ALGO QUE DESPUÉS SERÍA FUNDAMENTAL. //\nESCUCHAR A LOS DEMÁS. //\nCUANDO UNO TOCA EL BAJO, NO PUEDE PENSAR SOLAMENTE EN SUS PROPIAS NOTAS. //\nTIENE QUE ESCUCHAR AL BATERISTA. //\nAL CANTANTE. //\nAL PIANISTA. //\nA LA GUITARRA. //\nY CAREY APRENDIÓ A ENTENDER UNA BANDA DESDE ADENTRO. //\nEN 1969 LLEGÓ UNA OPORTUNIDAD IMPORTANTE. //\nGRABÓ CAREY BELL'S BLUES HARP PARA DELMARK RECORDS. //\nPOR FIN PODÍA MOSTRAR SU TRABAJO COMO ARMONICISTA PRINCIPAL. //\nY EN AQUELLAS SESIONES PARTICIPARON MÚSICOS DE GRAN NIVEL, COMO PINETOP PERKINS, JIMMY DAWKINS Y EDDIE TAYLOR. //\nEL DISCO INCLUÍA VERSIONES DE CANCIONES ASOCIADAS A LITTLE WALTER. //\nY ESO TENÍA UN SIGNIFICADO ESPECIAL. //\nPORQUE EL JOVEN QUE HABÍA IDO A ESCUCHARLO EN UN CLUB AHORA ESTABA GRABANDO AQUEL REPERTORIO CON SU PROPIA PERSONALIDAD. //\nPERO LA HISTORIA TODAVÍA GUARDABA ALGO MEJOR. //\nEN LOS PRIMEROS AÑOS SETENTA, CAREY VOLVIÓ A ENCONTRARSE MUSICALMENTE CON BIG WALTER HORTON. //\nLOS DOS GRABARON JUNTOS PARA ALLIGATOR. //\nY ACÁ QUIERO DETENERME. //\nPORQUE HAY MUCHOS DISCOS DONDE UN MÚSICO JOVEN COMPARTE ESTUDIO CON UNO MAYOR. //\nPERO NO TODOS TIENEN DETRÁS UNA RELACIÓN COMO ESTA. //\nCAREY HABÍA ADMIRADO A BIG WALTER DESDE QUE ERA CHICO. //\nLO HABÍA ESCUCHADO. //\nLO HABÍA SEGUIDO. //\nHABÍA APRENDIDO DE ÉL. //\nY AHORA LOS DOS ESTABAN GRABANDO. //\nNO ERA SOLAMENTE UN ENCUENTRO ENTRE DOS ARMONICISTAS. //\nERA UNA RELACIÓN DE AÑOS QUE HABÍA LLEGADO AL ESTUDIO. //\nCAREY TAMBIÉN TRABAJÓ CON MUDDY WATERS Y WILLIE DIXON. //\nY CON EL TIEMPO SE CONVIRTIÓ EN UNO DE LOS ARMONICISTAS MÁS RESPETADOS DE CHICAGO. //\nEN 1990 PARTICIPÓ EN UN PROYECTO MUY ESPECIAL. //\nHARP ATTACK! //\nCUATRO GRANDES ARMONICISTAS EN UN MISMO DISCO. //\nJUNIOR WELLS. /\nJAMES COTTON. /\nBILLY BRANCH. /\nY CAREY BELL. //\nCUATRO PERSONALIDADES. //\nCUATRO MANERAS DE TOCAR. //\nY UNA MISMA TRADICIÓN MUSICAL. //\nPERO QUIERO CONTARTE OTRA PARTE DE SU VIDA. //\nUNA QUE ME PARECE PARTICULARMENTE LINDA. //\nSU RELACIÓN CON SU HIJO LURRIE BELL. //\nLURRIE CRECIÓ RODEADO DE MÚSICA. //\nSU PADRE TOCABA CON ALGUNOS DE LOS HOMBRES MÁS IMPORTANTES DEL BLUES. //\nY ÉL MISMO TERMINÓ CONVIRTIÉNDOSE EN UN GRAN GUITARRISTA. //\nPERO LA VIDA DE LURRIE NO FUE SENCILLA. //\nATRAVESÓ PROBLEMAS PERSONALES Y DE SALUD. //\nY LA RELACIÓN ENTRE PADRE E HIJO TUVO QUE CONVIVIR CON ESAS DIFICULTADES. //\nSIN EMBARGO, LA MÚSICA SIGUIÓ SIENDO UN LUGAR DONDE PODÍAN ENCONTRARSE. //\nEN 1991 COMPARTIERON UNA GIRA POR FINLANDIA. //\nIMAGINATE LA DISTANCIA. //\nDOS MÚSICOS FORMADOS EN LA TRADICIÓN DEL BLUES DE CHICAGO, VIAJANDO POR UN PAÍS DEL NORTE DE EUROPA. //\nEN PLENO INVIERNO. //\nTOCANDO EN LUGARES QUE ESTABAN A MILES DE KILÓMETROS DEL MISSISSIPPI. //\nY SIN EMBARGO, LA MÚSICA FUNCIONABA. //\nLA GENTE ESCUCHABA. //\nSE EMOCIONABA. //\nY EN AQUELLOS CONCIERTOS QUEDARON REGISTRADAS INTERPRETACIONES QUE AÑOS DESPUÉS SE PUBLICARÍAN EN SECOND NATURE. //\nEL TÍTULO ES MUY APROPIADO. //\nSEGUNDA NATURALEZA. //\nALGO QUE UNO HACE CASI SIN PENSARLO PORQUE FORMA PARTE DE SU VIDA. //\nY PARA CAREY Y LURRIE, TOCAR BLUES JUNTOS TENÍA ALGO DE ESO. //\nPADRE E HIJO COMPARTÍAN UNA MÚSICA QUE HABÍA ACOMPAÑADO A LA FAMILIA DURANTE DÉCADAS. //\nCAREY MURIÓ EL 6 DE MAYO DE 2007. //\nTENÍA 70 AÑOS. //\nY HABÍA RECORRIDO UN CAMINO EXTRAORDINARIO. //\nDEL CHICO QUE QUERÍA UN SAXOFÓN Y TERMINÓ CON UNA ARMÓNICA... //\nAL JOVEN QUE VIAJÓ A CHICAGO PARA CONOCER A SUS ÍDOLOS... //\nAL MÚSICO QUE TUVO QUE APRENDER EL BAJO PARA PODER TRABAJAR... //\nY FINALMENTE, AL PADRE QUE COMPARTIÓ SU MÚSICA CON SU HIJO. //\nHAY ALGO QUE ME GUSTA MUCHO DE ESTA HISTORIA. //\nCAREY NO CONSIGUIÓ EL INSTRUMENTO QUE QUERÍA. //\nPERO CON EL QUE TUVO CONSIGUIÓ CONSTRUIR UNA VIDA ENTERA. //\nSELECCIÓN MUSICAL — CAREY BELL\nPRIMER TEMA: I'M READY.\nEMPEZAMOS CON UNA CANCIÓN COMPUESTA POR WILLIE DIXON, INCLUIDA EN SU DISCO DE 1969. / LA ELEGIMOS PORQUE NOS PERMITE ESCUCHAR A CAREY EN EL MOMENTO EN QUE EMPEZABA A PRESENTARSE COMO PROTAGONISTA. // DESPUÉS DE AÑOS DE ACOMPAÑAR A OTROS, AHORA ERA SU ARMÓNICA LA QUE ESTABA EN PRIMER PLANO. //\nSEGUNDO TEMA: I GOT TO FIND SOMEBODY.\nESTA CANCIÓN PERTENECE AL REPERTORIO DE LITTLE WALTER. / Y ESO LA CONVIERTE EN UNA ELECCIÓN MUY ESPECIAL. // CAREY HABÍA LLEGADO A CHICAGO QUERIENDO CONOCER A ESE MÚSICO. / AHORA PODEMOS ESCUCHAR CÓMO INTERPRETABA UNA DE LAS CANCIONES DE SU MAESTRO. //\nTERCER TEMA: ROCKING WITH A CHROMATIC.\nLA ARMÓNICA CROMÁTICA PERMITE UN LENGUAJE MUSICAL DIFERENTE DEL DE LA ARMÓNICA DIATÓNICA TRADICIONAL. / LA ELEGIMOS PORQUE NOS DEJA ESCUCHAR EL COSTADO MÁS INSTRUMENTAL DE CAREY. // ACÁ NO HACE FALTA UNA HISTORIA CANTADA. / LA HISTORIA LA CUENTA EL INSTRUMENTO. //\nCUARTO TEMA: I'M GONNA BUY ME A TRAIN TICKET.\nTERMINAMOS CON UNA COMPOSICIÓN DEL PROPIO CAREY BELL. / LA ELEGIMOS PORQUE EL VIAJE FUE UNA PARTE FUNDAMENTAL DE SU VIDA. // DE MISSISSIPPI A CHICAGO. / DE LOS CLUBES A LOS ESTUDIOS. / Y DE CHICAGO A ESCENARIOS DE TODO EL MUNDO. // UN HOMBRE QUE NUNCA DEJÓ DE LLEVAR SU ARMÓNICA CONSIGO. //\n\nCAPÍTULO 4\nSON SEALS — EL BLUES QUE CRECIÓ DETRÁS DE UN BAR\nCUANDO SON SEALS ERA CHICO, NO NECESITABA SALIR DE SU CASA PARA ESCUCHAR BLUES. //\nLA MÚSICA ESTABA AHÍ. //\nA POCOS METROS. //\nSU PADRE, JIM SEALS, TENÍA UN LOCAL EN OSCEOLA, ARKANSAS, LLAMADO THE DIPSY DOODLE. //\nY POR AQUEL LUGAR PASABAN MÚSICOS QUE MUCHOS AÑOS DESPUÉS SERÍAN RECORDADOS COMO GRANDES FIGURAS DEL BLUES. //\nPERO PARA SON, EN AQUEL MOMENTO, ERAN SIMPLEMENTE LOS HOMBRES QUE TOCABAN EN EL BAR DE SU PADRE. //\nLOS ESCUCHABA. //\nLOS VEÍA PREPARAR LOS INSTRUMENTOS. //\nLOS OBSERVABA DURANTE LAS PRESENTACIONES. //\nY CRECIÓ ENTENDIENDO QUE LA MÚSICA NO ERA SOLAMENTE LO QUE OCURRÍA CUANDO SE ENCENDÍAN LAS LUCES DEL ESCENARIO. //\nTAMBIÉN ERA TRABAJO. //\nERA ENSAYAR. //\nERA VIAJAR. //\nERA CARGAR EQUIPOS. //\nERA VOLVER A CASA CANSADO. //\nY AL DÍA SIGUIENTE, EMPEZAR DE NUEVO. //\nSU PADRE CONOCÍA BIEN ESE MUNDO. //\nHABÍA TRABAJADO COMO MÚSICO. //\nY HABÍA PARTICIPADO EN ESPECTÁCULOS ITINERANTES. //\nPOR ESO, CUANDO SU HIJO EMPEZÓ A INTERESARSE POR LOS INSTRUMENTOS, NO LO TRATÓ COMO SI ESTUVIERA JUGANDO. //\nLE ENSEÑÓ A TOCAR. //\nPERO NO LE PERMITÍA HACER CUALQUIER COSA. //\nSON QUERÍA RECORRER EL MÁSTIL DE LA GUITARRA. //\nQUERÍA HACER SOLOS. //\nQUERÍA TOCAR COMO LOS HOMBRES QUE VEÍA EN EL BAR. //\nPERO SU PADRE LE EXIGÍA QUE APRENDIERA PRIMERO A SOSTENER EL RITMO. //\nA VECES TENÍ E BUENAS NOTICIAS. //\nHUBO CONFLICTOS PROFESIONALES. //\nCAMBIOS DE BANDA. //\nMOMENTOS EN LOS QUE SU RELACIÓN CON LA INDUSTRIA DISCOGRÁFICA NO FUE SENCILLA. //\nY DESPUÉS LLEGARON LOS PROBLEMAS PERSONALES Y DE SALUD. //\nEN 1995 SUFRIÓ UN ACCIDENTE AUTOMOVILÍSTICO QUE LE PRODUJO UNA LESIÓN IMPORTANTE EN LA MANO IZQUIERDA. //\nPARA UN GUITARRISTA, ESO ES UN PROBLEMA ENORME. //\nPORQUE ESA MANO ES LA QUE TRABAJA SOBRE EL MÁSTIL. //\nLA QUE FORMA LOS ACORDES. //\nLA QUE ESTIRA LAS CUERDAS. //\nLA QUE PERMITE QUE UNA NOTA SE TRANSFORME EN UNA FRASE. //\nSON TUVO QUE RECUPERARSE. //\nY VOLVIÓ A TOCAR. //\nPERO EN 1997 RECIBIÓ UN DISPARO DURANTE UN EPISODIO DE VIOLENCIA DOMÉSTICA. //\nSUFRIÓ HERIDAS EN LA ZONA DE LA CARA Y EL CUELLO. //\nY OTRA VEZ TUVO QUE ENFRENTAR UNA RECUPERACIÓN DIFÍCIL. //\nCOMO SI ESO NO FUERA SUFICIENTE, LA DIABETES QUE PADECÍA LE PROVOCÓ COMPLICACIONES GRAVES. //\nEN 1999 TUVIERON QUE AMPUTARLE PARTE DE LA PIERNA IZQUIERDA. //\nY ACÁ QUIERO DETENERME UN MOMENTO. //\nPORQUE A VECES CONTAMOS ESTAS COSAS COMO SI FUERAN SOLAMENTE UNA LISTA DE DESGRACIAS. //\nUN ACCIDENTE. //\nUN DISPARO. //\nUNA AMPUTACIÓN. //\nPERO DETRÁS DE CADA UNA DE ESAS PALABRAS HABÍA MESES DE RECUPERACIÓN. //\nDOLOR. //\nCAMBIOS EN LA VIDA COTIDIANA. //\nY UN HOMBRE QUE TODAVÍA QUERÍA SUBIRSE A UN ESCENARIO. //\nSON NO DEJÓ DE HACER MÚSICA. //\nEN 2000 PUBLICÓ LETTIN' GO. //\nY EL DISCO TENÍA ALGO PARTICULAR. //\nNO ERA SOLAMENTE EL REGRESO DE UN MÚSICO DESPUÉS DE VARIOS PROBLEMAS DE SALUD. //\nERA UN TRABAJO QUE MOSTRABA QUE TODAVÍA TENÍA GANAS DE PROBAR COSAS NUEVAS. //\nEN AQUEL ÁLBUM PARTICIPÓ TREY ANASTASIO, EL GUITARRISTA DE PHISH. //\nY ACÁ APARECE UNA DE LAS PARTES MÁS LINDAS DE ESTA HISTORIA. //\nPHISH ERA UNA BANDA DE ROCK DE OTRA GENERACIÓN. //\nTENÍA SU PROPIO PÚBLICO. //\nSUS PROPIAS COSTUMBRES. //\nY UNA MANERA DE TRABAJAR MUY DIFERENTE DE LA DE LOS BLUESMEN TRADICIONALES. //\nPERO HABÍA UNA CANCIÓN DE SON SEALS QUE LES GUSTABA ESPECIALMENTE. //\nFUNKY BITCH. //\nLA INCORPORARON A SU REPERTORIO. //\nY CON EL TIEMPO SE CONVIRTIÓ EN UNA CANCIÓN CONOCIDA POR SUS SEGUIDORES. //\nASÍ QUE UNA COMPOSICIÓN NACIDA EN EL MUNDO DEL BLUES DE CHICAGO TERMINÓ SONANDO EN CONCIERTOS DE ROCK ANTE UNA GENERACIÓN DISTINTA. //\nY SON LLEGÓ A COMPARTIR ESCENARIO CON ELLOS. //\nES UNA HISTORIA QUE ME GUSTA PORQUE DEMUESTRA QUE LA MÚSICA PUEDE VIAJAR MUCHO MÁS LEJOS DE LO QUE IMAGINA QUIEN LA COMPONE. //\nSON NO HABÍA ESCRITO AQUELLA CANCIÓN PENSANDO EN PHISH. //\nLA HABÍA ESCRITO COMO PARTE DE SU PROPIO REPERTORIO. //\nPERO AÑOS DESPUÉS OTROS MÚSICOS LA ENCONTRARON. //\nLA HICIERON SUYA. //\nY LA LLEVARON A OTRO PÚBLICO. //\nSON MURIÓ EL 20 DE DICIEMBRE DE 2004. //\nTENÍA 62 AÑOS. //\nY AUNQUE SUS ÚLTIMOS AÑOS ESTUVIERON MARCADOS POR PROBLEMAS DE SALUD, SU MÚSICA SIGUIÓ CIRCULANDO. //\nPERO YO NO QUIERO TERMINAR ESTA HISTORIA CON LA IMAGEN DE UN HOMBRE ENFERMO. //\nQUIERO VOLVER AL DIPSY DOODLE. //\nAL BAR DE SU PADRE. //\nAL CHICO QUE ESCUCHABA A LOS MÚSICOS DESDE MUY PEQUEÑO. //\nAL MUCHACHO QUE QUERÍA HACER SOLOS Y AL PADRE QUE LE DECÍA QUE PRIMERO TENÍA QUE APRENDER A TOCAR UN ACORDE. //\nPORQUE HAY ALGO DE AQUELLA ENSEÑANZA QUE SE ESCUCHA DURANTE TODA SU CARRERA. //\nSON SEALS PODÍA TOCAR CON UNA FUERZA EXTRAORDINARIA. //\nPERO NUNCA DEJÓ DE SER UN MÚSICO QUE ENTENDÍA EL RITMO. //\nY ESO LO HABÍA APRENDIDO EN SU CASA. //\nMUCHO ANTES DE CHICAGO. //\nMUCHO ANTES DE ALLIGATOR RECORDS. //\nMUCHO ANTES DE QUE EL MUNDO APRENDIERA SU NOMBRE. //\nSELECCIÓN MUSICAL — SON SEALS\nPRIMER TEMA: YOUR LOVE IS LIKE A CANCER.\nEMPEZAMOS CON UNA CANCIÓN DE SU PRIMER DISCO. / LA ELEGIMOS PORQUE PRESENTA AL SON SEALS QUE LLEGÓ A CHICAGO CON UNA PERSONALIDAD YA FORMADA. // UNA GUITARRA ÁSPERA, UNA VOZ PODEROSA Y UNA MANERA DIRECTA DE ESCRIBIR. //\nSEGUNDO TEMA: HOT SAUCE.\nSEGUIMOS CON UN INSTRUMENTAL DE AQUEL MISMO ÁLBUM. / LA ELEGIMOS PORQUE NOS PERMITE ESCUCHAR LA GUITARRA SIN QUE LA VOZ OCUPE EL CENTRO. // ACÁ APARECEN EL RITMO, LA FUERZA Y EL APRENDIZAJE QUE HABÍA COMENZADO EN EL BAR DE SU PADRE. //\nTERCER TEMA: TELEPHONE ANGEL.\nAHORA PASAMOS A LA ETAPA DE MIDNIGHT SON. / LA ELEGIMOS PORQUE MUESTRA UN SONIDO MÁS ELABORADO, CON ARREGLOS Y UNA RELACIÓN MÁS CERCANA CON EL SOUL. // SON SEALS NO QUERÍA REPETIR SIEMPRE EL MISMO DISCO. //\nCUARTO TEMA: FUNKY BITCH.\nY TERMINAMOS CON LA CANCIÓN QUE ENCONTRÓ UNA SEGUNDA VIDA EN EL REPERTORIO DE PHISH. / LA ELEGIMOS PORQUE ES UNA DE LAS CONEXIONES MÁS LINDAS DE SU CARRERA. // UNA CANCIÓN DE BLUES QUE VIAJÓ HACIA EL ROCK Y TERMINÓ PRESENTANDO SU MÚSICA A OTRA GENERACIÓN. //\n\nCIERRE GENERAL\nBUENO... //\nHASTA ACÁ LLEGAMOS CON LAS HISTORIAS DE ESTA NOCHE. //\nCUATRO MÚSICOS. //\nCUATRO VIDAS MUY DIFERENTES. //\nY UNA MISMA CIUDAD QUE LOS RECIBIÓ, LOS PUSO A PRUEBA Y LES DIO UN LUGAR DONDE HACERSE ESCUCHAR. //\nKOKO TAYLOR LLEGÓ A CHICAGO DESPUÉS DE UNA INFANCIA DIFÍCIL Y TERMINÓ CONVIRTIÉNDOSE EN UNA DE LAS VOCES MÁS IMPORTANTES DEL BLUES. //\nMIGHTY JOE YOUNG PASÓ GRAN PARTE DE SU VIDA ACOMPAÑANDO A OTROS Y TERMINÓ ENFRENTANDO LA PÉRDIDA DE AQUELLO QUE MÁS AMABA HACER. //\nCAREY BELL QUISO TOCAR UN SAXOFÓN, TERMINÓ CON UNA ARMÓNICA Y ENCONTRÓ EN ESE PEQUEÑO INSTRUMENTO EL CAMINO DE TODA SU VIDA. //\nY SON SEALS CRECIÓ ESCUCHANDO MÚSICA EN EL BAR DE SU PADRE, SIN IMAGINAR QUE UN DÍA SUS CANCIONES LLEGARÍAN A OTRA GENERACIÓN. //\nY SI HAY ALGO QUE ME GUSTARÍA QUE NOS QUEDE DE ESTAS CUATRO HISTORIAS, ES ESTO. //\nNO SIEMPRE PODEMOS ELEGIR LO QUE NOS TOCA VIVIR. //\nPERO MUCHAS VECES SÍ PODEMOS ELEGIR QUÉ HACEMOS CON LO QUE TENEMOS. //\nKOKO TENÍA UNA VOZ. //\nMIGHTY JOE TENÍA UNA GUITARRA. //\nCAREY TENÍA UNA ARMÓNICA. //\nY SON TENÍA TODO LO QUE HABÍA APRENDIDO DETRÁS DE UN BAR. //\nNINGUNO TUVO UNA VIDA PERFECTA. //\nPERO LOS CUATRO DEJARON ALGO QUE TODAVÍA PODEMOS ESCUCHAR. //\nY QUIZÁS ESA SEA UNA DE LAS COSAS MÁS LINDAS DE LA MÚSICA. //\nQUE A VECES UNA PERSONA SE VA... //\nPERO LO QUE HIZO SIGUE ACOMPAÑANDO A OTRAS. //\nSOY SEBASTIÁN SOPELANA. //\nESTO FUE RUIDOS MOLESTOS. //\nUN INSOPORTABLE PROGRAMA DE ROCK. //\nPOR FM DEL LAGO 102.5. //\nLA HISTORIA LLEGÓ A SU FIN, EL BLUES POR SUERTE, NO. //\n\nAnexo de producción — YouTube\n1 Koko Taylor — Wang Dang Doodle — Buscar\n2 Koko Taylor — I Got What It Takes — Buscar\n3 Koko Taylor — I'm a Woman — Buscar\n4 Koko Taylor — Come to Mama — Buscar\n5 Mighty Joe Young — Why Baby? — Buscar\n6 Mighty Joe Young — Somebody Loan Me a Dime — Buscar\n7 Mighty Joe Young — Every Man Needs a Woman — Buscar\n8 Mighty Joe Young — Turning Point — Buscar\n9 Carey Bell — I'm Ready — Buscar\n10 Carey Bell — I Got to Find Somebody — Buscar\n11 Carey Bell — Rocking With a Chromatic — Buscar\n12 Carey Bell — I'm Gonna Buy Me a Train Ticket — Buscar\n13 Son Seals — Your Love Is Like a Cancer — Buscar\n14 Son Seals — Hot Sauce — Buscar\n15 Son Seals — Telephone Angel — Buscar\n16 Son Seals — Funky Bitch — Buscar"; let size=32;
