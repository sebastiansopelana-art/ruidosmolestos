<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRODUCCIÓN · Ruidos Molestos</title>
<style>
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:#0b0b0b;font-family:Arial,sans-serif}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:white}
.box{width:100%;max-width:420px;text-align:center}.box h1{font-family:Georgia,serif;font-size:42px;margin:0 0 12px}.box p{color:#aaa}
input{width:100%;font-size:32px;text-align:center;letter-spacing:10px;padding:16px;margin:18px 0;background:#171717;border:1px solid #777;color:white}
button{cursor:pointer;padding:15px 22px;background:#111;color:white;border:1px solid #777;font-weight:bold}
#login button{width:100%}#error{color:#ddd;min-height:24px}
#page{min-height:100vh;background:#101010;color:#171717;position:relative;isolation:isolate}#page:before,#page:after{content:'';position:fixed;top:0;bottom:0;width:max(0px,calc((100vw - 1240px)/2));background-size:cover;background-position:center;filter:grayscale(1) brightness(.65);z-index:-1;pointer-events:none}#page:before{left:0;background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Stevie_Ray_Vaughan_Live_1983.jpg?width=900')}#page:after{right:0;background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Stevie_Ray_Vaughan_Ritz_-_behind_the_back_-_making_a_face.jpg?width=900')}
.top{position:sticky;top:0;background:#111;color:white;padding:12px;display:flex;gap:8px;align-items:center;justify-content:center;z-index:2}
.top button{padding:10px 16px}.paper{max-width:1240px;margin:auto;padding:70px 7vw 120px;min-height:100vh;background:#eae5db;box-shadow:0 0 45px #000}
#text{font-family:Georgia,serif;font-size:32px;line-height:1.7}#text .line{white-space:pre-wrap}#text .voice-emphasis{font-weight:800}#text .program-title{font-size:1.65em;font-weight:800;line-height:1.15;margin:0 0 30px}#text .chapter-title{font-size:1.45em;font-weight:800;line-height:1.15;margin:55px 0 22px}#text .section-title{font-size:1.18em;font-weight:800;margin:35px 0 16px}#text .music-note{font-size:.92em;line-height:1.6;margin:12px 0 18px;padding-left:18px;border-left:3px solid #777}
textarea{width:100%;min-height:75vh;border:0;outline:0;background:transparent;resize:none;font-family:Georgia,serif;font-size:28px;line-height:1.7;color:#171717}
@media(max-width:600px){.paper{padding:45px 22px 100px}#text{font-size:25px}.box h1{font-size:34px}}
</style>
</head>
<body>
<section id="login">
 <div class="box"><h1>PRODUCCIÓN</h1><p>Ingresá tu código</p>
 <input id="pass" type="password" inputmode="numeric" maxlength="4" autofocus>
 <button id="enter">ENTRAR</button><div id="error"></div></div>
</section>
<section id="page" hidden>
 <div class="top"><button id="minus">A−</button><button id="plus">A+</button><button id="editBtn">EDITAR</button><button id="saveBtn" hidden>GUARDAR</button><button id="exitBtn">SALIR</button></div>
 <div class="paper"><div id="text"></div><textarea id="editor" hidden placeholder="Pegá acá las historias del día..."></textarea></div>
</section>
<script>
(function(){
 const login=document.getElementById('login'),page=document.getElementById('page'),pass=document.getElementById('pass'),error=document.getElementById('error'),text=document.getElementById('text'),editor=document.getElementById('editor'),editBtn=document.getElementById('editBtn'),saveBtn=document.getElementById('saveBtn');
 const DEFAULT_PROGRAM="RUIDOS MOLESTOS\nPRODUCCIÓN\n\nEspacio disponible para cargar el próximo programa."; let size=32;
 function show(){login.hidden=true;page.hidden=false;render()}
 function render(){const raw=localStorage.getItem('rm_lectura_42')||DEFAULT_PROGRAM; text.innerHTML=''; const key=/^(CHICAGO NO SE RINDE\.|Y EL BLUES SE ENCHUFÓ\.|VOLVIÓ\.|ENTRÓ CON TODA SU VOZ\.|MIGHTY JOE YOUNG\.|APRENDIÓ A TOCAR EL BAJO\.|SEGUÍA TENIENDO FILO\.|LA HISTORIA LLEGÓ A SU FIN)/i; raw.split('\\n').forEach(function(line){const d=document.createElement('div');d.textContent=line||' ';d.className='line';if(/^PROGRAMA \\d+/i.test(line))d.className+=' program-title';else if(/^CAPÍTULO \\d+/i.test(line))d.className+=' chapter-title';else if(/^(PRESENTACIÓN|CIERRE|MÚSICA|LA MÚSICA DEL CAPÍTULO)/i.test(line))d.className+=' section-title';else if(/^POR QUÉ:/i.test(line))d.className+=' music-note';if(key.test(line.trim()))d.className+=' voice-emphasis';text.appendChild(d)})}
 function enter(){if(pass.value==='0253'){sessionStorage.setItem('rm_pass','ok');show()}else{error.textContent='Código incorrecto';pass.value='';pass.focus()}}
 document.getElementById('enter').onclick=enter;
 pass.addEventListener('keydown',function(e){if(e.key==='Enter')enter()});
 if(sessionStorage.getItem('rm_pass')==='ok')show();
 editBtn.onclick=function(){editor.value=localStorage.getItem('rm_lectura_42')||DEFAULT_PROGRAM;text.hidden=true;editor.hidden=false;editBtn.hidden=true;saveBtn.hidden=false;editor.focus()};
 saveBtn.onclick=function(){localStorage.setItem('rm_lectura_42',editor.value);editor.hidden=true;text.hidden=false;saveBtn.hidden=true;editBtn.hidden=false;render()};
 document.getElementById('plus').onclick=function(){size=Math.min(48,size+2);text.style.fontSize=size+'px'};
 document.getElementById('minus').onclick=function(){size=Math.max(18,size-2);text.style.fontSize=size+'px'};
 document.getElementById('exitBtn').onclick=function(){sessionStorage.removeItem('rm_pass');location.reload()};
})();
</script>
</body></html>
