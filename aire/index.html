(function(){
 const login=document.getElementById('login'),page=document.getElementById('page'),pass=document.getElementById('pass'),error=document.getElementById('error'),text=document.getElementById('text'),editor=document.getElementById('editor'),editBtn=document.getElementById('editBtn'),saveBtn=document.getElementById('saveBtn');
 const DEFAULT_PROGRAM="PROGRAMA 41 — CHICAGO NO SE RINDE\n\nPRESENTACIÓN\n\nBUENAS NOCHES. //\n\nHAY CIUDADES QUE UNO PUEDE CONTAR MIRANDO UN MAPA. / Y HAY OTRAS QUE HAY QUE ESCUCHAR. //\n\nCHICAGO ES UNA DE ESAS. //\n\nPORQUE DURANTE DÉCADAS, MIENTRAS ARRIBA PASABAN LOS TRENES, LAS FÁBRICAS CAMBIABAN DE TURNO Y EL FRÍO SE METÍA ENTRE LOS EDIFICIOS, / ABAJO HABÍA OTRA CIUDAD. //\n\nUNA CIUDAD DE CLUBES CHICOS. / DE ESCENARIOS APRETADOS. / DE AMPLIFICADORES QUE TENÍAN QUE SONAR MÁS FUERTE QUE LAS CONVERSACIONES, LOS VASOS Y EL RUIDO DE LA CALLE. //\n\nAHÍ EL BLUES DEJÓ DE SER SOLAMENTE EL RECUERDO DEL SUR. / SE VOLVIÓ URBANO. / ELÉCTRICO. / ÁSPERO. / Y, SOBRE TODO, NECESARIO. //\n\nMUCHA DE LA GENTE QUE LLEGÓ A CHICAGO NO VENÍA BUSCANDO HACER HISTORIA. / VENÍA BUSCANDO TRABAJO. / UNA CASA. / UNA OPORTUNIDAD. / ALGO DISTINTO DE LO QUE HABÍA DEJADO ATRÁS. //\n\nY CON ELLOS VIAJÓ LA MÚSICA. //\n\nVIAJARON LAS CANCIONES. / LAS FORMAS DE CANTAR. / LOS RITMOS. / LAS GUITARRAS. / LAS ARMÓNICAS. / ESA MANERA DE CONTAR UNA VIDA SIN NECESIDAD DE EXPLICARLA DEMASIADO. //\n\nPERO LA CIUDAD OBLIGÓ A ESA MÚSICA A CAMBIAR. //\n\nEN UN BAR LLENO NO ALCANZABA CON TOCAR. / HABÍA QUE HACERSE ESCUCHAR. //\n\nY EL BLUES SE ENCHUFÓ. //\n\nSUBIÓ EL VOLUMEN. / ENDURECIÓ EL PULSO. / ENCONTRÓ OTRA FORMA DE RESPIRAR. //\n\nLO EXTRAORDINARIO ES QUE NO OCURRIÓ UNA SOLA VEZ. //\n\nCUANDO PARECÍA QUE EL BLUES PODÍA QUEDAR ATRÁS, / APARECÍA OTRA GENERACIÓN. //\n\nOTRA VOZ. / OTRA GUITARRA. / OTRA ARMÓNICA. / OTRO CLUB DONDE TODAVÍA HABÍA ALGUIEN DISPUESTO A TOCAR COMO SI ESA NOCHE FUERA LA ÚLTIMA. //\n\nPOR ESO EL PROGRAMA DE HOY NO ES UN HOMENAJE A UNA ÉPOCA. //\n\nTAMPOCO ES UNA VISITA A UN MUSEO. //\n\nES LA HISTORIA DE UNA MÚSICA QUE SOBREVIVIÓ PORQUE HUBO GENTE QUE SE NEGÓ A DEJARLA QUIETA. //\n\nGENTE QUE NO NECESITÓ ESTAR EN LA FOTO MÁS FAMOSA. / NI VENDER MILLONES DE DISCOS. / NI CONVERTIRSE EN UN NOMBRE CONOCIDO POR TODO EL MUNDO. //\n\nALCANZÓ CON QUE, CUANDO LLEGARA LA NOCHE, / HUBIERA UN ESCENARIO. / UN INSTRUMENTO. / Y ALGUIEN DEL OTRO LADO DISPUESTO A ESCUCHAR. //\n\nESTA NOCHE VAMOS A QUEDARNOS AHÍ. //\n\nEN ESE CHICAGO QUE NO ERA ELEGANTE. / QUE NO ERA FÁCIL. / QUE MUCHAS VECES NI SIQUIERA ERA JUSTO. //\n\nPERO QUE TENÍA ALGO DIFÍCIL DE APAGAR. //\n\nUNA MÚSICA QUE PODÍA CAMBIAR DE MANOS, DE BARRIO Y DE GENERACIÓN, / PERO SEGUÍA TENIENDO LA MISMA NECESIDAD DE DECIR ALGO. //\n\nPOR ESO ESTE PROGRAMA SE LLAMA... //\n\nCHICAGO NO SE RINDE. //\n\nESTO ES RUIDOS MOLESTOS. / UN INSOPORTABLE PROGRAMA DE ROCK. //\n\nSOY SEBASTIÁN SOPELANA. //\n\n\nCAPÍTULO 1 — KOKO TAYLOR\nLA VOZ QUE HIZO TEMBLAR CHICAGO\n\nHAY UNA IMAGEN QUE ME GUSTA PARA ENTRAR EN ESTA HISTORIA. //\n\nUNA MUJER SUBE A UN ESCENARIO EN CHICAGO. / NO NECESITA UNA ORQUESTA GIGANTE. / NO NECESITA UN VESTUARIO QUE EXPLIQUE QUIÉN ES. //\n\nABRE LA BOCA. / Y EL LUGAR CAMBIA. //\n\nESA MUJER ES KOKO TAYLOR. //\n\nANTES DE SER CONOCIDA COMO LA REINA DEL BLUES DE CHICAGO, FUE CORA WALTON. / NACIÓ EN TENNESSEE, EN 1928. / CRECIÓ EN EL SUR RURAL, ENTRE TRABAJO DURO Y MÚSICA ESCUCHADA A ESCONDIDAS O EN LA RADIO. //\n\nEN ESE MUNDO, CANTAR NO ERA UNA CARRERA QUE ALGUIEN TE PONÍA DELANTE COMO POSIBILIDAD. / ERA UNA NECESIDAD. //\n\nEL BLUES NO ERA UNA POSTAL DEL PASADO. / ERA EL IDIOMA QUE HABLABA LA GENTE CUANDO EL DÍA HABÍA SIDO DEMASIADO LARGO. //\n\nEN 1952, KOKO Y SU MARIDO, ROBERT TAYLOR, SE MUDARON A CHICAGO. //\n\nIMAGINATE ESE VIAJE. / NO COMO UNA GIRA. / COMO UNA MUDANZA DE VIDA. //\n\nDEJAR ATRÁS EL CAMPO Y ENCONTRAR UNA CIUDAD DE FÁBRICAS, DE TRABAJO, DE BARRIOS DONDE LA GENTE QUE HABÍA LLEGADO DEL SUR SE RECONOCÍA EN LAS CANCIONES. //\n\nEN CHICAGO, EL BLUES YA HABÍA APRENDIDO A SONAR MÁS FUERTE. / NO POR CAPRICHO: / PORQUE LOS BARES ERAN RUIDOSOS, / PORQUE HABÍA QUE HACERSE OÍR. //\n\nKOKO TRABAJABA DE DÍA Y CANTABA CUANDO PODÍA. / EMPEZÓ A HACERSE UN LUGAR EN LOS CLUBES. //\n\nY EN UNA DE ESAS NOCHES APARECIÓ WILLIE DIXON. //\n\nDIXON NO ERA SOLAMENTE UN MÚSICO. / ERA UN COMPOSITOR, PRODUCTOR Y CAZADOR DE VOCES. / SABÍA RECONOCER CUÁNDO ALGUIEN TENÍA ALGO QUE NO SE PODÍA ENSEÑAR. //\n\nLA ESCUCHÓ. / Y ENTENDIÓ QUE ESA VOZ NO NECESITABA SER DOMESTICADA. //\n\nLA LLEVÓ A GRABAR. / Y EN 1965 LLEGÓ WANG DANG DOODLE. //\n\nLA CANCIÓN HABÍA SIDO ESCRITA POR DIXON Y GRABADA ANTES POR HOWLIN' WOLF. / PERO EN LA VOZ DE KOKO SE CONVIRTIÓ EN OTRA COSA. //\n\nERA UNA FIESTA DESCONTROLADA. / UNA CONVOCATORIA. / UN GRITO QUE NO PEDÍA PERMISO. //\n\nY TAMBIÉN FUE UN ÉXITO QUE ABRIÓ PUERTAS PARA UNA CANTANTE QUE HASTA ENTONCES HABÍA TENIDO QUE PELEAR CADA OPORTUNIDAD. //\n\nPENSÁ EN ESTO. / EN UNA INDUSTRIA QUE SOLÍA DARLE EL CENTRO DEL ESCENARIO A LOS HOMBRES, / KOKO NO ENTRÓ PIDIENDO UN RINCÓN. //\n\nENTRÓ CON TODA SU VOZ. //\n\nNO CANTABA COMO SI QUISIERA PARECERSE A NADIE. / CANTABA COMO SI TUVIERA UNA DISCUSIÓN PENDIENTE CON EL MUNDO. //\n\nDESPUÉS VINO EL TRABAJO DE VERDAD: / LOS ESCENARIOS, / LOS VIAJES, / LAS GRABACIONES, / LAS NOCHES BUENAS Y LAS OTRAS. //\n\nEN 1975 EMPEZÓ SU RELACIÓN CON ALLIGATOR RECORDS. / ALLÍ GRABÓ DISCOS QUE LA AYUDARON A LLEGAR A PÚBLICOS NUEVOS SIN CAMBIAR SU IDENTIDAD. //\n\nEL BLUES IBA ENTRANDO A FESTIVALES, A TEATROS Y A AUDIENCIAS QUE QUIZÁS NUNCA HABÍAN PISADO UN CLUB DEL SOUTH SIDE. //\n\nY KOKO LLEVABA ESE SONIDO SIN LIMPIARLE LAS ASPEREZAS. //\n\nSU HISTORIA TAMBIÉN ESTÁ HECHA DE GOLPES. / EN 1988 SUFRIÓ UN ACCIDENTE AUTOMOVILÍSTICO GRAVE. / HUBO RECUPERACIÓN, DOLOR Y UNA PREGUNTA INEVITABLE: / ¿VOLVERÁ A CANTAR? //\n\nVOLVIÓ. //\n\nNO PORQUE EL CUERPO NO HUBIERA PAGADO EL PRECIO. / VOLVIÓ PORQUE EL ESCENARIO ERA PARTE DE SU VIDA. //\n\nKOKO MURIÓ EN 2009. / PERO CADA VEZ QUE SUENA SU VOZ, CHICAGO DEJA DE SER UN PUNTO EN EL MAPA. //\n\nSE VUELVE UN BAR. / UNA NOCHE. / UN MICRÓFONO. //\n\nY UNA MUJER QUE NO ESPERÓ QUE LE DIERAN PERMISO PARA SER LA REINA DEL BLUES. //\n\nMÚSICA\n1. WANG DANG DOODLE\n2. I'M A WOMAN\n3. VOODOO WOMAN\n4. I'D RATHER GO BLIND\n\n\nCAPÍTULO 2 — MIGHTY JOE YOUNG\nLA GUITARRA DETRÁS DEL FUEGO\n\nA VECES, EN UNA BANDA, EL HOMBRE MÁS IMPORTANTE NO ES EL QUE ESTÁ EN EL CENTRO DE LA FOTO. //\n\nA VECES ESTÁ UN PASO ATRÁS. / ESCUCHANDO. / DEJANDO UN HUECO PARA QUE OTRO CANTE. / Y ENTRANDO JUSTO CUANDO LA CANCIÓN LO NECESITA. //\n\nEN CHICAGO HUBO UN GUITARRISTA QUE ENTENDIÓ ESO COMO POCOS. //\n\nMIGHTY JOE YOUNG. //\n\nJOSEPH YOUNG NACIÓ EN SHREVEPORT, LUISIANA, EN 1927. / SE CRIÓ EN MILWAUKEE Y TERMINÓ CONSTRUYENDO SU CARRERA EN CHICAGO. //\n\nNO FUE EL CAMINO DE UN CHICO AL QUE DESCUBRIERON UNA TARDE Y LE PUSIERON UN CONTRATO DELANTE. //\n\nFUE EL CAMINO DE UN MÚSICO QUE APRENDIÓ A TRABAJAR. //\n\nTOCAR BIEN. / TOCAR TODAS LAS NOCHES. / SABER QUÉ NECESITA EL CANTANTE. / SABER CUÁNDO NO TOCAR. //\n\nEN LOS AÑOS CINCUENTA SE METIÓ EN LA ESCENA DEL WEST SIDE. / TOCÓ CON JOE LITTLE Y CON EL ARMONICISTA BILLY BOY ARNOLD. //\n\nTAMBIÉN ACOMPAÑÓ A JIMMY ROGERS EN GRABACIONES. / Y DURANTE LOS PRIMEROS AÑOS SESENTA TRABAJÓ COMO GUITARRISTA RÍTMICO DE OTIS RUSH. //\n\nESTO ES IMPORTANTE. //\n\nOTIS RUSH TENÍA UNA FORMA DE CANTAR Y TOCAR QUE PODÍA DOBLAR UNA CANCIÓN HASTA HACERLA PARECER QUE SE ROMPÍA. //\n\nPARA ACOMPAÑAR A ALGUIEN ASÍ, NO ALCANZA CON SABER LOS ACORDES. / HAY QUE ESCUCHAR LAS RESPIRACIONES. //\n\nYOUNG LO HACÍA. / SU GUITARRA NO PELEABA POR LA ATENCIÓN. / SOSTENÍA EL PISO PARA QUE LA MÚSICA PUDIERA ARRIESGAR. //\n\nPERO NO CONFUNDAMOS DISCRECIÓN CON FALTA DE PERSONALIDAD. //\n\nCUANDO LE TOCABA SALIR AL FRENTE, TENÍA UNA GUITARRA FILOSA Y UNA VOZ CON EL PESO DEL SOUL. //\n\nEN 1961 GRABÓ WHY BABY Y EMPTY ARMS PARA EL SELLO FIRE. //\n\nDESPUÉS VINIERON DISCOS CHICOS, SELLOS CHICOS Y MUCHO TRABAJO. / EN ESA ÉPOCA UN SINGLE PODÍA SER UNA GRAN OPORTUNIDAD Y, AL MISMO TIEMPO, DESAPARECER EN UNA SEMANA. //\n\nNO HABÍA UNA PANTALLA QUE TE MOSTRARA CUÁNTAS PERSONAS LO HABÍAN ESCUCHADO. / HABÍA QUE IR AL BAR Y TOCAR OTRA VEZ. //\n\nEN 1971 DELMARK PUBLICÓ BLUES WITH A TOUCH OF SOUL. //\n\nEL TÍTULO EXPLICA BASTANTE BIEN LO QUE HACÍA. / NO SE QUEDABA ENCERRADO EN UNA IDEA PURISTA DEL BLUES. //\n\nDEJABA ENTRAR AL SOUL, A LA MÚSICA BAILABLE, A LOS ARREGLOS MÁS MODERNOS. //\n\nDURANTE AÑOS FUE UNA PRESENCIA HABITUAL EN EL WISE FOOLS PUB. / UNO DE ESOS LUGARES DONDE UNA CARRERA SE MIDE POR LA CAPACIDAD DE VOLVER A LLENAR EL LUGAR. //\n\nEN LOS OCHENTA, CUANDO PREPARABA UN DISCO CON MAYOR CONTROL SOBRE SU PROPIO TRABAJO, NECESITÓ UNA OPERACIÓN EN EL CUELLO. / LAS COMPLICACIONES AFECTARON SU CAPACIDAD PARA TOCAR. //\n\nEL DISCO MIGHTY MAN TARDÓ AÑOS EN VER LA LUZ. / SE PUBLICÓ EN 1997. //\n\nYOUNG MURIÓ EN 1999. //\n\nCUANDO SE HABLA DEL BLUES DE CHICAGO, MUCHAS VECES RECORDAMOS A LOS QUE ESTÁN ADELANTE DEL MICRÓFONO. //\n\nPERO LA CIUDAD TAMBIÉN SE SOSTUVO SOBRE HOMBRES COMO MIGHTY JOE. //\n\nMÚSICA\n1. TURNING POINT\n2. WHY YOU WANT TO HURT ME\n3. THE LOVIN'EST WOMAN IN TOWN\n4. NEED MORE MAMMA\n\n\nCAPÍTULO 3 — CAREY BELL\nEL AIRE DE UNA ARMÓNICA\n\nUN CHICO QUIERE UN SAXOFÓN. / NO LO PUEDE TENER. //\n\nEN SU LUGAR, LE COMPRAN UNA ARMÓNICA. //\n\nPARECE UNA PEQUEÑA DECEPCIÓN. / PERO A VECES UNA VIDA ENTERA CAMBIA POR LO QUE NO PUDIMOS COMPRAR. //\n\nESE CHICO SE LLAMABA CAREY BELL HARRINGTON. //\n\nNACIÓ EN MACON, MISSISSIPPI, EN 1936. / LE GUSTABA LA MÚSICA DE LOUIS JORDAN Y SOÑABA CON ESE SONIDO GRANDE, BRILLANTE, DE LOS INSTRUMENTOS DE VIENTO. //\n\nPERO TERMINÓ CON UNA ARMÓNICA EN LAS MANOS. //\n\nAPRENDIÓ DE CHICO. / Y A LOS TRECE AÑOS YA TOCABA CON EL PIANISTA LOVIE LEE. //\n\nEN 1956 LLEGARON A CHICAGO. //\n\nPOCO DESPUÉS DE LLEGAR, CAREY FUE A ESCUCHAR A LITTLE WALTER. / SE CONOCIERON. / Y EL JOVEN EMPEZÓ A APRENDER DE CERCA. //\n\nTAMBIÉN CONOCIÓ A SONNY BOY WILLIAMSON II. //\n\nPERO HUBO OTRO HOMBRE QUE LO MARCÓ DE UNA MANERA ESPECIAL: BIG WALTER HORTON. //\n\nCAREY ADMIRABA EL TAMAÑO DE SU SONIDO. //\n\nNO HABLO DEL VOLUMEN. / HABLO DE ESA SENSACIÓN DE QUE UNA ARMÓNICA CHIQUITA PUEDE OCUPAR TODA UNA HABITACIÓN. //\n\nHORTON SE CONVIRTIÓ EN MAESTRO Y AMIGO. //\n\nPERO CHICAGO ESTABA CAMBIANDO. //\n\nLA GUITARRA ELÉCTRICA GANABA ESPACIO. / LOS TRABAJOS PARA ARMONICISTAS ERAN CADA VEZ MÁS DIFÍCILES. //\n\n¿QUÉ HIZO CAREY? //\n\nAPRENDIÓ A TOCAR EL BAJO. //\n\nNO ABANDONÓ LA MÚSICA PORQUE EL MUNDO HUBIERA CAMBIADO LAS REGLAS. / CAMBIÓ DE INSTRUMENTO PARA SEGUIR ADENTRO. //\n\nTRABAJÓ CON HONEYBOY EDWARDS, EARL HOOKER, EDDIE TAYLOR Y OTROS MÚSICOS. //\n\nA FINES DE LOS SESENTA VOLVIÓ A PONER LA ARMÓNICA EN EL CENTRO. //\n\nEN 1969 DELMARK PUBLICÓ CAREY BELL'S BLUES HARP. //\n\nDESPUÉS LLEGARON LOS TRABAJOS CON MUDDY WATERS Y CON LOS CHICAGO BLUES ALL-STARS DE WILLIE DIXON. //\n\nEN 1972 GRABÓ JUNTO A SU MAESTRO BIG WALTER HORTON UNO DE LOS PRIMEROS DISCOS DE ALLIGATOR. //\n\nME GUSTA DETENERME AHÍ. //\n\nEL CHICO QUE HABÍA LLEGADO A CHICAGO PARA ESCUCHAR A LOS MAESTROS AHORA ESTABA GRABANDO CON UNO DE ELLOS. //\n\nEN 1990 PARTICIPÓ EN HARP ATTACK!, JUNTO A OTROS GRANDES ARMONICISTAS. //\n\nEN LOS NOVENTA, DISCOS COMO DEEP DOWN Y GOOD LUCK MAN MOSTRARON QUE TODAVÍA TENÍA UNA VOZ PROPIA. //\n\nY MÁS TARDE GRABÓ JUNTO A SU HIJO, EL GUITARRISTA LURRIE BELL. //\n\nCAREY MURIÓ EN 2007. //\n\nY ME QUEDO CON AQUEL SAXOFÓN QUE NO PUDO TENER. //\n\nPORQUE EL INSTRUMENTO QUE LE TOCÓ TERMINÓ HACIENDO ALGO EXTRAORDINARIO: / LE DIO UNA VOZ QUE NADIE MÁS TENÍA. //\n\nMÚSICA\n1. SAD DREAMS\n2. I'M GONNA BUY ME A TRAIN TICKET\n3. HAVE MERCY\n4. GOOD LUCK MAN\n\n\nCAPÍTULO 4 — SON SEALS\nLA CIUDAD QUE NO SE RINDE\n\nANTES DE CONOCER UN ESCENARIO GRANDE, SON SEALS CONOCIÓ EL RUIDO DE UN BAR DESDE ADENTRO. //\n\nNO DESDE UNA MESA. / DESDE LA CASA. //\n\nPORQUE SU PADRE TENÍA UN LOCAL LLAMADO THE DIPSY DOODLE, EN OSCEOLA, ARKANSAS. //\n\nY EL CHICO CRECIÓ CON LA MÚSICA SONANDO A POCOS METROS DE SU CAMA. //\n\nFRANK SEALS NACIÓ EN 1942. //\n\nPOR EL CLUB DE SU PADRE PASABAN MÚSICOS DE BLUES. / NO ERAN LEYENDAS DE UN LIBRO. / ERAN PERSONAS QUE ENTRABAN, ARMABAN LOS INSTRUMENTOS Y TOCABAN. //\n\nSU PADRE, JIM SEALS, TAMBIÉN ERA MÚSICO. / LE ENSEÑÓ A TOCAR. //\n\nA LOS TRECE AÑOS YA ERA UN BATERISTA CAPAZ. //\n\nY ESTO CAMBIA LA MANERA DE ESCUCHAR SU GUITARRA. //\n\nPORQUE SON NO TOCABA SOLAMENTE CON LOS DEDOS. / TOCABA CON UNA IDEA MUY FÍSICA DEL RITMO. //\n\nA LOS DIECIOCHO YA DIRIGÍA SU PROPIA BANDA COMO GUITARRISTA. //\n\nDESPUÉS SALIÓ A LA RUTA. / TRABAJÓ CON EARL HOOKER Y TOCÓ LA BATERÍA PARA ALBERT KING. //\n\nEN 1971 SE MUDÓ A CHICAGO. //\n\nSON EMPEZÓ A TOCAR EN EL SOUTH SIDE. //\n\nCUANDO HOUND DOG TAYLOR SALIÓ DE GIRA, SON OCUPÓ ALGUNAS DE SUS NOCHES HABITUALES EN EL EXPRESSWAY LOUNGE. //\n\nAHÍ FUE GANANDO NOMBRE. //\n\nY APARECIÓ BRUCE IGLAUER, EL HOMBRE DE ALLIGATOR RECORDS. //\n\nEL SELLO ERA JOVEN. / NO TENÍA UNA FÁBRICA DE ESTRELLAS. / TENÍA UNA IDEA: / GRABAR EL BLUES QUE ESTABA VIVO EN LOS CLUBES. //\n\nEN 1973 SALIÓ THE SON SEALS BLUES BAND. //\n\nSON NO QUERÍA SONAR COMO UNA COPIA RESPETUOSA DE SUS MAYORES. //\n\nESCRIBÍA SUS TEMAS. / CANTABA CON UNA VOZ RASPOSA. / Y SU GUITARRA TENÍA UN ATAQUE QUE PARECÍA CORTAR EL AIRE. //\n\nSU MÚSICA TENÍA ALGO DE DISCUSIÓN. //\n\nCOMO SI CADA CANCIÓN ESTUVIERA PELEANDO POR UN LUGAR. //\n\nCON MIDNIGHT SON, A MEDIADOS DE LOS SETENTA, LLEGÓ UN RECONOCIMIENTO MÁS GRANDE. //\n\nDESPUÉS VINIERON DISCOS, GIRAS POR ESTADOS UNIDOS Y EUROPA, FESTIVALES Y ESCENARIOS COMPARTIDOS CON FIGURAS IMPORTANTES. //\n\nPERO SU SONIDO NO SE VOLVIÓ MÁS EDUCADO PARA ENTRAR EN ESOS LUGARES. //\n\nSEGUÍA TENIENDO FILO. //\n\nHAY UNA CANCIÓN QUE TAMBIÉN CRUZÓ FRONTERAS: FUNKY BITCH. //\n\nLA BANDA PHISH LA INCORPORÓ A SU REPERTORIO Y LLEGÓ A INVITAR A SON A TOCAR CON ELLOS. //\n\nSON SEALS MURIÓ EN 2004. //\n\nDEJÓ DISCOS Y UNA REPUTACIÓN DE MÚSICO INCENDIARIO. //\n\nPERO PARA ENTENDERLO, YO VUELVO A AQUEL CHICO DEL DIPSY DOODLE. //\n\nAL PADRE QUE LE PEDÍA QUEDARSE EN UN ACORDE. //\n\nAL SONIDO DE LOS MÚSICOS QUE ENTRABAN A TOCAR CASI AL LADO DE SU CAMA. //\n\nTODA ESA VIDA ESTABA EN CADA NOTA. //\n\nCHICAGO NO INVENTÓ A SON SEALS. / PERO LE DIO UN LUGAR DONDE SU GUITARRA PUDO HACERSE ESCUCHAR. //\n\nY DESDE AHÍ, / EL FUEGO VIAJÓ MUCHO MÁS LEJOS. //\n\nMÚSICA\n1. YOUR LOVE IS LIKE A CANCER\n2. TELEPHONE ANGEL\n3. FUNKY BITCH\n4. GOING BACK HOME\n\n\nCIERRE\n\nCUATRO HISTORIAS. / CUATRO MANERAS DE RESISTIR. //\n\nKOKO TAYLOR TUVO QUE ABRIRSE PASO CON LA VOZ. //\n\nMIGHTY JOE YOUNG SOSTUVO A OTROS ANTES DE OCUPAR SU PROPIO LUGAR. //\n\nCAREY BELL CAMBIÓ DE INSTRUMENTO PARA NO QUEDARSE AFUERA DE LA MÚSICA. //\n\nSON SEALS CONVIRTIÓ LO QUE HABÍA APRENDIDO DE CHICO EN UNA GUITARRA IMPOSIBLE DE IGNORAR. //\n\nY EN MEDIO DE TODO, / CHICAGO. //\n\nNO COMO UNA CIUDAD PERFECTA. / COMO UN LUGAR DONDE LA MÚSICA SEGUÍA TRABAJANDO AUNQUE LAS COSAS SE PUSIERAN DIFÍCILES. //\n\nSOY SEBASTIÁN SOPELANA. / GRACIAS POR ESTAR DEL OTRO LADO DE RUIDOS MOLESTOS. //\n\nLA HISTORIA LLEGÓ A SU FIN, EL BLUES POR SUERTE, NO. //"; let size=32;
 function show(){login.hidden=true;page.hidden=false;render()}
 function render(){const raw=localStorage.getItem('rm_lectura')||DEFAULT_PROGRAM; text.innerHTML=''; raw.split('\\n').forEach(function(line){const d=document.createElement('div');d.textContent=line||' ';d.className='line';if(/^PROGRAMA \\d+/i.test(line))d.className+=' program-title';else if(/^CAPÍTULO \\d+/i.test(line))d.className+=' chapter-title';else if(/^(PRESENTACIÓN|CIERRE|MÚSICA|LA MÚSICA DEL CAPÍTULO)/i.test(line))d.className+=' section-title';else if(/^POR QUÉ:/i.test(line))d.className+=' music-note';text.appendChild(d)})}
 function enter(){if(pass.value==='0253'){sessionStorage.setItem('rm_pass','ok');show()}else{error.textContent='Código incorrecto';pass.value='';pass.focus()}}
 document.getElementById('enter').onclick=enter;
 pass.addEventListener('keydown',function(e){if(e.key==='Enter')enter()});
 if(sessionStorage.getItem('rm_pass')==='ok')show();
 editBtn.onclick=function(){editor.value=localStorage.getItem('rm_lectura')||DEFAULT_PROGRAM;text.hidden=true;editor.hidden=false;editBtn.hidden=true;saveBtn.hidden=false;editor.focus()};
 saveBtn.onclick=function(){localStorage.setItem('rm_lectura',editor.value);editor.hidden=true;text.hidden=false;saveBtn.hidden=true;editBtn.hidden=false;render()};
 document.getElementById('plus').onclick=function(){size=Math.min(48,size+2);text.style.fontSize=size+'px'};
 document.getElementById('minus').onclick=function(){size=Math.max(18,size-2);text.style.fontSize=size+'px'};
 document.getElementById('exitBtn').onclick=function(){sessionStorage.removeItem('rm_pass');location.reload()};
})();
