 const login=document.getElementById('login'),page=document.getElementById('page'),pass=document.getElementById('pass'),error=document.getElementById('error'),text=document.getElementById('text'),editor=document.getElementById('editor'),editBtn=document.getElementById('editBtn'),saveBtn=document.getElementById('saveBtn');
 const DEFAULT_PROGRAM="PROGRAMA 41 — CHICAGO NO SE RINDE\n\nPRESENTACIÓN\n\nBUENAS NOCHES. //\n\nHAY CIUDADES QUE UNO PUEDE CONTAR MIRANDO UN MAPA. / Y HAY OTRAS QUE HAY QUE ESCUCHAR. //\n\nCHICAGO ES UNA DE ESAS. //\n\nPORQUE DURANTE DÉCADAS, MIENTRAS ARRIBA PASABAN LOS TRENES, LAS FÁBRICAS CAMBIABAN DE TURNO Y EL FRÍO SE METÍA ENTRE LOS EDIFICIOS, / ABAJO HABÍA OTRA CIUDAD. //\n\nUNA CIUDAD DE CLUBES CHICOS. / DE ESCENARIOS APRETADOS. / DE AMPLIFICADORES QUE TENÍAN QUE SONAR MÁS FUERTE QUE LAS CONVERSACIONES, LOS VASOS Y EL RUIDO DE LA CALLE. //\n\nAHÍ EL BLUES DEJÓ DE SER SOLAMENTE EL RECUERDO DEL SUR. / SE VOLVIÓ URBANO. / ELÉCTRICO. / ÁSPERO. / Y, SOBRE TODO, NECESARIO. //\n\nMUCHA DE LA GENTE QUE LLEGÓ A CHICAGO NO VENÍA BUSCANDO HACER HISTORIA. / VENÍA BUSCANDO TRABAJO. / UNA CASA. / UNA OPORTUNIDAD. / ALGO DISTINTO DE LO QUE HABÍA DEJADO ATRÁS. //\n\nY CON ELLOS VIAJÓ LA MÚSICA. //\n\nVIAJARON LAS CANCIONES. / LAS FORMAS DE CANTAR. / LOS RITMOS. / LAS GUITARRAS. / LAS ARMÓNICAS. / ESA MANERA DE CONTAR UNA VIDA SIN NECESIDAD DE EXPLICARLA DEMASIADO. //\n\nPERO LA CIUDAD OBLIGÓ A ESA MÚSICA A CAMBIAR. //\n\nEN UN BAR LLENO NO ALCANZABA CON TOCAR. / HABÍA QUE HACERSE ESCUCHAR. //\n\nY EL BLUES SE ENCHUFÓ. //\n\nSUBIÓ EL VOLUMEN. / ENDURECIÓ EL PULSO. / ENCONTRÓ OTRA FORMA DE RESPIRAR. //\n\nLO EXTRAORDINARIO ES QUE NO OCURRIÓ UNA SOLA VEZ. //\n\nCUANDO PARECÍA QUE EL BLUES PODÍA QUEDAR ATRÁS, / APARECÍA OTRA GENERACIÓN. //\n\nOTRA VOZ. / OTRA GUITARRA. / OTRA ARMÓNICA. / OTRO CLUB DONDE TODAVÍA HABÍA ALGUIEN DISPUESTO A TOCAR COMO SI ESA NOCHE FUERA LA ÚLTIMA. //\n\nPOR ESO EL PROGRAMA DE HOY NO ES UN HOMENAJE A UNA ÉPOCA. //\n\nTAMPOCO ES UNA VISITA A UN MUSEO. //\n\nES LA HISTORIA DE UNA MÚSICA QUE SOBREVIVIÓ PORQUE HUBO GENTE QUE SE NEGÓ A DEJARLA QUIETA. //\n\nGENTE QUE NO NECESITÓ ESTAR EN LA FOTO MÁS FAMOSA. / NI VENDER MILLONES DE DISCOS. / NI CONVERTIRSE EN UN NOMBRE CONOCIDO POR TODO EL MUNDO. //\n\nALCANZÓ CON QUE, CUANDO LLEGARA LA NOCHE, / HUBIERA UN ESCENARIO. / UN INSTRUMENTO. / Y ALGUIEN DEL OTRO LADO DISPUESTO A ESCUCHAR. //\n\nESTA NOCHE VAMOS A QUEDARNOS AHÍ. //\n\nEN ESE CHICAGO QUE NO ERA ELEGANTE. / QUE NO ERA FÁCIL. / QUE MUCHAS VECES NI SIQUIERA ERA JUSTO. //\n\nPERO QUE TENÍA ALGO DIFÍCIL DE APAGAR. //\n\nUNA MÚSICA QUE PODÍA CAMBIAR DE MANOS, DE BARRIO Y DE GENERACIÓN, / PERO SEGUÍA TENIENDO LA MISMA NECESIDAD DE DECIR ALGO. //\n\nPOR ESO ESTE PROGRAMA SE LLAMA... //\n\nCHICAGO NO SE RINDE. //\n\nESTO ES RUIDOS MOLESTOS. / UN INSOPORTABLE PROGRAMA DE ROCK. //\n\nSOY SEBASTIÁN SOPELANA. //\n\n\nCAPÍTULO 1 — KOKO TAYLOR
LA VOZ QUE HIZO TEMBLAR CHICAGO

IMAGINATE UN CLUB EN CHICAGO. / EL ESCENARIO ES CHICO, EL AIRE ESTÁ PESADO Y NADIE ESPERA UNA VOZ EDUCADA. // 

ENTONCES SUBE UNA MUJER. / ABRE LA BOCA. / Y LO QUE SALE NO PARECE HABER NACIDO EN UNA ESCUELA DE CANTO. //

PARECE HABER SALIDO DE UNA VIDA ENTERA. //

ESA MUJER ES **KOKO TAYLOR**. //

PERO ANTES DE CHICAGO HUBO UNA NIÑA LLAMADA CORA WALTON. / NACIÓ EN 1928, EN TENNESSEE, EN UNA FAMILIA DE TRABAJADORES AGRÍCOLAS. / SU CASA NO TENÍA NADA DE LO QUE UNO ASOCIA CON UNA FUTURA ESTRELLA. / EL TRABAJO MARCABA EL DÍA Y LA MÚSICA TENÍA QUE ENCONTRAR SU LUGAR ENTRE LAS OBLIGACIONES. //

CUANDO TODAVÍA ERA CHICA, PERDIÓ A SUS PADRES. / Y EL BLUES, QUE EN MUCHAS BIOGRAFÍAS PARECE UNA ELECCIÓN ESTÉTICA, PARA ELLA ERA ALGO MUCHO MÁS CERCANO. / NO HACÍA FALTA QUE NADIE LE EXPLICARA QUÉ ERA EXTRAÑAR. //

SU PADRE PREFERÍA QUE EN CASA SE CANTARA GÓSPEL. / PERO CORA Y SUS HERMANOS SE ESCAPABAN DETRÁS DE LA CASA PARA TOCAR BLUES CON INSTRUMENTOS IMPROVISADOS. / ESCUCHABAN LA RADIO, BUSCABAN ESAS VOCES QUE VENÍAN DE MEMPHIS, Y ENTRE ELLAS LA DE **B. B. KING**. //

AHÍ HAY ALGO QUE ME INTERESA. / EL BLUES NO ENTRÓ EN LA VIDA DE KOKO POR UNA PUERTA OFICIAL. / ENTRÓ POR EL COSTADO. / COMO ENTRAN LAS COSAS QUE UNO NECESITA AUNQUE LE DIGAN QUE NO. //

EL APODO KOKO VENÍA DE SU GUSTO POR EL CHOCOLATE. / UN NOMBRE CASI INFANTIL PARA UNA VOZ QUE DESPUÉS IBA A SONAR COMO UN TREN CARGADO. //

EN 1952 SE MUDÓ CON SU MARIDO, ROBERT TAYLOR, A CHICAGO. / NO LLEGARON CON UN CONTRATO DISCOGRÁFICO. / LLEGARON COMO TANTAS FAMILIAS DEL SUR, BUSCANDO UNA VIDA MEJOR. / ELLA TRABAJÓ LIMPIANDO CASAS. / LA MÚSICA, AL PRINCIPIO, QUEDABA PARA DESPUÉS DEL TRABAJO. //

PERO CHICAGO TENÍA UNA PARTICULARIDAD. / EL BLUES NO ESTABA ESCONDIDO EN LOS RECUERDOS: ESTABA VIVO EN LOS BARES. / MUDDY WATERS, HOWLIN' WOLF, LITTLE WALTER, WILLIE DIXON... / NO ERAN SOLAMENTE NOMBRES DE DISCOS. / ERAN PARTE DEL PAISAJE MUSICAL DE UNA CIUDAD QUE HABÍA APRENDIDO A AMPLIFICAR EL SUR. //

KOKO EMPEZÓ A CANTAR EN CLUBES. / Y SU VOZ TENÍA UN PROBLEMA MARAVILLOSO: NO SE PARECÍA A LO QUE SE ESPERABA DE UNA CANTANTE. / ERA RONCA, PODEROSA, IMPACIENTE. / TENÍA ALGO DE ORDEN Y ALGO DE DESAFÍO. //

EN UNO DE ESOS ENCUENTROS APARECIÓ **WILLIE DIXON**. / BAJISTA, COMPOSITOR, PRODUCTOR, UN HOMBRE QUE HABÍA AYUDADO A DAR FORMA AL SONIDO DE CHESS RECORDS. / DIXON ENTENDIÓ QUE AQUELLA MUJER PODÍA CANTAR MATERIAL QUE, EN OTRA VOZ, HABRÍA QUEDADO COMO UNA SIMPLE CANCIÓN DE FIESTA. //

Y AHÍ LLEGÓ WANG DANG DOODLE. //

NO ERA UNA COMPOSICIÓN NUEVA: DIXON LA HABÍA ESCRITO Y HOWLIN' WOLF YA LA HABÍA GRABADO. / PERO EN LA VERSIÓN DE KOKO, EDITADA EN 1965, LA CANCIÓN CAMBIÓ DE DUEÑO ANTE LOS OÍDOS DEL PÚBLICO. / AQUEL DESFILE DE PERSONAJES Y ESA FIESTA DESCONTROLADA ENCONTRARON UNA VOZ QUE NO PARECÍA INVITADA. //

**PARECÍA LA DUEÑA DE LA FIESTA.** //

EL DISCO FUE UN ÉXITO IMPORTANTE Y LA SACÓ DEL CIRCUITO EN EL QUE LA CONOCÍAN SOLAMENTE LOS HABITUALES DE LOS CLUBES. / PERO NO CONFUNDAMOS ÉXITO CON FACILIDAD. / PARA UNA MUJER NEGRA, CANTANDO BLUES EN UNA INDUSTRIA DOMINADA POR HOMBRES, CADA NUEVA OPORTUNIDAD HABÍA QUE PELEARLA. //

LA LLAMARON LA REINA DEL BLUES. / EL TÍTULO QUEDA LINDO EN UN AFICHE, PERO DETRÁS HABÍA HORAS DE RUTA, ESCENARIOS MAL PAGADOS, NOCHES LARGAS Y UNA DISCIPLINA FEROZ. / KOKO NO CANTABA COMO SI ESTUVIERA REPRESENTANDO UN PAPEL. / CANTABA COMO SI TUVIERA QUE GANARSE EL DERECHO A SER ESCUCHADA CADA VEZ. //

EN 1975 COMENZÓ UNA RELACIÓN DECISIVA CON ALLIGATOR RECORDS. / EL SELLO DE BRUCE IGLAUER HABÍA NACIDO PARA GRABAR UN BLUES QUE LAS GRANDES COMPAÑÍAS NO ESTABAN MIRANDO. / AHÍ KOKO ENCONTRÓ UN LUGAR DONDE SU MÚSICA NO NECESITABA DISFRAZARSE DE MODA PASAJERA. //

LLEGARON DISCOS, GIRAS, FESTIVALES Y RECONOCIMIENTOS. / EN 1985 GANÓ UN GRAMMY POR SU PARTICIPACIÓN EN BLUES EXPLOSION. / PERO A MÍ ME IMPORTA OTRA COSA: CADA PREMIO LLEGABA DESPUÉS DE UNA CANTIDAD DE NOCHES QUE NADIE HABÍA CONTADO. //

TAMBIÉN HUBO GOLPES FUERA DEL ESCENARIO. / EN 1988 UN ACCIDENTE AUTOMOVILÍSTICO LE COSTÓ LA VIDA A SU MARIDO ROBERT Y LA DEJÓ GRAVEMENTE HERIDA. / PARA CUALQUIERA HABRÍA SIDO UNA RUPTURA DEFINITIVA. / PARA ELLA FUE UNA HERIDA CON LA QUE TUVO QUE APRENDER A SEGUIR. //

NO ME INTERESA CONVERTIR ESE DOLOR EN UNA FRASE MOTIVACIONAL. / LO QUE IMPORTA ES QUE REGRESÓ. / Y CUANDO VOLVIÓ A CANTAR, ESA VOZ YA TENÍA OTRA HISTORIA ADENTRO. //

EN 2003 TUVO QUE ATRAVESAR UNA OPERACIÓN COMPLICADA. / OTRA VEZ SU SALUD PUSO EN DUDA LOS ESCENARIOS. / Y OTRA VEZ VOLVIÓ. / NO PORQUE EL CUERPO NO LE PASARA FACTURA, SINO PORQUE EL ESCENARIO SEGUÍA SIENDO SU LUGAR. //

MURIÓ EN 2009. / PERO ESCUCHARLA HOY SIGUE SIENDO UNA EXPERIENCIA FÍSICA. / UNO NO ESCUCHA A KOKO PARA DESCUBRIR CUÁNTAS NOTAS PODÍA ALCANZAR. / LA ESCUCHA PARA ENTENDER CUÁNTO PODÍA DECIR CON UNA SOLA. //

**KOKO TAYLOR NO LE PIDIÓ PERMISO AL BLUES. / LO HIZO SONAR A SU MANERA.** //\n\nCAPÍTULO 2 — MIGHTY JOE YOUNG
LA GUITARRA DETRÁS DEL FUEGO

HAY GUITARRISTAS QUE PARECEN TOCAR PARA QUE TODOS LOS MIREN. / Y HAY OTROS QUE CONSIGUEN ALGO MÁS DIFÍCIL: QUE TODA LA BANDA SUENE MEJOR PORQUE ELLOS ESTÁN AHÍ. //

**MIGHTY JOE YOUNG** PERTENECÍA A LOS SEGUNDOS. //

NACIÓ EN SHREVEPORT, LOUISIANA, EN 1927, Y CRECIÓ EN MILWAUKEE. / ANTES DE QUE CHICAGO LO RECLAMARA, YA HABÍA ENTENDIDO QUE EL BLUES NO ERA UN SOLO SONIDO. / ESTABA LA TRADICIÓN DEL SUR, PERO TAMBIÉN EL RITMO URBANO, EL SOUL, LAS BANDAS QUE NECESITABAN HACER BAILAR A LA GENTE. //

A MEDIADOS DE LOS AÑOS 50 EMPEZÓ A GANARSE UN NOMBRE EN EL WEST SIDE DE CHICAGO, TOCANDO CON JOE LITTLE AND HIS HEART BREAKERS. / AHÍ LA GUITARRA NO ERA UN ADORNO: TENÍA QUE SOSTENER UN CONJUNTO. / EL PÚBLICO PODÍA NO SABER QUIÉN ESTABA TOCANDO CADA FRASE, PERO NOTABA INMEDIATAMENTE SI FALTABA. //

DESPUÉS LLEGARON LOS TRABAJOS CON **BILLY BOY ARNOLD** Y **JIMMY ROGERS**. / EN 1958 ACOMPAÑÓ A ROGERS EN GRABACIONES PARA CHESS. / Y ENTRE 1960 Y 1963 FUE GUITARRISTA RÍTMICO DE **OTIS RUSH**. //

DETENGÁMONOS AHÍ. / OTIS RUSH ERA UNA FUERZA DE LA NATURALEZA, UN GUITARRISTA CAPAZ DE TORCER UNA NOTA HASTA HACERLA LLORAR. / PARA TOCAR A SU LADO NO ALCANZABA CON SABER HACER SOLOS. / HABÍA QUE ENTENDER CUÁNDO NO TOCARLOS. //

YOUNG TENÍA ESA INTELIGENCIA. / SABÍA ARMAR EL PISO SOBRE EL QUE OTRO PODÍA ARRIESGARSE. / POR ESO SU HISTORIA NO SE PUEDE CONTAR SOLAMENTE MIRANDO LOS DISCOS QUE LLEVAN SU NOMBRE. //

TAMBIÉN INTENTÓ GRABAR POR SU CUENTA. / HUBO SINGLES PARA SELLOS PEQUEÑOS EN LOS AÑOS 50, Y EN 1961 GRABÓ WHY BABY Y EMPTY ARMS PARA FIRE RECORDS. / NO SE CONVIRTIÓ EN UNA ESTRELLA DE UN DÍA PARA EL OTRO. / SIGUIÓ TRABAJANDO, HACIENDO SESIONES, TOCANDO DONDE HABÍA QUE TOCAR. //

EN LOS AÑOS 60 DEJÓ GRABACIONES PARA WEB­COR, CELTEX, USA Y JACKLYN. / LOS NOMBRES DE ESOS SELLOS NO SUENAN COMO LOS GRANDES IMPERIOS DEL DISCO. / Y SIN EMBARGO AHÍ ESTÁ UNA PARTE ESENCIAL DE LA HISTORIA DEL BLUES: MÚSICOS QUE SEGUÍAN GRABANDO AUNQUE LA INDUSTRIA NO SUPIERA QUÉ HACER CON ELLOS. //

EN 1966 APARECIÓ EN EL PROGRAMA DE TELEVISIÓN THE BEAT, CONDUCIDO POR BILL HOSS ALLEN. / UN TESTIMONIO DE UNA ÉPOCA EN LA QUE EL BLUES INTENTABA ENCONTRAR NUEVOS OÍDOS SIN PERDER SU IDENTIDAD. //

EL PRIMER ÁLBUM A SU NOMBRE, BLUES WITH A TOUCH OF SOUL, LLEGÓ RECIÉN EN 1971 CON DELMARK. / FIJATE LO QUE SIGNIFICA: DESPUÉS DE CASI DOS DÉCADAS DE TRABAJO, TODAVÍA ESTABA CONSTRUYENDO SU PROPIA CARRERA. //

Y EL TÍTULO DEL DISCO NO ERA CASUAL. / BLUES CON UN TOQUE DE SOUL. / ESO ERA JOE: UN MÚSICO QUE NO LE TENÍA MIEDO A MEZCLAR. //

DESPUÉS VINIERON CHICKEN HEADS, EN 1974, Y OTRO ÁLBUM EN 1976. / SU GUITARRA PODÍA SER FILOSA, PERO TAMBIÉN TENÍA UN PULSO CASI BAILABLE. / NO ESTABA INTERESADO EN CONGELAR EL BLUES EN UNA VITRINA. //

EN CHICAGO SE VOLVIÓ UNA FIGURA CENTRAL DEL WISE FOOLS PUB. / IMAGINATE LO QUE SIGNIFICA TOCAR NOCHE TRAS NOCHE EN UN LUGAR DONDE EL PÚBLICO ESTÁ A POCOS METROS. / NO PODÉS ESCONDERTE DETRÁS DE LA PRODUCCIÓN. / TENÉS QUE SOSTENER LA ATENCIÓN CON LAS MANOS, LA VOZ Y LA BANDA. //

EN EL BAJO SOLÍA ESTAR **BENNY TURNER**, HERMANO DE FREDDIE KING. / ERA UNA MÚSICA HECHA DE CONVERSACIONES ENTRE INSTRUMENTOS, NO DE COMPETENCIAS. //

A MEDIADOS DE LOS AÑOS 80 JOE QUISO DARSE ALGO QUE MUCHAS VECES LE HABÍA FALTADO: CONTROL SOBRE SU PROPIO DISCO. / EN 1986 EMPEZÓ A FINANCIAR UNA GRABACIÓN POR SU CUENTA. / PERO EN ESE MISMO PERÍODO TUVO QUE OPERARSE POR UN NERVIO COMPRIMIDO EN EL CUELLO. //

LAS COMPLICACIONES DE LA OPERACIÓN AFECTARON SU CAPACIDAD PARA TOCAR LA GUITARRA. //

PENSÁ EN ESO. / UN HOMBRE QUE HABÍA PASADO SU VIDA ENTERA HABLANDO CON LAS MANOS, DE PRONTO NO PODÍA CONFIAR EN ELLAS COMO ANTES. //

EL DISCO SE LLAMÓ MIGHTY MAN Y TERMINÓ SALIENDO EN 1997, DESPUÉS DE AÑOS DE TRABAJO INTERMITENTE. / NO FUE EL FINAL TRIUNFAL QUE HABRÍA ESCRITO UN GUION DE CINE. / FUE ALGO MÁS HUMANO: UN MÚSICO TRATANDO DE TERMINAR LO QUE HABÍA EMPEZADO. //

MURIÓ EN CHICAGO EN 1999. //

CUANDO ESCUCHAMOS A MIGHTY JOE YOUNG, CONVIENE RECORDAR QUE UNA PARTE DE SU GRANDEZA ESTÁ EN LOS DISCOS DE OTROS. / EN ESAS GUITARRAS QUE UNO TARAREA SIN SABER QUIÉN LAS TOCÓ. //

**A VECES EL MÚSICO MÁS IMPORTANTE DEL ESCENARIO ES EL QUE NO NECESITA PARARSE ADELANTE.** //\n\nCAPÍTULO 3 — CAREY BELL
EL AIRE DE UNA ARMÓNICA

EL CHICO QUERÍA UN SAXOFÓN. //

PERO EN LA CASA NO HABÍA PLATA PARA COMPRARLE UNO. / SU ABUELO LE DIO UNA ARMÓNICA. / Y SIN SABERLO LE CAMBIÓ LA VIDA. //

ESE CHICO ERA **CAREY BELL HARRINGTON**. / HABÍA NACIDO EN MACON, MISSISSIPPI, EN 1936. / LE GUSTABA LA MÚSICA DE LOUIS JORDAN, ESE SONIDO QUE PODÍA HACER BAILAR Y CONTAR UNA HISTORIA AL MISMO TIEMPO. / SOÑABA CON EL SAXOFÓN PORQUE QUERÍA ESE TIPO DE VOZ. //

PERO LA ARMÓNICA TERMINÓ ENSEÑÁNDOLE OTRA COSA: A RESPIRAR LA MÚSICA. //

A LOS 8 AÑOS YA PODÍA TOCARLA. / A LOS 13 ESTABA ACTUANDO CON EL PIANISTA **LOVIE LEE**, SU PADRASTRO Y MENTOR MUSICAL. / NO APRENDIÓ EN UNA ACADEMIA. / APRENDIÓ EN EL MISMO LUGAR DONDE APRENDÍAN LOS MÚSICOS QUE DESPUÉS IBAN A FORMAR LA HISTORIA DEL BLUES: TOCANDO. //

EN 1956 LLEGÓ A CHICAGO CON LEE. / PARA UN JOVEN ARMÓNICISTA AQUELLA CIUDAD ERA COMO LLEGAR A UNA UNIVERSIDAD DONDE LOS PROFESORES ESTABAN TOCANDO EN LOS BARES. //

CASI ENSEGUIDA FUE A ESCUCHAR A **LITTLE WALTER** EN EL CLUB ZANZIBAR. / IMAGINATE EL MOMENTO: UN MUCHACHO DEL MISSISSIPPI, CON UNA ARMÓNICA EN EL BOLSILLO, FRENTE A UNO DE LOS HOMBRES QUE HABÍAN CAMBIADO LA FORMA DE TOCAR ESE INSTRUMENTO. //

LITTLE WALTER LE MOSTRÓ RECURSOS. / TAMBIÉN CONOCIÓ A SONNY BOY WILLIAMSON II. / PERO QUIEN LO MARCÓ DE UNA MANERA ESPECIAL FUE **BIG WALTER HORTON**. //

HORTON TENÍA UN SONIDO ENORME. / NO NECESITABA LLENAR CADA ESPACIO CON NOTAS. / PODÍA HACER QUE UNA FRASE PARECIERA UNA RESPIRACIÓN PROFUNDA. / CAREY LO ESCUCHÓ Y ENTENDIÓ QUE EL INSTRUMENTO TENÍA MUCHAS MÁS POSIBILIDADES DE LAS QUE HABÍA IMAGINADO. //

SE HICIERON AMIGOS. / HORTON SE CONVIRTIÓ EN SU MAESTRO. / Y ESA RELACIÓN ES UNA DE LAS COSAS MÁS LINDAS DE ESTA HISTORIA: NO HABLAMOS DE UN MÚSICO COPIANDO DISCOS VIEJOS. / HABLAMOS DE UN MÚSICO APRENDIENDO AL LADO DE LOS HOMBRES QUE ESTABAN INVENTANDO ESE LENGUAJE. //

PERO CHICAGO CAMBIABA RÁPIDO. / A FINES DE LOS 50 Y COMIENZOS DE LOS 60, LA GUITARRA ELÉCTRICA GANABA CADA VEZ MÁS ESPACIO. / EL TRABAJO PARA LOS ARMÓNICISTAS SE VOLVÍA DIFÍCIL. //

Y CAREY TOMÓ UNA DECISIÓN QUE PODRÍA PARECER UNA RENUNCIA. / APRENDIÓ A TOCAR EL BAJO. //

NO LO HIZO PORQUE HUBIERA DEJADO DE AMAR LA ARMÓNICA. / LO HIZO PORQUE QUERÍA SEGUIR SIENDO MÚSICO. //

TOCÓ EL BAJO CON HONEYBOY EDWARDS, JOHNNY YOUNG, EDDIE TAYLOR, EARL HOOKER Y EL PROPIO BIG WALTER. / IMAGINATE LO QUE ERA: MIENTRAS SOSTENÍA EL RITMO DESDE ATRÁS, ESCUCHABA A SU MAESTRO A POCOS METROS. / CADA NOCHE ERA UNA CLASE QUE NO FIGURABA EN NINGÚN PROGRAMA DE ESTUDIOS. //

Y EN ESE OFICIO APRENDIÓ ALGO QUE DESPUÉS SE ESCUCHARÍA EN SUS SOLOS: A DEJAR ESPACIO. / A NO PELEARSE CON LA CANCIÓN. //

EN 1968 GRABÓ ARMÓNICA JUNTO A EARL HOOKER PARA ARHOOLIE. / EN 1969, CON AYUDA DE CHARLIE MUSSELWHITE, LLEGÓ A DELMARK Y GRABÓ CAREY BELL'S BLUES HARP. //

EL TÍTULO ERA CASI UNA PRESENTACIÓN FORMAL: AHORA SÍ, AQUEL CHICO QUE HABÍA QUERIDO UN SAXOFÓN TENÍA UN DISCO CON SU NOMBRE Y SU ARMÓNICA ADELANTE. //

DESPUÉS TOCÓ Y GRABÓ CON **MUDDY WATERS**. / APARECIÓ EN SESIONES DE LOS AÑOS 70 Y TAMBIÉN TRABAJÓ EN LOS CHICAGO BLUES ALL-STARS DE **WILLIE DIXON**. / NO ERAN PARTICIPACIONES DECORATIVAS. / ERAN TRABAJOS QUE EXIGÍAN ESTAR A LA ALTURA DE UNA MÚSICA EN LA QUE CADA UNO TENÍA QUE ESCUCHAR AL OTRO. //

EN 1972 GRABÓ JUNTO A BIG WALTER HORTON UN DISCO QUE FUE APENAS EL SEGUNDO LANZAMIENTO DE ALLIGATOR RECORDS. / MAESTRO Y DISCÍPULO, UNO AL LADO DEL OTRO. / SI HUBIERA QUE ELEGIR UNA IMAGEN PARA EXPLICAR CÓMO SE TRANSMITE EL BLUES, PODRÍA SER ESA. //

EN 1990 FORMÓ PARTE DE HARP ATTACK, JUNTO A JUNIOR WELLS, JAMES COTTON Y BILLY BRANCH. / CUATRO ARMÓNICAS, CUATRO PERSONALIDADES. / NO ERA UNA COMPETENCIA PARA VER QUIÉN TOCABA MÁS RÁPIDO. / ERA UNA DEMOSTRACIÓN DE QUE UN MISMO INSTRUMENTO PUEDE HABLAR CON ACENTOS COMPLETAMENTE DISTINTOS. //

EN 1995 LLEGÓ DEEP DOWN. / EN 1997, GOOD LUCK MAN. / Y EN 2004 GRABÓ SECOND NATURE JUNTO A SU HIJO, EL GUITARRISTA **LURRIE BELL**. //

AHÍ HAY UN CÍRCULO HERMOSO. / CAREY HABÍA APRENDIDO DE LOS GRANDES ESCUCHÁNDOLOS DE CERCA. / DÉCADAS DESPUÉS ESTABA TOCANDO CON SU PROPIO HIJO. / LA MÚSICA PASABA DE UNA GENERACIÓN A OTRA SIN NECESIDAD DE UN DISCURSO. //

MURIÓ EN 2007. //

LA ARMÓNICA QUE LE HABÍAN COMPRADO PORQUE NO ALCANZABA PARA UN SAXOFÓN TERMINÓ LLEVÁNDOLO POR EL MUNDO. //

**A VECES EL INSTRUMENTO QUE NO ELEGISTE ES EL QUE TERMINA ENCONTRANDO TU VOZ.** //\n\nCAPÍTULO 4 — SON SEALS
LA CIUDAD QUE NO SE RINDE

ANTES DE CONOCER LOS ESCENARIOS DE CHICAGO, **SON SEALS** YA HABÍA ESCUCHADO A ALGUNOS DE LOS GRANDES MÚSICOS DEL BLUES DESDE LA HABITACIÓN DONDE DORMÍA. //

NO ES UNA METÁFORA. //

SU PADRE, JIM SEALS, TENÍA UN LOCAL LLAMADO THE DIPSY DOODLE, EN OSCEOLA, ARKANSAS. / ADELANTE HABÍA MÚSICA. / ATRÁS, JUEGOS DE DADOS. / Y EN MEDIO DE TODO ESO CRECIÓ FRANK SON SEALS, NACIDO EN 1942. //

POR EL LOCAL PASABAN MÚSICOS COMO SONNY BOY WILLIAMSON, ROBERT NIGHTHAWK Y ALBERT KING. / PARA OTROS CHICOS ESOS NOMBRES HABRÍAN SIDO FIGURAS LEJANAS. / PARA SON ERAN SONIDOS QUE LLEGABAN A CASA. //

SU PADRE HABÍA SIDO MÚSICO Y HABÍA RECORRIDO CAMINOS CON COMPAÑÍAS ITINERANTES. / LE ENSEÑÓ A ENTENDER EL ESCENARIO COMO UN LUGAR DE TRABAJO. / NO COMO UN ALTAR. //

A LOS 13 AÑOS SON YA ERA UN BATERISTA CAPAZ. / Y ESTO ES IMPORTANTE PARA ESCUCHAR DESPUÉS SU GUITARRA. / AUN CUANDO TOCABA FRASES DURAS Y CORTANTES, HABÍA UN BATERISTA ADENTRO MARCANDO EL TIEMPO. //

DE ADOLESCENTE CAMBIÓ LA BATERÍA POR LA GUITARRA Y TERMINÓ DIRIGIENDO SU PROPIA BANDA. / TAMBIÉN SALIÓ A LA RUTA COMO ACOMPAÑANTE DE **EARL HOOKER** Y **ALBERT KING**. / NO HABÍA MUCHO ROMANTICISMO EN ESAS GIRAS: HABÍA CAMINOS LARGOS, ESCENARIOS DIFÍCILES Y LA NECESIDAD DE TOCAR BIEN CADA NOCHE. //

PERO TODO ESO FUE FORMANDO UNA PERSONALIDAD. / SON NO QUERÍA SER UNA COPIA DE LOS GUITARRISTAS QUE ADMIRABA. / QUERÍA QUE, AL ESCUCHAR DOS FRASES, UNO SUPIERA QUIÉN ESTABA TOCANDO. //

EN 1971 LLEGÓ A CHICAGO. / LA CIUDAD YA HABÍA CAMBIADO RESPECTO DE LA ÉPOCA DE MUDDY WATERS Y LITTLE WALTER. / EL ROCK HABÍA TOMADO MUCHAS COSAS DEL BLUES. / ALGUNOS CLUBES CERRABAN, OTROS CAMBIABAN DE PÚBLICO, Y MUCHOS MÚSICOS TENÍAN QUE PELEAR PARA CONSEGUIR UNA NOCHE DE TRABAJO. //

SON SE METIÓ EN ESA ESCENA SIN PEDIR TRATO ESPECIAL. / TOCÓ CON Y JUNTO A GENTE COMO BUDDY GUY, JUNIOR WELLS Y JAMES COTTON. / TAMBIÉN CONOCIÓ A HOUND DOG TAYLOR, EL GUITARRISTA QUE HABÍA AYUDADO A PONER EN MARCHA EL SELLO ALLIGATOR. //

CUANDO HOUND DOG EMPEZÓ A GIRAR, DEJÓ LIBRES SUS NOCHES HABITUALES EN EL EXPRESSWAY LOUNGE, EN EL SOUTH SIDE. / SON OCUPÓ ESE LUGAR. //

PENSÁ EN LA ESCENA. / UN BAR PEQUEÑO. / UN GUITARRISTA NUEVO PARA BUENA PARTE DEL PÚBLICO. / Y UNA MÚSICA QUE NO TENÍA NADA DE COMPLACIENTE. //

AHÍ LO ESCUCHÓ **BRUCE IGLAUER**, EL HOMBRE DE ALLIGATOR RECORDS. / Y EN 1973 LLEGÓ THE SON SEALS BLUES BAND. //

EL DISCO NO SONABA COMO EL TRABAJO DE UN PRINCIPIANTE. / SON ESCRIBÍA GRAN PARTE DE SU MATERIAL Y CANTABA CON UNA VOZ RASPOSA, CASI ENOJADA. / LA GUITARRA NO BUSCABA SER ELEGANTE. / BUSCABA DECIR ALGO Y DEJAR UNA MARCA. //

**ERA BLUES CON LOS DIENTES APRETADOS.** //

EN 1977 PUBLICÓ MIDNIGHT SON. / ESE DISCO TERMINÓ DE INSTALARLO COMO UNA FIGURA CENTRAL DEL BLUES ELÉCTRICO DE SU GENERACIÓN. / LOS CRÍTICOS LO ESCUCHARON. / LOS FESTIVALES LO EMPEZARON A LLAMAR. / Y SON PASÓ DE LOS CLUBES CHICOS A ESCENARIOS MUCHO MÁS GRANDES. //

PERO NO CAMBIÓ SU MANERA DE TOCAR PARA VOLVERSE MÁS AGRADABLE. / SIGUIÓ SIENDO INTENSO, INCÓMODO POR MOMENTOS, BRUTALMENTE EXPRESIVO. //

VIAJÓ POR ESTADOS UNIDOS Y EUROPA. / COMPARTIÓ ESCENARIOS CON B. B. KING Y JOHNNY WINTER. / Y UNA GENERACIÓN MÁS JOVEN LO DESCUBRIÓ POR UN CAMINO INESPERADO: LA BANDA PHISH EMPEZÓ A TOCAR SU CANCIÓN FUNKY BITCH Y LO INVITÓ A COMPARTIR ESCENARIO. //

ME GUSTA MUCHO ESA PARTE DE LA HISTORIA. / UN TEMA NACIDO DEL BLUES DE CHICAGO TERMINÓ SONANDO ANTE UN PÚBLICO QUE QUIZÁS NUNCA HABÍA PISADO UN CLUB DEL SOUTH SIDE. / Y ESO NO LO CONVIRTIÓ EN OTRA COSA. / SIGUIÓ SIENDO SON SEALS. //

GRABÓ OCHO DISCOS PARA ALLIGATOR Y SE CONVIRTIÓ EN UNO DE LOS NOMBRES MÁS IMPORTANTES DEL SELLO. / GANÓ RECONOCIMIENTOS, PERO NINGÚN PREMIO EXPLICA DEL TODO LA FUERZA DE SUS CONCIERTOS. //

ESCUCHÁ SU GUITARRA Y VAS A NOTAR ALGO: NO HAY DEMASIADAS NOTAS DE RELLENO. / CADA ATAQUE PARECE VENIR DE UN LUGAR PERSONAL. / Y LA VOZ, LEJOS DE SUAVIZARLO, LO HACE TODAVÍA MÁS DIRECTO. //

MURIÓ EN DICIEMBRE DE 2004. / TENÍA 62 AÑOS. //

SI KOKO TAYLOR REPRESENTABA UNA VOZ QUE SE ABRIÓ PASO A FUERZA DE PRESENCIA, SI MIGHTY JOE YOUNG MOSTRABA EL OFICIO DEL MÚSICO QUE SOSTIENE UNA BANDA, Y SI CAREY BELL ERA LA RESPIRACIÓN DE UNA TRADICIÓN, SON SEALS FUE UNA PRUEBA DE QUE CHICAGO TODAVÍA PODÍA PRODUCIR UN BLUES NUEVO Y PELIGROSO. //

NO UNO NUEVO PORQUE OLVIDARA A LOS ANTERIORES. / NUEVO PORQUE SE ANIMABA A HABLAR CON SU PROPIA VOZ. //

**Y ESO, EN EL BLUES, ES UNA FORMA DE NO RENDIRSE.** //\n\nCIERRE NATURAL. //\n\n\nCIERRE\n\nCUATRO HISTORIAS. / CUATRO MANERAS DE RESISTIR. //\n\nKOKO TAYLOR TUVO QUE ABRIRSE PASO CON LA VOZ. //\n\nMIGHTY JOE YOUNG SOSTUVO A OTROS ANTES DE OCUPAR SU PROPIO LUGAR. //\n\nCAREY BELL CAMBIÓ DE INSTRUMENTO PARA NO QUEDARSE AFUERA DE LA MÚSICA. //\n\nSON SEALS CONVIRTIÓ LO QUE HABÍA APRENDIDO DE CHICO EN UNA GUITARRA IMPOSIBLE DE IGNORAR. //\n\nY EN MEDIO DE TODO, / CHICAGO. //\n\nNO COMO UNA CIUDAD PERFECTA. / COMO UN LUGAR DONDE LA MÚSICA SEGUÍA TRABAJANDO AUNQUE LAS COSAS SE PUSIERAN DIFÍCILES. //\n\nSOY SEBASTIÁN SOPELANA. / GRACIAS POR ESTAR DEL OTRO LADO DE RUIDOS MOLESTOS. //\n\nLA HISTORIA LLEGÓ A SU FIN, EL BLUES POR SUERTE, NO. //"; let size=32;
 function show(){login.hidden=true;page.hidden=false;render()}
 function render(){const raw=localStorage.getItem('rm_lectura')||DEFAULT_PROGRAM; text.innerHTML=''; const key=/^(CHICAGO NO SE RINDE\.|Y EL BLUES SE ENCHUFÓ\.|VOLVIÓ\.|ENTRÓ CON TODA SU VOZ\.|MIGHTY JOE YOUNG\.|APRENDIÓ A TOCAR EL BAJO\.|SEGUÍA TENIENDO FILO\.|LA HISTORIA LLEGÓ A SU FIN)/i; raw.split('\\n').forEach(function(line){const d=document.createElement('div');d.textContent=line||' ';d.className='line';if(/^PROGRAMA \\d+/i.test(line))d.className+=' program-title';else if(/^CAPÍTULO \\d+/i.test(line))d.className+=' chapter-title';else if(/^(PRESENTACIÓN|CIERRE|MÚSICA|LA MÚSICA DEL CAPÍTULO)/i.test(line))d.className+=' section-title';else if(/^POR QUÉ:/i.test(line))d.className+=' music-note';if(key.test(line.trim()))d.className+=' voice-emphasis';text.appendChild(d)})}
 function enter(){if(pass.value==='0253'){sessionStorage.setItem('rm_pass','ok');show()}else{error.textContent='Código incorrecto';pass.value='';pass.focus()}}

 document.getElementById('plus').onclick=function(){size=Math.min(48,size+2);text.style.fontSize=size+'px'};
