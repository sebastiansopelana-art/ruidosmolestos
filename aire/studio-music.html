<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Music · Ruidos Molestos</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0e10;color:#eee9df;font:15px Arial}main{max-width:1100px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #3b3b3b;padding-bottom:18px}.tag{font-size:11px;letter-spacing:2px;color:#bcae91}h1{font:700 34px Georgia;margin:4px 0}.panel{background:#181a1d;border:1px solid #3c3d40;border-radius:9px;padding:18px;margin-top:18px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,input{border:1px solid #606164;background:#292b2e;color:white;border-radius:5px;padding:12px}button{font-weight:bold;cursor:pointer}.primary{background:#e6ddca;color:#111}.now{font:700 27px Georgia;margin:12px 0}.track{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border-top:1px solid #37383a;padding:12px 4px}.track.active{background:#34332d}.meta{color:#aaa;font-size:12px;margin-top:4px}.status{color:#cdbf9e;margin:12px 0}.search{display:flex;gap:8px;margin:14px 0}.search input{flex:1}a{color:#ded1b5}@media(max-width:650px){.track{grid-template-columns:28px 1fr}.track button{grid-column:2}.now{font-size:23px}}</style></head><body><main><header><div><div class="tag">RUIDOS MOLESTOS · PRODUCCIÓN</div><h1>STUDIO MUSIC</h1><div>Consola experimental · YouTube Music</div></div><a href="/aire/studio.html">STUDIO MP3 →</a></header><section class="panel"><div class="tag">AL AIRE</div><div id="now" class="now">Sin tema seleccionado</div><div id="artist" class="meta">Buscá y agregá temas al programa</div><div class="controls" style="margin-top:16px"><button id="play" class="primary">▶ PLAY</button><button id="pause">⏸ PAUSA</button><button id="stop">■ STOP</button><button id="next">⏭ SIGUIENTE</button><label style="display:flex;align-items:center;gap:8px"><input id="auto" type="checkbox"> AUTO</label></div><div id="status" class="status">Listo.</div><div id="player" style="margin-top:12px"></div></section><section class="panel"><div class="tag">PROGRAMACIÓN AUTOMÁTICA</div><div class="controls" style="margin:14px 0"><button id="loadProgram" class="primary">⚡ CARGAR PROGRAMA 43</button></div><div id="programState" class="meta">Carga el manifiesto y busca cada tema automáticamente.</div><hr style="border:0;border-top:1px solid #37383a;margin:18px 0"><div class="tag">BÚSQUEDA MANUAL</div><div class="search"><input id="q" value="Fusion Orchestra Sonata in Z"><button id="search">BUSCAR</button></div><div id="results"></div></section><section class="panel"><div class="tag">PLAYLIST DEL PROGRAMA</div><div id="list"></div><div class="controls" style="margin-top:15px"><button id="clear">VACIAR LISTA</button></div></section></main><script src="https://www.youtube.com/iframe_api"></script><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let list=JSON.parse(localStorage.getItem('rm-music-program')||'[]'),idx=-1,player,ready=false,pending=false;const save=()=>localStorage.setItem('rm-music-program',JSON.stringify(list));function render(){const box=$('list');box.innerHTML=list.map((x,i)=>'<div class="track '+(i===idx?'active':'')+'"><b>'+String(i+1).padStart(2,'0')+'</b><div><b>'+esc(x.title)+'</b><div class="meta">'+esc(x.artist)+'</div></div><button onclick="selectTrack('+i+',true)">▶ PLAY</button></div>').join('')||'<p class="meta">Todavía no hay temas cargados.</p>';if(idx>=0&&list[idx]){$('now').textContent=list[idx].title;$('artist').textContent=list[idx].artist}else{$('now').textContent='Sin tema seleccionado';$('artist').textContent='Buscá y agregá temas al programa'}}function selectTrack(i,play){if(i<0||i>=list.length)return;idx=i;render();if(ready){player.loadVideoById(list[i].id);if(!play)player.pauseVideo()}else pending=play}window.selectTrack=selectTrack;window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{height:'180',width:'100%',playerVars:{playsinline:1,controls:0},events:{onReady:()=>{ready=true;if(idx<0&&list.length)idx=0;render();if(pending&&idx>=0)player.loadVideoById(list[idx].id)},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&$('auto').checked)next()}}})};function next(){if(idx<list.length-1)selectTrack(idx+1,true);else $('status').textContent='Terminó la playlist.'}$('play').onclick=()=>{if(!list.length)return $('status').textContent='Agregá un tema primero.';if(idx<0)idx=0;selectTrack(idx,true)};$('pause').onclick=()=>ready&&player.pauseVideo();$('stop').onclick=()=>{if(ready){player.stopVideo();player.seekTo(0,true)}};$('next').onclick=next;$('search').onclick=async()=>{const q=$('q').value.trim();if(!q)return;$('status').textContent='Buscando…';$('results').innerHTML='';try{const r=await fetch('/api/ytmusic-search?q='+encodeURIComponent(q),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Error de búsqueda');$('results').innerHTML=(d.results||[]).slice(0,8).map((x,i)=>'<div class="track"><b>+</b><div><b>'+esc(x.title)+'</b><div class="meta">'+esc(x.artist)+'</div></div><button onclick="addResult('+i+')">AGREGAR</button></div>').join('')||'<p>Sin resultados.</p>';window._results=d.results||[];$('status').textContent='Resultados encontrados.'}catch(e){$('status').textContent=e.message}};$('loadProgram').onclick=async()=>{const btn=$('loadProgram');btn.disabled=true;$('programState').textContent='Buscando la programación…';try{const mf=await fetch('/aire/programas/43.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No se pudo leer el programa.');return r.json()});let found=0,missing=[];list=[];for(let i=0;i<mf.tracks.length;i++){const t=mf.tracks[i];$('programState').textContent='Buscando '+(i+1)+'/'+mf.tracks.length+': '+t.label;try{const r=await fetch('/api/ytmusic-search?q='+encodeURIComponent(t.query),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.results?.length)throw Error('sin resultado');const exact=d.results[0];list.push({...exact,planned:t.label});found++}catch(e){missing.push(t.label)}}save();idx=-1;render();$('programState').textContent=found+'/'+mf.tracks.length+' encontrados'+(missing.length?' · Faltan: '+missing.join(' | '):' · PROGRAMA LISTO');$('status').textContent=missing.length?'Revisá los temas faltantes.':'Programación cargada automáticamente.'}catch(e){$('programState').textContent=e.message}finally{btn.disabled=false}};window.addResult=i=>{const x=window._results?.[i];if(!x)return;if(list.some(t=>t.id===x.id))return $('status').textContent='Ese tema ya está en la lista.';list.push(x);save();render();$('status').textContent='Tema agregado. '+list.length+' en la playlist.'};$('clear').onclick=()=>{if(list.length&&!confirm('¿Vaciar la playlist de YouTube Music?'))return;list=[];idx=-1;save();if(ready)player.stopVideo();render();$('status').textContent='Playlist vaciada.'};render();</script></body></html>
