<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruidos Molestos · Dos Reproductores</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#07121d;color:#e9f3fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#08131e,#0d2334)}
main{width:min(1440px,100%);margin:0 auto;padding:12px}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.player{width:100%;min-width:0;background:#142a3c;border:1px solid #466b83;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 7px 25px #0004}
.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:27px}
.heading h2{font-size:14px;letter-spacing:.08em;margin:0;font-weight:800}
.state{font-size:10px;color:#8ddbb1;border:1px solid #386753;border-radius:5px;padding:4px 7px}
.screen{height:77px;background:#091c2c;border:1px solid #35576c;border-radius:6px;padding:11px;display:flex;flex-direction:column;justify-content:center;gap:5px;overflow:hidden}
.track{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:11px;color:#a3bacb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline{display:grid;grid-template-columns:43px minmax(0,1fr) 43px;gap:8px;align-items:center}
.time{font:11px ui-monospace,monospace;text-align:center;color:#b9d0e0}
input[type=range]{width:100%;min-width:0;accent-color:#58bfe8;cursor:pointer}
.buttons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.buttons button{width:100%;min-width:0;height:38px;background:#23475f;border:1px solid #507a96;color:#f1f8fc;border-radius:6px;font-size:19px;cursor:pointer}
.buttons button:hover{background:#316887}.buttons button:focus-visible,.file:focus-visible{outline:2px solid #94ddff;outline-offset:2px}
.buttons button[aria-pressed=true]{background:#337c63;border-color:#76c9a1}
.volume{display:grid;grid-template-columns:60px minmax(0,1fr) 35px;gap:9px;align-items:center;font-size:11px;font-weight:700;color:#bcd2e1}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:29px}
.air{font-size:10px;letter-spacing:.06em;color:#a8bfce;border:1px solid #446276;padding:6px 8px;border-radius:5px}
.file{background:#244e69;border:1px solid #517d99;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:10px;font-weight:800;white-space:nowrap}
.file input{display:none}
@media(max-width:680px){.players{grid-template-columns:1fr}main{padding:8px}.player{padding:9px}.buttons{gap:3px}.buttons button{height:35px}}

/* Secciones gemelas: el CSS de los reproductores permanece intacto */
.below{margin-top:12px;width:100%;height:330px;min-height:330px;max-height:330px;background:#142a3c;border:1px solid #466b83;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;overflow:hidden}.below h3{font-size:12px;letter-spacing:.07em;margin:0;flex-shrink:0}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex-shrink:0}.tabs button,.below button{border:1px solid #507a96;background:#23475f;color:#f1f8fc;border-radius:5px;cursor:pointer;padding:7px 5px;font-size:11px}.tabs button[aria-selected=true]{background:#387d9f;border-color:#a4dfff}.items{flex:1;min-height:0;overflow-y:auto;background:#091c2c;border:1px solid #35576c;border-radius:6px;padding:5px}.entry{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 5px;border-bottom:1px solid #29465a;font-size:11px}.entry span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.entry button{flex-shrink:0}.hint{font-size:11px;color:#a3bacb;padding:7px}.searchrow{display:flex;gap:6px;flex-shrink:0}.searchrow input{min-width:0;flex:1;background:#091c2c;border:1px solid #507a96;border-radius:5px;padding:8px;color:#f1f8fc}.upload{display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#244e69;border:1px solid #517d99;border-radius:5px;padding:7px;font-size:11px;cursor:pointer}.upload input{display:none}.below .sub{font-size:10px;color:#a3bacb;flex-shrink:0}
</style></head>
<body><main><div class="players" id="players"></div></main>
<script>
const icons=[['back','⏪','Retroceder 10 segundos'],['play','▶','Reproducir'],['pause','⏸','Pausar'],['stop','■','Detener'],['next','⏭','Siguiente tema'],['repeat','↻','Repetir tema'],['forward','⏩','Adelantar 10 segundos']];
const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
function buildPlayer(number){
 const root=document.createElement('section');root.className='player';root.setAttribute('aria-label','Reproductor '+number);
 root.innerHTML='<div class="heading"><h2>REPRODUCTOR '+number+'</h2><span class="state">LISTO</span></div><div class="screen"><div class="track">Sin tema cargado</div><div class="artist">Seleccioná archivos de audio para reproducir</div></div><div class="timeline"><span class="time elapsed">00:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Posición de reproducción"><span class="time remaining">-00:00</span></div><div class="buttons"></div><div class="volume"><span>VOLUMEN</span><input class="vol" type="range" min="0" max="100" value="85" aria-label="Volumen"><span class="volvalue">85%</span></div><div class="footer"><span class="air">FUERA DEL AIRE</span><label class="file">＋ CARGAR AUDIO<input type="file" accept="audio/*" multiple></label></div>';
 const $=sel=>root.querySelector(sel),audio=new Audio();audio.preload='metadata';audio.volume=.85;
 let tracks=[],idx=-1,repeat=false,urls=[];
 const setState=t=>$('.state').textContent=t;
 function load(i,autoplay){if(i<0||i>=tracks.length)return;idx=i;audio.src=tracks[i].url;$('.track').textContent=tracks[i].name;$('.artist').textContent='Archivo '+(i+1)+' de '+tracks.length;$('.seek').value=0;setState('CARGADO');if(autoplay)audio.play().catch(()=>setState('TOCÁ PLAY'))}
 const actions={back:()=>{audio.currentTime=Math.max(0,(audio.currentTime||0)-10)},play:()=>{if(idx<0&&tracks.length)load(0,false);if(idx>=0)audio.play().catch(()=>setState('TOCÁ PLAY'))},pause:()=>audio.pause(),stop:()=>{audio.pause();audio.currentTime=0;setState('DETENIDO')},next:()=>{if(idx+1<tracks.length)load(idx+1,true)},repeat:()=>{repeat=!repeat;root.querySelector('[data-action="repeat"]').setAttribute('aria-pressed',String(repeat))},forward:()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,(audio.currentTime||0)+10)}};
 for(const [id,symbol,title] of icons){const btn=document.createElement('button');btn.type='button';btn.textContent=symbol;btn.title=title;btn.setAttribute('aria-label',title);btn.dataset.action=id;if(id==='repeat')btn.setAttribute('aria-pressed','false');btn.addEventListener('click',actions[id]);$('.buttons').append(btn)}
 $('.file input').addEventListener('change',e=>{audio.pause();urls.forEach(URL.revokeObjectURL);urls=[];tracks=Array.from(e.target.files||[]).map(f=>{const url=URL.createObjectURL(f);urls.push(url);return {url,name:f.name.replace(/\.[^.]+$/,'')}});idx=-1;if(tracks.length)load(0,false)});
 $('.vol').addEventListener('input',e=>{audio.volume=Number(e.target.value)/100;$('.volvalue').textContent=e.target.value+'%'});
 $('.seek').addEventListener('input',e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(e.target.value)/1000});
 audio.addEventListener('timeupdate',()=>{const d=audio.duration;$('.elapsed').textContent=fmt(audio.currentTime);$('.remaining').textContent='-'+fmt(Number.isFinite(d)?d-audio.currentTime:0);$('.seek').value=Number.isFinite(d)&&d>0?Math.round(audio.currentTime/d*1000):0});
 audio.addEventListener('loadedmetadata',()=>{$('.remaining').textContent='-'+fmt(audio.duration)});
 audio.addEventListener('play',()=>{setState('REPRODUCIENDO');$('.air').textContent='● EN EL AIRE'});
 audio.addEventListener('pause',()=>{if(!audio.ended)setState('PAUSADO');$('.air').textContent='FUERA DEL AIRE'});
 audio.addEventListener('ended',()=>{if(repeat){audio.currentTime=0;audio.play().catch(()=>{})}else if(idx+1<tracks.length)load(idx+1,true);else{setState('FINALIZADO');$('.air').textContent='FUERA DEL AIRE'}});
 audio.addEventListener('error',()=>setState('ERROR DE AUDIO'));
 return root
}
document.getElementById('players').append(buildPlayer(1),buildPlayer(2));

const decks=[...document.querySelectorAll('.player')];
const makePanel=(title)=>{const panel=document.createElement('section');panel.className='below';const h=document.createElement('h3');h.textContent=title;panel.append(h);return panel};
const blockPanel=makePanel('BLOQUES DEL PROGRAMA'),auxPanel=makePanel('PLAYLIST AUXILIAR');
decks[0].after(blockPanel);decks[1].after(auxPanel);
const blocks=[[],[],[],[]],auxFiles=[];let activeBlock=0;
const tabs=document.createElement('div');tabs.className='tabs';blockPanel.append(tabs);
const blockItems=document.createElement('div');blockItems.className='items';blockPanel.append(blockItems);
const blockUpload=document.createElement('label');blockUpload.className='upload';blockUpload.textContent='＋ CARGAR AUDIO EN BLOQUE';const blockFile=document.createElement('input');blockFile.type='file';blockFile.accept='audio/*';blockFile.multiple=true;blockUpload.append(blockFile);blockPanel.append(blockUpload);
const blockAudio=decks[0].querySelector('.footer input[type=file]');decks[0].querySelector('.footer .file').style.display='none';
function drawBlocks(){tabs.replaceChildren();for(let b=0;b<4;b++){const btn=document.createElement('button');btn.textContent='BLOQUE '+(b+1);btn.setAttribute('aria-selected',String(activeBlock===b));btn.onclick=()=>{activeBlock=b;drawBlocks()};tabs.append(btn)}
blockItems.replaceChildren();if(!blocks[activeBlock].length){const d=document.createElement('div');d.className='hint';d.textContent='Todavía no hay temas en este bloque.';blockItems.append(d)}
for(const [i,f] of blocks[activeBlock].entries()){const row=document.createElement('div');row.className='entry';const t=document.createElement('span');t.textContent=String(i+1).padStart(2,'0')+' · '+f.name;const btn=document.createElement('button');btn.textContent='▶';btn.title='Cargar y reproducir bloque desde este tema';btn.onclick=()=>{const dt=new DataTransfer();blocks[activeBlock].forEach(file=>dt.items.add(file));blockAudio.files=dt.files;blockAudio.dispatchEvent(new Event('change',{bubbles:true}));const next=decks[0].querySelector('[data-action=next]');for(let k=0;k<i;k++)next.click();decks[0].querySelector('[data-action=play]').click()};row.append(t,btn);blockItems.append(row)}}
blockFile.onchange=()=>{blocks[activeBlock].push(...Array.from(blockFile.files));blockFile.value='';drawBlocks()};drawBlocks();
const search=document.createElement('form');search.className='searchrow';const q=document.createElement('input');q.placeholder='Buscar en YouTube';q.setAttribute('aria-label','Buscar canción o artista');const go=document.createElement('button');go.textContent='BUSCAR';search.append(q,go);auxPanel.append(search);
search.onsubmit=e=>{e.preventDefault();if(q.value.trim())window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q.value.trim()),'_blank','noopener')};
const auxNote=document.createElement('div');auxNote.className='sub';auxNote.textContent='Búsqueda externa · reproducción local de archivos';auxPanel.append(auxNote);
const auxItems=document.createElement('div');auxItems.className='items';auxPanel.append(auxItems);
const auxUpload=document.createElement('label');auxUpload.className='upload';auxUpload.textContent='＋ AGREGAR A PLAYLIST';const auxFile=document.createElement('input');auxFile.type='file';auxFile.accept='audio/*';auxFile.multiple=true;auxUpload.append(auxFile);auxPanel.append(auxUpload);
const auxNative=decks[1].querySelector('.footer input[type=file]');decks[1].querySelector('.footer .file').style.display='none';
function drawAux(){auxItems.replaceChildren();if(!auxFiles.length){const d=document.createElement('div');d.className='hint';d.textContent='Playlist vacía. Agregá archivos de audio.';auxItems.append(d)}for(const [i,f] of auxFiles.entries()){const row=document.createElement('div');row.className='entry';const t=document.createElement('span');t.textContent=String(i+1).padStart(2,'0')+' · '+f.name;const b=document.createElement('button');b.textContent='▶';b.onclick=()=>{const dt=new DataTransfer();auxFiles.forEach(file=>dt.items.add(file));auxNative.files=dt.files;auxNative.dispatchEvent(new Event('change',{bubbles:true}));for(let k=0;k<i;k++)decks[1].querySelector('[data-action=next]').click();decks[1].querySelector('[data-action=play]').click()};row.append(t,b);auxItems.append(row)}}
auxFile.onchange=()=>{auxFiles.push(...Array.from(auxFile.files));auxFile.value='';drawAux()};drawAux();
</script></body></html>
