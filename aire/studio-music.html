<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruidos Molestos · Dos Reproductores</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif;background:#07121d;color:#e9f3fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#08131e,#0d2334)}
main{width:min(1440px,100%);margin:0 auto;padding:12px}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.player{width:100%;min-width:0;background:#142a3c;border:1px solid #466b83;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 7px 25px #0004}
.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:27px}
.heading h2{font-size:14px;letter-spacing:.08em;margin:0;font-weight:800}
.state{font-size:10px;color:#8ddbb1;border:1px solid #386753;border-radius:5px;padding:4px 7px}
.screen{height:77px;background:#091c2c;border:1px solid #35576c;border-radius:6px;padding:11px;display:flex;flex-direction:column;justify-content:center;gap:5px;overflow:hidden}
.track{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:11px;color:#a3bacb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline{display:grid;grid-template-columns:43px minmax(0,1fr) 43px;gap:8px;align-items:center}
.time{font:11px ui-monospace,monospace;text-align:center;color:#b9d0e0}
input[type=range]{width:100%;min-width:0;accent-color:#58bfe8;cursor:pointer}
.buttons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.buttons button{width:100%;min-width:0;height:38px;background:#23475f;border:1px solid #507a96;color:#f1f8fc;border-radius:6px;font-size:19px;cursor:pointer}
.buttons button:hover{background:#316887}.buttons button:focus-visible,.file:focus-visible{outline:2px solid #94ddff;outline-offset:2px}
.buttons button[aria-pressed=true]{background:#337c63;border-color:#76c9a1}
.volume{display:grid;grid-template-columns:60px minmax(0,1fr) 35px;gap:9px;align-items:center;font-size:11px;font-weight:700;color:#bcd2e1}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:29px}
.air{font-size:10px;letter-spacing:.06em;color:#a8bfce;border:1px solid #446276;padding:6px 8px;border-radius:5px}
.file{background:#244e69;border:1px solid #517d99;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:10px;font-weight:800;white-space:nowrap}
.file input{display:none}
@media(max-width:680px){.players{grid-template-columns:1fr}main{padding:8px}.player{padding:9px}.buttons{gap:3px}.buttons button{height:35px}}

/* Secciones gemelas: el CSS de los reproductores permanece intacto */
.player>.below{margin-top:12px;width:100%;height:330px;min-height:330px;max-height:330px;background:#142a3c;border:1px solid #466b83;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;overflow:hidden}.below h3{font-size:12px;letter-spacing:.07em;margin:0;flex-shrink:0}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex-shrink:0}.tabs button,.below button{border:1px solid #507a96;background:#23475f;color:#f1f8fc;border-radius:5px;cursor:pointer;padding:7px 5px;font-size:11px}.tabs button[aria-selected=true]{background:#387d9f;border-color:#a4dfff}.items{flex:1;min-height:0;overflow-y:auto;background:#091c2c;border:1px solid #35576c;border-radius:6px;padding:5px}.entry{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 5px;border-bottom:1px solid #29465a;font-size:11px}.entry span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.entry button{flex-shrink:0}.hint{font-size:11px;color:#a3bacb;padding:7px}.searchrow{display:flex;gap:6px;flex-shrink:0}.searchrow input{min-width:0;flex:1;background:#091c2c;border:1px solid #507a96;border-radius:5px;padding:8px;color:#f1f8fc}.upload{display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#244e69;border:1px solid #517d99;border-radius:5px;padding:7px;font-size:11px;cursor:pointer}.upload input{display:none}.below .sub{font-size:10px;color:#a3bacb;flex-shrink:0}

/* Ocho separadores compactos: cuatro por reproductor, sin desbordes */
.player .footer{min-width:0;gap:6px}.player .footer .air{flex:0 0 auto;font-size:9px;padding:5px 6px;white-space:nowrap}.separator-pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex:1 1 0;min-width:0;max-width:100%}.separator-pad button{height:25px;min-width:0;width:100%;padding:0 2px;border-radius:5px;border:1px solid #8ba5b9;background:#3c6d88;color:white;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden}.separator-pad button:nth-child(2){background:#397b71}.separator-pad button:nth-child(3){background:#78629b}.separator-pad button:nth-child(4){background:#9b7143}.separator-pad button[data-playing=true]{outline:2px solid #fff;outline-offset:-2px;animation:sepflash .8s ease-in-out infinite alternate}.separator-pad button[data-loaded=true]:not([data-playing=true]){border-color:#d5ebff}@keyframes sepflash{to{filter:brightness(1.55)}}@media(max-width:680px){.separator-pad{gap:2px}.separator-pad button{font-size:9px}.player .footer .air{font-size:8px;padding:5px 3px}}

/* Nombre del separador debajo de cada botón, limitado estrictamente a su ancho */
.separator-pad .sep-cell{display:flex;flex-direction:column;min-width:0;max-width:100%;overflow:hidden;gap:2px}.separator-pad .sep-cell>button{flex:0 0 auto}.separator-pad .sep-name{display:block;width:100%;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:8px;line-height:11px;color:#bcd6e7;text-align:center}.player .footer{align-items:center}.separator-pad{align-items:start}
/* Alinear FUERA DEL AIRE con la fila de botones de separadores */
.player .footer{align-items:flex-start!important}.player .footer>.air{box-sizing:border-box;height:25px;min-height:25px;display:inline-flex;align-items:center;justify-content:center;margin:0!important;line-height:1!important}.player .footer>.separator-pad{margin:0!important;align-self:flex-start!important}

/* Ocho colores fijos. Al sonar, alternan con amarillo intenso. */
.separator-pad .sep-cell:nth-child(1) button{background:#256b96;border-color:#63b7e6}
.separator-pad .sep-cell:nth-child(2) button{background:#2c8064;border-color:#6ccea6}
.separator-pad .sep-cell:nth-child(3) button{background:#8063ad;border-color:#c0a4ed}
.separator-pad .sep-cell:nth-child(4) button{background:#a06b35;border-color:#e5b16d}
.player:nth-child(2) .separator-pad .sep-cell:nth-child(1) button{background:#9b4e78;border-color:#e493bc}
.player:nth-child(2) .separator-pad .sep-cell:nth-child(2) button{background:#377f86;border-color:#7bd3d6}
.player:nth-child(2) .separator-pad .sep-cell:nth-child(3) button{background:#8b6149;border-color:#d7a385}
.player:nth-child(2) .separator-pad .sep-cell:nth-child(4) button{background:#687c3b;border-color:#b5cf76}
.separator-pad .sep-cell button{color:#fff;font-weight:900;border-width:2px;transition:none}
.separator-pad .sep-cell button[data-playing="true"]{
 animation:rmSeparatorPulse .55s steps(1,end) infinite!important;
 outline:2px solid white;outline-offset:1px;
}
@keyframes rmSeparatorPulse{
 0%,49%{background-color:#faff36;color:#101820;border-color:#fff;box-shadow:0 0 15px 3px #faff36}
 50%,100%{background-color:#ff2d88;color:#fff;border-color:#fff;box-shadow:0 0 15px 3px #ff2d88}
}
/* Mantener una señal fija muy visible si el sistema reduce las animaciones */
@media(prefers-reduced-motion:reduce){
 .separator-pad .sep-cell button[data-playing="true"]{animation:rmSeparatorPulse .9s steps(1,end) infinite!important}
}

/* Indicador EN EL AIRE: rojo intermitente exclusivamente al reproducir el deck */
.player .footer>.air{white-space:nowrap;font-weight:900;letter-spacing:.04em;color:#b4c8d7;background:#162d3d;border-color:#526f83}
.player .footer>.air[data-live="true"]{color:#fff!important;background:#df182b!important;border:1px solid #ff8792!important;animation:rmOnAirBlink .6s steps(1,end) infinite!important;box-shadow:0 0 11px #ff233d99}
@keyframes rmOnAirBlink{0%,49%{background:#ff172e;box-shadow:0 0 15px 3px #ff263f;color:#fff}50%,100%{background:#580713;box-shadow:none;color:#ffb6c0}}

/* Parpadeo unificado: rojo únicamente, tanto en separadores como EN EL AIRE. */
.separator-pad .sep-cell button[data-playing="true"]{animation:rmOnlyRedBlink .62s steps(1,end) infinite!important;outline:2px solid #ffb1b8!important;outline-offset:1px!important}
.player .footer>.air[data-live="true"]{animation:rmOnlyRedBlink .62s steps(1,end) infinite!important}
@keyframes rmOnlyRedBlink{
  0%,49%{background:#ff1735!important;background-color:#ff1735!important;color:#fff!important;border-color:#ff8997!important;box-shadow:0 0 14px 3px #ff1735aa!important}
  50%,100%{background:#680b19!important;background-color:#680b19!important;color:#fff!important;border-color:#b63749!important;box-shadow:none!important}
}

/* Buscador Beta 3 adaptado al panel auxiliar aprobado */
.aux-suggestions{position:relative;flex:0 0 auto;max-height:112px;overflow:auto;border:1px solid #466b83;border-radius:5px;background:#0b2030}
.aux-suggestions:empty{display:none}
.aux-suggestions .suggestion{width:100%;display:flex;gap:6px;align-items:center;justify-content:space-between;text-align:left;background:#142e42;border:0;border-bottom:1px solid #34566b;border-radius:0;padding:5px 7px;font-size:10px}
.aux-suggestions .suggestion span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aux-suggestions .suggestion[aria-selected=true]{background:#326f8c}
.aux-suggestions .suggestion small{flex-shrink:0;color:#bde3f8}
.aux-yt-host{position:absolute;width:1px;height:1px;overflow:hidden;left:-9999px;top:auto}
.aux-youtube-item{cursor:pointer}
.aux-youtube-item[data-active=true]{background:#1e526b}
.aux-youtube-item button{flex-shrink:0}

/* Sugerencias: resultados RM primero; reproducir por Enter o clic y cargar a la derecha */
.aux-suggestions{max-height:145px;flex-shrink:0}
.aux-suggestions .suggestion{display:flex;gap:3px;align-items:stretch;padding:2px;background:#10283a;border-bottom:1px solid #365368}
.aux-suggestions .suggestion[aria-selected=true]{background:#376f8f;outline:1px solid #9edfff;outline-offset:-1px}
.aux-suggestions .suggestion .suggestion-play{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;background:transparent;padding:6px 4px;font-size:10px}
.aux-suggestions .suggestion .suggestion-load{flex:0 0 auto;background:#275b77;border:1px solid #5c9ab9;padding:5px 6px;font-size:9px;font-weight:800}

/* Visor de emisión ampliado sin alterar el ancho ni la distribución de los decks */
.player .screen{height:128px;min-height:128px;padding:10px 12px;justify-content:flex-start;gap:4px;overflow:hidden}
.player .screen .track{font-size:20px;line-height:1.15;font-weight:900;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.player .screen .artist{font-size:13px;font-weight:750;color:#d4e8f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .screen .full-route{font-size:10px;color:#96b8cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;min-height:12px}
.player .screen .screen-countdown{display:flex;align-items:baseline;gap:8px;color:#c4d9e8;font-size:10px;font-weight:800;margin-top:auto;letter-spacing:.06em}
.player .screen .screen-countdown strong{font:900 23px ui-monospace,monospace;color:#f3f9ff;letter-spacing:.02em}
.player .footer>.air[data-live="true"]{animation:rmOnlyRedBlink .62s steps(1,end) infinite!important}

/* Playlist auxiliar: sólo título y cruz de eliminación; todo el transporte arriba */
.player .below .aux-youtube-item .aux-remove{flex:0 0 23px;width:23px;height:23px;line-height:1;padding:0;font-size:18px;font-weight:900;background:#6b2332;border-color:#bb6475;color:#fff}
.player .below .aux-youtube-item .aux-remove:hover{background:#a72b43}

/* Ficha radial compacta del tema, sin modificar las columnas del estudio */
.player .screen{height:166px;min-height:166px}
.player .screen .rm-song-facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;color:#d7e8f4;line-height:1.35}
.player .screen .rm-song-facts span{min-width:0}
.player .screen .rm-song-facts b{color:#9cc7df}
.player .screen .rm-intro-edit{background:#16384b;color:#fff;border:1px solid #587d96;border-radius:3px;width:48px;padding:2px 3px;font-size:10px;font-family:ui-monospace,monospace}
.player .screen .rm-intro-edit:focus{outline:1px solid #9cdfff}

/* Vúmetros estéreo decorativos a la derecha del visor: sólo activos al sonar */
.player .screen{position:relative;padding-right:67px}
.player .rm-vu{position:absolute;right:10px;top:10px;bottom:10px;width:43px;display:flex;gap:5px;align-items:stretch;justify-content:center;border-left:1px solid #35576c;padding-left:8px}
.player .rm-vu-channel{height:100%;width:13px;display:flex;flex-direction:column-reverse;gap:3px}
.player .rm-vu-segment{flex:1;min-height:2px;border-radius:2px;background:#223846;opacity:.55}
.player .rm-vu-segment.lit{opacity:1;background:#3fd887;box-shadow:0 0 4px #3fd88766}
.player .rm-vu-segment.lit.high{background:#f5bf45;box-shadow:0 0 4px #f5bf4566}
.player .rm-vu-segment.lit.peak{background:#f54a52;box-shadow:0 0 5px #f54a5277}
@media(max-width:680px){.player .screen{padding-right:60px}.player .rm-vu{right:7px;width:40px}}
.player .below .aux-youtube-item .aux-doubleplay{cursor:pointer;user-select:none;flex:1}.player .below .aux-youtube-item .aux-doubleplay:hover{color:#9bdfff}.player .below .aux-youtube-item[data-active=true] .aux-doubleplay{color:#a7e6ff;font-weight:800}

/* Señal inequívoca de aire: alterna rojo encendido y apagado, no sólo dos tonos rojos. */
@keyframes rmAirVisibleFlash{
  0%,47%{background-color:#f31b34!important;color:#fff!important;border-color:#ff8696!important;box-shadow:0 0 12px #f31b34cc!important;opacity:1}
  48%,100%{background-color:#182e3c!important;color:#9db1c0!important;border-color:#4d6677!important;box-shadow:none!important;opacity:.38}
}
.player .footer>.air[data-live="true"]{animation:rmAirVisibleFlash .7s step-end infinite!important;will-change:background-color,opacity}
.player .footer>.air[data-live="false"]{animation:none!important;opacity:1}

/* Los controles con estado activo parpadean hasta desactivarlos. */
@keyframes rmControlActiveBlink{
  0%,49%{background-color:#e51d35!important;border-color:#ff9aa6!important;color:#fff!important;box-shadow:0 0 11px #ed203aaa!important}
  50%,100%{background-color:#203c4d!important;border-color:#54788e!important;color:#a9c1d1!important;box-shadow:none!important}
}
.player .buttons button[aria-pressed="true"],
.player .buttons button[data-running="true"],
.player .buttons button[data-flash="true"]{
 animation:rmControlActiveBlink .7s step-end infinite!important
}

/* Separador activo: parpadeo de encendido/apagado inequívoco. */
@keyframes rmSeparatorOnOff{
  0%,49%{background:#ff203c!important;color:white!important;border-color:#fff!important;box-shadow:0 0 14px 3px #ff203cbb!important;opacity:1}
  50%,100%{background:#162b39!important;color:#9eb1bf!important;border-color:#516b7d!important;box-shadow:none!important;opacity:.35}
}
.separator-pad .sep-cell button[data-playing="true"]{
 animation:rmSeparatorOnOff .65s step-end infinite!important;
 will-change:background-color,opacity
}

/* Acabado blanco ceniza estilo Apple para controles, sin alterar dimensiones ni disposición. */
.player .buttons button,
.player .separator-pad .sep-cell button,
.player .separator-pad button,
.player .aux-remove,
.player .suggestion-load,
.player .suggestion-play{
 background:#e8e9eb!important;
 color:#25282d!important;
 border-color:#c4c8ce!important;
 box-shadow:inset 0 1px 0 #ffffffb8,0 1px 3px #00000018;
}
.player .buttons button:hover,
.player .separator-pad .sep-cell button:hover{
 background:#f6f7f8!important;
 color:#17191c!important;
}
@keyframes rmAppleActiveFlash{
 0%,49%{background:#fafbfc!important;color:#17191c!important;border-color:#fff!important;box-shadow:0 0 12px #ffffffbb!important;opacity:1}
 50%,100%{background:#8e949d!important;color:#22262c!important;border-color:#747b84!important;box-shadow:none!important;opacity:.65}
}
.player .buttons button[aria-pressed="true"],
.player .buttons button[data-running="true"],
.player .buttons button[data-flash="true"],
.player .separator-pad .sep-cell button[data-playing="true"]{
 animation:rmAppleActiveFlash .65s step-end infinite!important;
}
</style></head>
<body><main><div class="players" id="players"></div></main>
<script>
const icons=[['back','⏪','Retroceder 10 segundos'],['play','▶','Reproducir'],['pause','⏸','Pausar'],['stop','■','Detener'],['next','⏭','Siguiente tema'],['repeat','↻','Repetir tema'],['forward','⏩','Adelantar 10 segundos']];
const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
function buildPlayer(number){
 const root=document.createElement('section');root.className='player';root.setAttribute('aria-label','Reproductor '+number);
 root.innerHTML='<div class="heading"><h2>REPRODUCTOR '+number+'</h2><span class="state">LISTO</span></div><div class="screen"><div class="track">Sin tema cargado</div><div class="artist">Seleccioná archivos de audio para reproducir</div><div class="full-route" title="Ruta completa del audio">—</div><div class="screen-countdown">RESTANTE <strong>--:--</strong></div></div><div class="timeline"><span class="time elapsed">00:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Posición de reproducción"><span class="time remaining">-00:00</span></div><div class="buttons"></div><div class="volume"><span>VOLUMEN</span><input class="vol" type="range" min="0" max="100" value="85" aria-label="Volumen"><span class="volvalue">85%</span></div><div class="footer"><span class="air" data-live="false">EN EL AIRE</span><label class="file">＋ CARGAR AUDIO<input type="file" accept="audio/*" multiple></label></div>';
 const $=sel=>root.querySelector(sel),audio=new Audio();audio.preload='metadata';audio.volume=.85;
 let tracks=[],idx=-1,repeat=false,urls=[];
 const setState=t=>$('.state').textContent=t;
 function load(i,autoplay){if(i<0||i>=tracks.length)return;idx=i;audio.src=tracks[i].url;$('.track').textContent=tracks[i].name;$('.artist').textContent=tracks[i].name.includes(' - ')?tracks[i].name.split(' - ')[0]:'ARCHIVO LOCAL';$('.full-route').textContent=tracks[i].name;$('.full-route').title=tracks[i].name;$('.seek').value=0;setState('CARGADO');if(autoplay)audio.play().catch(()=>setState('TOCÁ PLAY'))}
 const actions={back:()=>{audio.currentTime=Math.max(0,(audio.currentTime||0)-10)},play:()=>{if(idx<0&&tracks.length)load(0,false);if(idx>=0)audio.play().catch(()=>setState('TOCÁ PLAY'))},pause:()=>audio.pause(),stop:()=>{audio.pause();audio.currentTime=0;setState('DETENIDO')},next:()=>{if(idx+1<tracks.length)load(idx+1,true)},repeat:()=>{repeat=!repeat;root.querySelector('[data-action="repeat"]').setAttribute('aria-pressed',String(repeat))},forward:()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,(audio.currentTime||0)+10)}};
 for(const [id,symbol,title] of icons){const btn=document.createElement('button');btn.type='button';btn.textContent=symbol;btn.title=title;btn.setAttribute('aria-label',title);btn.dataset.action=id;if(id==='repeat')btn.setAttribute('aria-pressed','false');btn.addEventListener('click',actions[id]);$('.buttons').append(btn)}
 $('.file input').addEventListener('change',e=>{audio.pause();urls.forEach(URL.revokeObjectURL);urls=[];tracks=Array.from(e.target.files||[]).map(f=>{const url=URL.createObjectURL(f);urls.push(url);return {url,name:f.name.replace(/\.[^.]+$/,'')}});idx=-1;if(tracks.length)load(0,false)});
 $('.vol').addEventListener('input',e=>{audio.volume=Number(e.target.value)/100;$('.volvalue').textContent=e.target.value+'%'});
 $('.seek').addEventListener('input',e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(e.target.value)/1000});
 audio.addEventListener('timeupdate',()=>{const d=audio.duration;$('.elapsed').textContent=fmt(audio.currentTime);$('.remaining').textContent='-'+fmt(Number.isFinite(d)?d-audio.currentTime:0);$('.screen-countdown strong').textContent=Number.isFinite(d)?fmt(Math.max(0,d-audio.currentTime)):'--:--';$('.seek').value=Number.isFinite(d)&&d>0?Math.round(audio.currentTime/d*1000):0});
 audio.addEventListener('loadedmetadata',()=>{$('.remaining').textContent='-'+fmt(audio.duration);$('.screen-countdown strong').textContent=fmt(audio.duration)});
 audio.addEventListener('play',()=>{setState('REPRODUCIENDO');$('.air').dataset.live='true'});
 audio.addEventListener('pause',()=>{if(!audio.ended)setState('PAUSADO');$('.air').dataset.live='false'});
 audio.addEventListener('ended',()=>{if(repeat){audio.currentTime=0;audio.play().catch(()=>{})}else if(idx+1<tracks.length)load(idx+1,true);else{setState('FINALIZADO');$('.air').dataset.live='false';$('.screen-countdown strong').textContent='00:00'}});
 audio.addEventListener('error',()=>{setState('ERROR DE AUDIO');$('.air').dataset.live='false'});
 return root
}
document.getElementById('players').append(buildPlayer(1),buildPlayer(2));

const decks=[...document.querySelectorAll('.player')];
const makePanel=(title)=>{const panel=document.createElement('section');panel.className='below';const h=document.createElement('h3');h.textContent=title;panel.append(h);return panel};
const blockPanel=makePanel('BLOQUES DEL PROGRAMA'),auxPanel=makePanel('PLAYLIST AUXILIAR');
decks[0].append(blockPanel);decks[1].append(auxPanel);
const blocks=[[],[],[],[]],auxFiles=[];let activeBlock=0;
const tabs=document.createElement('div');tabs.className='tabs';blockPanel.append(tabs);
const blockItems=document.createElement('div');blockItems.className='items';blockPanel.append(blockItems);

/* Indicadores operativos: PLAY en marcha, PAUSA sostenida, REPETIR sostenido y pulsos para desplazamiento. */
(function(){
 document.querySelectorAll('.player').forEach(deck=>{
  const get=id=>deck.querySelector('.buttons [data-action="'+id+'"]');
  const play=get('play'),pause=get('pause'),air=deck.querySelector('.air');
  if(!play||!pause||!air)return;
  let paused=false;
  const sync=()=>{
   const active=air.dataset.live==='true';
   if(active)paused=false;
   play.dataset.running=String(active);
   pause.dataset.running=String(paused&&!active);
   play.setAttribute('aria-pressed',String(active));
   pause.setAttribute('aria-pressed',String(paused&&!active));
  };
  new MutationObserver(sync).observe(air,{attributes:true,attributeFilter:['data-live']});
  deck.querySelectorAll('.buttons button').forEach(btn=>{
   const action=btn.dataset.action;
   if(['back','forward','next'].includes(action)){
    let timer;
    btn.addEventListener('click',()=>{
     btn.dataset.flash='false';void btn.offsetWidth;btn.dataset.flash='true';
     clearTimeout(timer);timer=setTimeout(()=>{btn.dataset.flash='false'},1150);
    });
   }
   if(action==='pause')btn.addEventListener('click',()=>{paused=true;sync()});
   if(['play','stop','next'].includes(action))btn.addEventListener('click',()=>{paused=false;sync()});
  });
  sync()
 })
})();
/* Vúmetros ficticios: animación estéreo ligada al estado real de reproducción. */
(function(){
 const meters=[...document.querySelectorAll('.player')].map(deck=>{
  const screen=deck.querySelector('.screen'),meter=document.createElement('div');
  meter.className='rm-vu';meter.setAttribute('aria-label','Vúmetro estéreo decorativo');
  const channels=[0,1].map(()=>{
   const col=document.createElement('div');col.className='rm-vu-channel';
   const bars=Array.from({length:13},(_,i)=>{const s=document.createElement('span');s.className='rm-vu-segment';col.append(s);return s});
   meter.append(col);return bars
  });
  screen.append(meter);return {deck,channels,levels:[0,0]}
 });
 setInterval(()=>{
  meters.forEach(({deck,channels,levels})=>{
   const active=deck.querySelector('.air')?.dataset.live==='true';
   channels.forEach((bars,ch)=>{
    const target=active?3+Math.random()*10:0;
    levels[ch]=active?Math.max(0,Math.min(13,levels[ch]*.28+target*.72)):0;
    const count=Math.round(levels[ch]);
    bars.forEach((bar,i)=>{bar.className='rm-vu-segment'+(i<count?' lit'+(i>=11?' peak':i>=8?' high':''):'')})
   })
  })
 },115)
})();

 function playChoice(x){if(!x)return;let index=ytQueue.findIndex(t=>t.id===x.id);if(index<0){add(x);index=ytQueue.findIndex(t=>t.id===x.id)}if(index>=0)playIndex(index);field.value='';setSuggestions([])}
 function setSuggestions(items,keepSelection=false){
  const prior=keepSelection&&selected>=0?suggestions[selected]?.id:null;
  const seen=new Set();suggestions=items.filter(x=>x&&x.id&&!seen.has(x.id)&&seen.add(x.id)).slice(0,12);
  selected=prior?suggestions.findIndex(x=>x.id===prior):-1;suggestionBox.replaceChildren();
  suggestions.forEach((x,i)=>{
   const row=document.createElement('div');row.className='suggestion';row.setAttribute('role','option');row.setAttribute('aria-selected',String(i===selected));
   const play=document.createElement('button');play.type='button';play.className='suggestion-play';play.title='Reproducir ahora';play.textContent=(x.source==='production'?'RM · ':'YT · ')+x.title+' — '+(x.artist||'');
   play.onclick=()=>playChoice(x);
   const load=document.createElement('button');load.type='button';load.className='suggestion-load';load.textContent='CARGAR';load.title='Agregar a la playlist de la derecha sin interrumpir la reproducción';
   load.onclick=()=>{add(x);status('Cargado a la derecha: '+x.title)};
   row.append(play,load);suggestionBox.append(row)
  })
 }
 async function lookup(query){const response=await fetch('/api/ytmusic-search?q='+encodeURIComponent(query),{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'No se pudo buscar');return (data.results||[]).filter(x=>x.id&&x.title)}
 function startSearch(query){
  clearTimeout(searchTimer);const seq=++searchSeq;
  const local=localSearch(query);setSuggestions(local);if(!query)return;
  status(local.length?'Producción RM primero · después YouTube Music':'Buscando en YouTube Music…');
  searchTimer=setTimeout(async()=>{try{
   const found=await lookup(query+' High Quality Audio');
   if(seq!==searchSeq||field.value.trim()!==query)return;
   results=[...local,...found];setSuggestions(results,true);
   status(local.length+' de producción RM · '+found.length+' de YouTube Music · Enter reproduce · CARGAR agrega a la derecha');
  }catch(e){if(seq===searchSeq){results=local;setSuggestions(local,true);status(local.length?'Producción RM disponible · YouTube no respondió':'Error de YouTube: '+e.message)}}
  },220)
 }
 field.addEventListener('input',()=>startSearch(field.value.trim()));
 field.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!suggestions.length)return;e.preventDefault();selectSuggestion(selected<0?(e.key==='ArrowDown'?0:suggestions.length-1):(selected+(e.key==='ArrowDown'?1:-1)+suggestions.length)%suggestions.length)}
  else if(e.key==='Enter'&&suggestions.length){e.preventDefault();e.stopPropagation();playChoice(suggestions[selected>=0?selected:0])}
  else if(e.key==='Escape'){setSuggestions([])}
 });
 form.onsubmit=e=>{e.preventDefault();const query=field.value.trim();if(!query)return;if(suggestions.length){playChoice(suggestions[selected>=0?selected:0]);return}startSearch(query)};
 // El reproductor 2 controla YouTube, sin cambiar los controles ni el diseño.
 for(const action of ['play','pause','stop','next','back','forward','repeat']){
  const btn=deck.querySelector('[data-action="'+action+'"]');if(!btn)continue;
  btn.addEventListener('click',e=>{e.stopImmediatePropagation();e.preventDefault();
   if(action==='play'){if(current<0&&ytQueue.length)playIndex(0);else if(stopRequested&&current>=0)playIndex(current);else if(activeProduction)productionAudio.play().catch(()=>{});else if(ready&&current>=0)player.playVideo();else status('Cargando motor de YouTube…')}
   if(action==='pause'){if(activeProduction)productionAudio.pause();else if(ready)player.pauseVideo()}
   if(action==='stop')stop();
   if(action==='next')next();
   if(action==='back'){if(activeProduction)productionAudio.currentTime=Math.max(0,productionAudio.currentTime-10);else if(ready)player.seekTo(Math.max(0,(player.getCurrentTime()||0)-10),true)}
   if(action==='forward'){if(activeProduction)productionAudio.currentTime=Math.min(productionAudio.duration||0,productionAudio.currentTime+10);else if(ready)player.seekTo(Math.min(player.getDuration()||0,(player.getCurrentTime()||0)+10),true)}
   if(action==='repeat'){repeat=!repeat;btn.setAttribute('aria-pressed',String(repeat))}
  },true)
 }
 seek.addEventListener('pointerdown',()=>dragging=true,true);
 seek.addEventListener('input',()=>{dragging=true;if(current>=0){const d=activeProduction?productionAudio.duration||0:ready?player.getDuration()||0:0;elapsed.textContent=fmtAux(d*Number(seek.value)/1000)}},true);
 seek.addEventListener('change',e=>{if(current>=0){const d=activeProduction?productionAudio.duration||0:ready?player.getDuration()||0:0;if(activeProduction)productionAudio.currentTime=d*Number(seek.value)/1000;else if(ready)player.seekTo(d*Number(seek.value)/1000,true)}dragging=false;e.stopImmediatePropagation()},true);
 seek.addEventListener('pointerup',()=>{if(current>=0){const d=activeProduction?productionAudio.duration||0:ready?player.getDuration()||0:0;if(activeProduction)productionAudio.currentTime=d*Number(seek.value)/1000;else if(ready)player.seekTo(d*Number(seek.value)/1000,true)}dragging=false},true);
 vol.addEventListener('input',()=>{if(activeProduction)productionAudio.volume=Number(vol.value)/100;else if(ready)player.setVolume(Number(vol.value)||0)},true);
 productionAudio.addEventListener('playing',()=>{if(activeProduction)live(true)});productionAudio.addEventListener('pause',()=>{if(activeProduction)live(false)});productionAudio.addEventListener('ended',()=>{if(!activeProduction||stopRequested)return;if(repeat)playIndex(current);else next()});
 function initializeYT(){if(!window.YT?.Player){setTimeout(initializeYT,200);return}
 player=new YT.Player(ytHost,{height:'1',width:'1',playerVars:{playsinline:1,controls:0,origin:location.origin},events:{
  onReady:()=>{ready=true;state.textContent='LISTO';status('YouTube Music listo · buscá o elegí un tema');player.setVolume(Number(vol.value)||85)},
  onStateChange:e=>{if(activeProduction)return;if(e.data===YT.PlayerState.PLAYING)live(true);else if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED||e.data===YT.PlayerState.CUED)live(false);if(e.data===YT.PlayerState.ENDED&&!stopRequested&&!activeProduction){if(repeat&&current>=0)playIndex(current);else next()}update()},
  onError:e=>{live(false);status('Video no reproducible ('+e.data+'). Probá otro resultado.')},
  onAutoplayBlocked:()=>status('El navegador requiere pulsar PLAY para habilitar YouTube.')
 }})}
 if(window.YT?.Player)initializeYT();else{const prior=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(typeof prior==='function')prior();initializeYT()};if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script)}}
 setInterval(update,300);render();status('Buscador Beta 3 · YouTube Music y 14 audios de producción RM');
})();
</script></body></html>
