name: Paquetes de prueba de MEGAHERTZ
on:
  workflow_dispatch:
  push:
    branches: [estudio-linux-tres-plataformas]
permissions:
  contents: write
jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Preparar consola
        run: node desktop/prepare.cjs
      - name: Probar lanzador
        run: node desktop/smoke.cjs
      - name: Empaquetar
        working-directory: desktop
        run: npm run package:${{ matrix.target }}
      - name: Comprimir Linux
        if: matrix.target == 'linux'
        shell: bash
        run: tar -C desktop/dist -czf desktop/MegaHertz-Linux-x64.tar.gz 'MegaHertz Beta 5-linux-x64'
      - name: Comprimir Windows
        if: matrix.target == 'win'
        shell: pwsh
        run: Compress-Archive -Path 'desktop/dist/MegaHertz Beta 5-win32-x64' -DestinationPath 'desktop/MegaHertz-Windows-x64.zip'
      - name: Comprimir Mac
        if: matrix.target == 'mac'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'desktop/dist/MegaHertz Beta 5-darwin-x64/MegaHertz Beta 5.app' desktop/MegaHertz-Mac-Intel.zip
          ditto -c -k --sequesterRsrc --keepParent 'desktop/dist/MegaHertz Beta 5-darwin-arm64/MegaHertz Beta 5.app' desktop/MegaHertz-Mac-Apple-Silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MegaHertz-${{ matrix.target }}
          path: |
            desktop/MegaHertz-*.zip
            desktop/MegaHertz-*.tar.gz
          if-no-files-found: error
  publicar-beta:
    needs: builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MegaHertz-*
          path: paquetes
          merge-multiple: true
      - name: Publicar archivos beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f paquetes/MegaHertz-Linux-x64.tar.gz
          test -f paquetes/MegaHertz-Windows-x64.zip
          test -f paquetes/MegaHertz-Mac-Intel.zip
          test -f paquetes/MegaHertz-Mac-Apple-Silicon.zip
          if ! gh release view estudio-beta-tres >/dev/null 2>&1; then
            gh release create estudio-beta-tres --target "${{ github.sha }}" --prerelease --title "MEGAHERTZ Estudio · beta para pruebas" --notes "Paquetes beta sin firma, pendientes de pruebas de emisión y de hardware real. En Linux Wayland el retorno por inactividad se desactiva."
          fi
          gh release upload estudio-beta-tres paquetes/MegaHertz-* --clobber
