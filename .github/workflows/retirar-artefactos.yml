name: Retirar archivos de compilación públicos
on:
  push:
    branches: [estudio-linux-tres-plataformas]
permissions:
  actions: write
  contents: read
jobs:
  retirar:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar artefactos de instaladores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "MegaHertz-linux" or .name == "MegaHertz-win" or .name == "MegaHertz-mac") | .id' > /tmp/megahertz-artifacts
          while read -r id; do
            [ -n "$id" ] && gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done < /tmp/megahertz-artifacts
