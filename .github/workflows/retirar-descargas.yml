name: Retirar descargas públicas
on:
  push:
    branches: [estudio-linux-tres-plataformas]
permissions:
  contents: write
jobs:
  retirar:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar publicación y archivos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete estudio-beta-tres --yes --cleanup-tag
